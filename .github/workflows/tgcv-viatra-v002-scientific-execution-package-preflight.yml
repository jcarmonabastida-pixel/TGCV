name: TGCV VIATRA V002 Scientific Execution Package Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-execution-package-preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact execution ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify canonical implementation commit is an ancestor
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="8bef1d02c23b58dc5d5165b8aff51b264d4fd52f"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          echo "TGCV_V002_CANONICAL_IMPLEMENTATION_COMMIT=$EXPECTED"
          echo "TGCV_V002_EXECUTION_PACKAGE_HEAD=$(git rev-parse HEAD)"

      - name: Verify scientific execution contract
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_WORKFLOW_CONTRACT_v001.md"
          GATE="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION_GATE_001.json"
          test -f "$CONTRACT"
          test -f "$GATE"
          grep -q "scientific_execution_authorized: false" "$GATE"
          grep -q "This contract does not authorize scientific execution." "$CONTRACT"
          echo "TGCV_V002_EXECUTION_AUTHORIZATION_FIREWALL=PASS"

      - name: Verify frozen fixture manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION_GATE_001.json"
          grep -q '"artifact_id": "TGCV_VIATRA_MINIMAL_FIXTURE_v002"' "$MANIFEST"
          grep -q '"status": "FIXTURE_FROZEN"' "$MANIFEST"
          grep -q '"sha256": "8d432da0d3fd49ba88f809611f222614ef588809691e66bcc954a4cd509f66bb"' "$MANIFEST"
          grep -q '"sha256": "fea5bc84929e99145ebe07f4eabeb1d04eaceb805b3e35d7975aff793bd9af8e"' "$MANIFEST"
          grep -q '"sha256": "92addffad49e828a8c3c7f0ca7b00c870f00e9c419415c3b997e06cc36b0e966"' "$MANIFEST"
          grep -q '"sha256": "1ce4c0c69f324e43d87b41dee2561a55668d06c815294919011a2d5c3d1d88c1"' "$MANIFEST"
          grep -q '"sha256": "29ebb291e72ff061618aa809af2e16527464f2475e21bfe558de00bd36de33e3"' "$MANIFEST"
          echo "TGCV_V002_FIXTURE_MANIFEST=PASS"

      - name: Verify technical preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION_GATE_001.json"
          grep -q '"observer_listener_p3_p4_workflow_run": 37665561065' "$MANIFEST"
          grep -q '"pf09_runtime_equivalence_workflow_run": 37074926235' "$MANIFEST"
          grep -q '"scientific_firewall_status": "PASS"' "$MANIFEST"
          echo "TGCV_V002_TECHNICAL_EVIDENCE=PASS"

      - name: Verify scientific entry point governance
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_WORKFLOW_CONTRACT_v001.md"
          grep -q "exact scientific entry point" "$CONTRACT"
          grep -q "once that entry point has been separately defined and preflighted" "$CONTRACT"
          echo "TGCV_V002_ENTRY_POINT_GOVERNANCE=PASS"

      - name: Scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude-dir=target --exclude-dir=.git             'scientific_execution_authorized[[:space:]]*:[[:space:]]*true|ALLOW_AND_EXECUTE'             05_IMPLEMENTATION/viatra-v002-observer-host; then
            echo "FAIL: scientific execution authorization marker detected"
            exit 1
          fi
          echo "TGCV_V002_SCIENTIFIC_FIREWALL=PASS"

      - name: Final package preflight decision
        shell: bash
        run: |
          set -euo pipefail
          echo "TGCV_V002_SCIENTIFIC_EXECUTION_PACKAGE_PREFLIGHT=PASS"
          echo "TGCV_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION=NOT_GRANTED"
