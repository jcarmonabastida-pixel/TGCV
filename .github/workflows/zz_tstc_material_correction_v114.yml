name: TGCV TSTC material correction v1.14

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build cumulative v1.14 with autocontained TSTC material evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          old = root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.13.md'
          current = root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md'
          pointer = root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md'
          canonical = root/'00_GOVERNANCE/CANONICAL_STATE.json'
          status = root/'STATUS.md'

          text = old.read_text(encoding='utf-8')
          marker = '## Material methodological evidence — TSTC v004 Application-Fit Demonstrator'
          if marker not in text:
              raise SystemExit('Expected TSTC material section not found in v1.13')
          pre = text.split(marker,1)[0].rstrip()

          # Preserve v1.13's complete cumulative content and replace only its
          # abbreviated TSTC material section. Everything before the marker is
          # retained byte-for-byte except the version/header policy block.
          header = '''# TGCV — Evidence-to-Claim Matrix — Current v1.14

**Status:** GOVERNANCE CONTROL ARTIFACT — CURRENT  
**Date:** 2026-09-17  
**Predecessor:** v1.13  
**Incremental governance update:** v1.14 preserves the complete material evidentiary content and schema of v1.13. This documentation correction expands the TSTC v004 material section into an autocontained evidentiary record derived from the frozen execution, post-execution audit and evidence-to-claim propagation record. No evidence is deleted, collapsed, or downgraded; no claim-level status is changed.

**TSTC material-section correction:** The previously abbreviated TSTC v004 material record is replaced by a self-contained account covering provenance, frozen scope, execution contract, fixture-level results, baseline reconstruction, comparison dimensions, negative controls, cross-domain propagation, trajectory checks, claim routing, interpretation limits and closure.

## Matrix preservation rule
This matrix is cumulative. Every new version MUST preserve the full evidentiary content and schema of its predecessor and add, qualify, bound, supersede, or explicitly retire information. A version MUST NOT silently reduce the number of claim-matrix columns, remove material evidence descriptions, collapse evidence basis into summary-only fields, or replace detailed evidence records with a short status table.

`EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md` is a stable alias of the complete versioned current matrix; it MUST NOT be a simplified derivative.

## Material evidence propagation rule
A material experimental result is propagated to this matrix when it adds, removes, qualifies, bounds, or otherwise changes the evidentiary basis or interpretation of a claim, even when no claim status/level changes. Claim upgrade is a separate decision and is never inferred merely from evidence propagation.

**Operational rule:** Evidence propagation does not imply claim upgrade. A claim-level upgrade requires an explicit claim-level consolidation record.

**Material-section completeness rule:** Every material evidence item propagated into one or more claim rows MUST have a corresponding enriched `Material ... evidence` section in the same matrix version. The claim table is the routing/index layer; the material-evidence section is the developed evidentiary record. Table-only references are insufficient. This rule applies equally to foundational/base experiments and later experiments. The integrity check is bidirectional: `material evidence item in claim table ↔ corresponding enriched material-evidence section`.

'''
          body = pre.split('## Current claim matrix',1)[1]
          body = '## Current claim matrix\n' + body
          body = body.split(marker,1)[0].rstrip()

          tstc = '''## Material methodological evidence — TSTC v004 Application-Fit Demonstrator

**Case:** `TSTC — Synthetic Fixture-003 / Freeze-003`  
**Status:** `CLOSED — BOUNDED METHODOLOGICAL EVIDENCE REGISTERED`  
**Execution mode:** `TSTC_SYNTHETIC_EXECUTION_V004`  
**Fixture version:** `003`  
**Execution artifact:** `03_EXPERIMENTS/TSTC/tstc_execution_v004.py`  
**Post-execution audit:** `00_GOVERNANCE/SIP/TGCV_APPLICATION_FIT_WP2_TSTC_POST_EXECUTION_AUDIT_002.md`  
**Evidence-to-claim propagation:** `00_GOVERNANCE/SIP/TGCV_APPLICATION_FIT_WP2_TSTC_EVIDENCE_TO_CLAIM_PROPAGATION_001.md`  
**Execution source commit:** `bdb8477089b3b141ebf8231a9ad678cca9cbdce8`  
**Fixture manifest SHA-256:** `1ac8e7ca8c8a3e7afdc125a1d5021b386206205ec486664b362be0136e90bced`  
**Ruleset SHA-256:** `9a0c757ee8e166e991f60d898018a4ee424fae0e0e9c955458252ce7f56221c2`  
**Transformation-universe SHA-256:** `c6d4dfec24877318f466f7736f587557111d8524170f76b71e9596fe42868d3c`  
**Configuration SHA-256:** `ce274a9bc723989451b0ae2a5318efa92ccca86cf30c4403267a1c1123afaa84`  
**Output SHA-256:** `6afaffa091984b9b2e7823194b9170cfcdbef98f337d38d6f143f8c3e887bb38`  
**Environment:** Windows `10.0.26200`; Python `3.8.10`  
**Random seed:** `null`

### 1. Purpose and frozen scope

TSTC v004 is the executed form of the frozen **TGCV Application Fit — WP2 TSTC Minimum Demonstrator Specification 001**, using **Synthetic Fixtures Freeze-003** and **Execution Authorization Gate 003**. Its purpose is to test whether the TGCV translation representation can be instantiated reproducibly across heterogeneous synthetic domains while explicitly representing how a state/context transition changes the accessible transformation space and how that change relates to a bounded subsequent trajectory.

The demonstrator is methodological/application-fit evidence. It is not a scientific validation experiment, causal identification study, explanatory-superiority comparison, value/ROI test, industrial validation or deployment-readiness test. The execution covers the three frozen connector fixtures **FX-C01 technical orchestration**, **FX-C03 agent/tool/permission**, and **FX-C05 resource/constraint**.

The frozen execution contract requires explicit `fixture_id`, `fixture_version`, `connector_id`, `intervention_id`, `S0`, `C0`, `L_version`, `U_tau`, `T_acc_0`, transition, `S1`, `C1`, `T_acc_1`, `Delta_T_acc`, trajectory, baseline model, baseline representation, baseline reconstruction, comparison observations, limitations, non-claims and execution metadata. The contract therefore keeps the analytical layers distinct rather than collapsing state, accessibility, realized transformation and outcome into one variable.

### 2. Execution integrity and output contract

The executed result is `TSTC_EXECUTION_COMPLETE` under `TSTC_SYNTHETIC_EXECUTION_V004`, fixture version `003`, with source, fixture-manifest, ruleset, transformation-universe, configuration, environment, random-seed and output hashes recorded above. The v004 execution corrected the earlier v003 output-contract deficiency: all required fields are explicitly present in the three connector records.

The post-execution audit reports PASS for schema completeness, execution metadata, independent baseline reconstruction, the eight required comparison dimensions, negative controls, cross-domain propagation and trajectory/boundary checks. The eight comparison dimensions are: **(1)** transformation identities, **(2)** admissibility conditions, **(3)** state/context dependencies, **(4)** transition causing accessibility change, **(5)** cross-domain dependency, **(6)** trajectory consequence, **(7)** assumptions, and **(8)** information omitted.

The executor independently reconstructs a conventional baseline feasible-transformation representation for each connector. The three principal local comparisons are classified `EQUIVALENT_REPRESENTATION` within the frozen synthetic transformation universes. This establishes representational compatibility within the demonstrator; it does not establish explanatory superiority, predictive superiority or empirical validity.

### 3. Fixture-level reconstruction and results

**FX-C01 — technical orchestration.** The baseline is a finite-state/orchestration rule model. The intervention `trust_B: trusted → untrusted` changes the enabling condition for connector B. `c01.deploy_B` becomes inaccessible while `c01.deploy_A` and `c01.restrict_security` remain admissible. The post-transition `T_acc_1` therefore differs from `T_acc_0` through an explicit state/context-dependent admissibility rule, yielding a bounded `Delta_T_acc`. The subsequent bounded trajectory is restricted to transformations admissible under the post-transition condition. The baseline reconstruction independently produces the same feasible transformation set under the frozen rules.

**FX-C03 — agent/tool/permission.** The baseline is a capability/access-control matrix plus workflow model. The intervention `permission_repo: granted → denied` closes `c03.inspect_repo`, `c03.open_pr` and `c03.modify_repo`, while retaining `c03.query_db` and `c03.complete_task`. The record explicitly distinguishes the changed enabling condition, the resulting accessibility-space change and the subsequent bounded trajectory. The baseline reconstruction reproduces the same feasible transformation set under the frozen rule system.

**FX-C05 — resource/constraint.** The baseline is a finite constrained-resource feasibility model. The intervention `grid_capacity: high → low` closes `c05.start_A` and `c05.start_B` while retaining the other admissible transformations. The result represents a resource/constraint transition as a bounded change in accessibility and does not equate that change with a realized downstream outcome. The independently reconstructed baseline agrees on the feasible transformation set.

Across the three fixtures, the demonstrator therefore makes the chain `state/context transition → change in admissibility/accessibility → Delta_T_acc → bounded subsequent trajectory` explicit and machine-readable, while retaining the baseline representation rather than treating TGCV as the only admissible representation.

### 4. Negative controls

The three frozen negative controls `N-C01`, `N-C03` and `N-C05` all pass. Each produces an empty `Delta_T_acc` and no opened, closed or changed transformations. In `N-C01`, `routing` changes while accessibility remains unchanged. The controls therefore impose an important boundary: a change in a state/context variable is not automatically classified as an accessibility change; the accessibility predicate must actually change the admissibility of at least one candidate transformation.

These controls are methodological controls within the synthetic demonstrator. They do not establish the empirical validity of the TGCV accessibility predicate in external systems.

### 5. Controlled cross-domain propagation

**C01 → C03.** The declared synthetic rule `security = restricted → permission_repo = denied` propagates the C01 source condition into C03. The target accessibility space contracts accordingly, including closure of `c03.modify_repo`. The denied target scenario does not execute the closed transformation. This demonstrates an explicit cross-domain dependency path under a declared rule.

**C03 → C05.** The C03 source transition `c03.modify_repo` changes `repo` to `changed`. The declared synthetic rule propagates this condition to `mobility_requirement_A = urgent` in C05, closing `c05.redirect_A_to_B`. This demonstrates a second explicit cross-domain dependency path.

Both paths are **synthetic rule propagation**. They are not empirical causal estimates and must not be interpreted as real-world evidence of a universal cross-domain mechanism.

### 6. Trajectory, baseline and representation checks

Each local connector record contains a bounded trajectory composed only of transformations admissible in the corresponding post-transition `T_acc`. The record exposes the transition, post-transition state/context, accessible transformation space and subsequent bounded trajectory separately. This makes the representational chain inspectable without using downstream outcomes to define accessibility.

The conventional baseline representations independently reconstruct the same feasible transformation sets for the three local fixtures under their frozen rules. The observed category `EQUIVALENT_REPRESENTATION` therefore means that the TGCV representation and the conventional baseline encode the same bounded feasible transformation space in these synthetic cases. No metric of explanatory power, predictive accuracy, computational superiority or downstream performance was executed, so no superiority inference is permitted.

The result is thus evidence for **application-fit and representational completeness of the frozen contract**, not evidence that TGCV is scientifically superior to the baseline or that the same representation will necessarily transfer unchanged to real systems.

### 7. Evidence-to-claim routing

**Primary routing — C16.** TSTC v004 provides bounded methodological evidence that a single frozen execution contract can be instantiated across three heterogeneous synthetic connector types while preserving explicit distinctions among state/context, candidate transformation universe `U_tau`, admissibility/accessibility, `T_acc`, intervention, `Delta_T_acc`, bounded trajectory, baseline reconstruction, cross-domain dependency, omitted information and non-claims. This is the principal evidentiary contribution of the experiment.

**C02 — bounded qualification.** The demonstrator explicitly instantiates deterministic admissibility predicates and computes `T_acc` before and after intervention. Because the predicates and transformation universes are synthetic and specified by construction, this qualifies application-fit of the operational representation but does not independently validate general empirical accessibility.

**C08 — bounded qualification.** The demonstrator explicitly represents a bounded accessibility-space change followed by a bounded admissible trajectory and explicit post-transition state/context. It does not identify a causal estimand and does not establish empirical `Delta_T_acc → trajectory` validity.

**C11 — bounded qualification.** The three synthetic connector types plus two controlled cross-domain paths demonstrate methodological heterogeneity coverage under a common contract. This is synthetic heterogeneity evidence, not transversal empirical validation across real-world domains.

Claim statuses remain **C02 = E0, C08 = H, C11 = H, C16 = H**. No TGCV Core primitive, relation, threshold or falsification criterion is modified by TSTC v004.

### 8. Scientific and interpretive boundaries

TSTC v004 does **not** establish: scientific validity of TGCV; empirical causality; a causal `Delta_T_acc → trajectory` estimand; `Delta_T_acc → Delta_V`; value creation; ROI; explanatory superiority; predictive superiority; generality across real-world domains; industrial validation; or deployment readiness.

The predicates are rule-defined, the candidate transformation universes are frozen and bounded, the trajectories are generated within the demonstrator, and the cross-domain links are declared synthetic propagation rules. Consequently, the result cannot be interpreted as evidence that the same accessibility mechanism has been empirically identified in heterogeneous real-world systems. The negative controls further show only that the frozen synthetic implementation does not classify every changed context variable as an accessibility change; they do not validate the predicate outside the frozen fixtures.

The baseline comparison is similarly bounded. `EQUIVALENT_REPRESENTATION` establishes agreement of the reconstructed feasible transformation sets under the frozen rules; it does not establish superiority, explanatory uniqueness or lower computational cost.

### 9. Reproducibility and closure

The provenance fields and hashes above identify the exact execution inputs, ruleset, transformation universe, configuration and output associated with TSTC v004. The post-execution audit closes the run as conformant, and the propagation record closes the evidence registration as **`EVIDENCE_PROPAGATION_TSTC_001 = CLOSED — BOUNDED METHODOLOGICAL CONTRIBUTION`**.

The appropriate scientific interpretation is therefore: **TSTC v004 is closed bounded methodological/application-fit evidence that the frozen TGCV translation contract can represent state/context transitions, accessibility changes, bounded subsequent trajectories, baseline reconstructions, negative controls and declared cross-domain dependencies across three heterogeneous synthetic fixtures.** It is not authorization to reopen or repeat the TSTC execution and it does not change any claim-level status.

### 10. Canonical governance effect

This v1.14 correction changes the **documentation completeness of the evidence matrix**, not the underlying experiment. The v1.13 cumulative material evidence is preserved; the TSTC material record is expanded so that a reader of the matrix does not need to consult the separate execution/audit/propagation files merely to understand what TSTC v004 did and what it did not demonstrate. The canonical claim statuses, TGCV Core and RMA remain unchanged.
'''

          new_text = header + body + '\n\n' + tstc
          out = root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.14.md'
          out.write_text(new_text, encoding='utf-8')
          current.write_text(new_text, encoding='utf-8')

          pointer.write_text('''# TGCV — Evidence-to-Claim Matrix — CURRENT POINTER

**Status:** CURRENT CONTROL POINTER  
**Current matrix:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md`  
**Current version:** v1.14  
**Versioned artifact:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.14.md`  
**Predecessor:** v1.13  
**Established:** 2026-09-17  

This stable pointer resolves the active complete cumulative Evidence→Claim Matrix. Historical versions remain immutable. v1.14 expands the TSTC v004 material evidence section into an autocontained evidentiary record; no claim-level status is changed.

**Integrity rule:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md` MUST resolve to the complete content of the versioned current artifact and MUST NOT be a simplified derivative.
''', encoding='utf-8')

          c = json.loads(canonical.read_text(encoding='utf-8'))
          c['current_versions']['claim_matrix'] = 'v1.14'
          canonical.write_text(json.dumps(c, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          s = status.read_text(encoding='utf-8')
          s = re.sub(r'(Evidence→Claim Matrix[^\n]*?)(v1\.13)', r'\g<1>v1.14', s)
          s = s.replace('Canonical current versions: RMA `v3.35`, Evidence→Claim Matrix `v1.13`', 'Canonical current versions: RMA `v3.35`, Evidence→Claim Matrix `v1.14`')
          s += '\n\n## TSTC material-record correction\n- v1.14 expands the TSTC v004 material evidence section into an autocontained evidentiary record.\n- The underlying TSTC execution is unchanged.\n- Claim statuses, TGCV Core and RMA remain unchanged.\n'
          status.write_text(s, encoding='utf-8')
          PY

          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.14.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md 00_GOVERNANCE/CANONICAL_STATE.json STATUS.md
          git commit -m "Expand TSTC material evidence and publish matrix v1.14"
          git push origin main

      - name: Remove one-shot correction workflow
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/zz_tstc_material_correction_v114.yml
          git commit -m "Remove one-shot TSTC material correction workflow"
          git push origin main
