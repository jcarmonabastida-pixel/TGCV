name: C10-S F1 numerical stress 001

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
    paths:
      - 00_GOVERNANCE/authorizations/C10S_F1_NUMERICAL_STRESS_AUTHORIZATION_001.json

permissions:
  contents: write

concurrency:
  group: c10s-f1-numerical-stress-001
  cancel-in-progress: false

jobs:
  numerical-stress:
    if: >-
      ${{ github.ref == 'refs/heads/research/c10s-f1-integrated-correction-20261119'
          && contains(github.event.head_commit.message, 'AUTHORIZE-C10S-F1-NUMERICAL-STRESS-20261119-001') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_PATH: 00_GOVERNANCE/authorizations/C10S_F1_NUMERICAL_STRESS_AUTHORIZATION_001.json
      AUTH_ID: C10S-F1-NUMERICAL-STRESS-20261119-001
      SOURCE_COMMIT: f19ae92bed172f502cceb89fd26e86b5e37c5227
      EVIDENCE_ROOT: ${{ runner.temp }}/c10s-f1-numerical-stress-evidence
      VENV: ${{ runner.temp }}/c10s-f1-numerical-stress-venv

    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: governance
          fetch-depth: 0
          persist-credentials: true

      - name: Validate explicit one-shot authorization
        working-directory: governance
        shell: bash
        env:
          APPROVAL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/c10s-f1-integrated-correction-20261119"
          printf '%s' "$APPROVAL_COMMIT_MESSAGE" | grep -F "AUTHORIZE-C10S-F1-NUMERICAL-STRESS-20261119-001"
          jq -e             --arg id "$AUTH_ID"             --arg commit "$SOURCE_COMMIT"             '
              .authorization_id == $id
              and .status == "APPROVED"
              and .execution_authorized == true
              and .approved_by_user == true
              and .one_shot == true
              and .consumed == false
              and .source_commit == $commit
              and .freeze_manifest == "03_EXPERIMENTS/C10-S/harness/C10S_F1_NUMERICAL_STRESS_FREEZE_MANIFEST_002.md"
              and .freeze_manifest_commit == "5463e5662f9095267369601789ccf541627893f6"
              and .workflow == ".github/workflows/c10s-f1-numerical-stress-001.yml"
              and .runtime.runner == "ubuntu-24.04"
              and .runtime.python == "3.12.3"
              and .runtime.numpy == "2.1.3"
              and .runtime.scipy == "1.14.1"
              and .command.working_directory == "03_EXPERIMENTS/C10-S/harness"
              and .command.argv == [
                "python",
                "run_c10s_f1_numerical_stress.py",
                "--source-commit",
                $commit,
                "--output-directory",
                "$RUNNER_TEMP/c10s-f1-numerical-stress-evidence"
              ]
              and .scope.polynomial_sturm_records == 115
              and .scope.f1_observation_scale_records == 7
              and .limits.primary_executions == 1
              and .limits.automatic_retries == 0
              and .limits.replay == false
              and .limits.job_timeout_minutes == 15
              and .prohibitions.unit_tests == true
              and .prohibitions.monte_carlo_calibration == true
              and .prohibitions.dgp_experiment == true
              and .prohibitions.inferential_coverage_study == true
              and .prohibitions.parameter_tuning == true
              and .prohibitions.external_dataset == true
              and .prohibitions.scientific_c10_execution == true
              and .prohibitions.source_modification_during_run == true
            ' "$AUTH_PATH"

      - name: Checkout frozen source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f19ae92bed172f502cceb89fd26e86b5e37c5227
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen commit and all source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          while IFS=' ' read -r expected relative_path; do
            actual="$(git -C source hash-object "$relative_path")"
            printf '%s %s %s\n' "$expected" "$actual" "$relative_path"
            test "$actual" = "$expected"
          done <<'EOF'
          80ff414e076b06de14ea1190dd9e877b6045b88f 03_EXPERIMENTS/C10-S/harness/c10s_f1_numerical_stress.py
          b08ee28a1423b7a6c598db69c0ef15dff5f0ac22 03_EXPERIMENTS/C10-S/harness/run_c10s_f1_numerical_stress.py
          39f1732e1571f9d0705378d924b58b9475277e7a 03_EXPERIMENTS/C10-S/harness/c10s_f1_between_profile_likelihood.py
          3ac9ce31eb82421022fd8d2a65a0daee049322be 03_EXPERIMENTS/C10-S/harness/c10s_f1_independent_root_isolator.py
          9fa1cb21cd47e32030db8a00420e7dacfdc77321 03_EXPERIMENTS/C10-S/harness/c10s_f1_root_adjudication.py
          6d193798e792dd5129fbfb0c312286763791d463 03_EXPERIMENTS/C10-S/harness/c10s_variance_comparison_interface.py
          EOF

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          check-latest: false

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --no-deps --only-binary=:all: numpy==2.1.3 scipy==1.14.1
          "$VENV/bin/python" - <<'PY'
          import sys, numpy, scipy
          assert ".".join(map(str, sys.version_info[:3])) == "3.12.3"
          assert numpy.__version__ == "2.1.3"
          assert scipy.__version__ == "1.14.1"
          print("PYTHON", sys.version)
          print("NUMPY", numpy.__version__)
          print("SCIPY", scipy.__version__)
          PY

      - name: Prepare execution provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          {
            echo "authorization_id=$AUTH_ID"
            echo "authorization_commit=$GITHUB_SHA"
            echo "frozen_source_commit=$SOURCE_COMMIT"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "python_version=$("$VENV/bin/python" --version 2>&1)"
            echo "platform=$(uname -a)"
            echo "working_directory=$GITHUB_WORKSPACE/source/03_EXPERIMENTS/C10-S/harness"
            echo "execution_count=1"
            echo "replay=false"
          } > "$EVIDENCE_ROOT/workflow-preflight.txt"

      - name: Consume one-shot authorization before primary execution
        working-directory: governance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$VENV/bin/python" - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("00_GOVERNANCE/authorizations/C10S_F1_NUMERICAL_STRESS_AUTHORIZATION_001.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "APPROVED" or data.get("consumed") is not False:
              raise SystemExit("AUTHORIZATION_NOT_AVAILABLE_OR_ALREADY_CONSUMED")
          data["status"] = "CONSUMED"
          data["consumed"] = True
          data["consumed_by_run_id"] = "${{ github.run_id }}"
          data["consumed_at_utc"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AUTH_PATH"
          git commit -m "Consume one-shot authorization C10S-F1-NUMERICAL-STRESS-20261119-001 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Run authorized deterministic numerical stress once
        working-directory: source/03_EXPERIMENTS/C10-S/harness
        shell: bash
        run: |
          set +e
          "$VENV/bin/python" run_c10s_f1_numerical_stress.py \
            --source-commit "$SOURCE_COMMIT" \
            --output-directory "$EVIDENCE_ROOT" \
            > "$EVIDENCE_ROOT/runner.stdout" \
            2> "$EVIDENCE_ROOT/runner.stderr"
          code=$?
          printf '%s\n' "$code" > "$EVIDENCE_ROOT/runner-exit-code.txt"
          exit "$code"

      - name: Upload immutable numerical stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c10s-f1-numerical-stress-001-${{ github.run_id }}
          path: ${{ runner.temp }}/c10s-f1-numerical-stress-evidence/
          if-no-files-found: warn
          retention-days: 90
