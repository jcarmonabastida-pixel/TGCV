name: C10-S F5 M30/R20 raw-between M1 development screen

on:
  push:
    branches:
      - research/c10s-coverage-first-focus-20261127
    paths:
      - '.github/workflows/c10-s-f5-m30r20-raw-between-m1-development.yml'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_f5_m30r20_raw_between_dev.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_f5_m1_dev_pilot.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_functional_refit_bootstrap.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_likelihood_diagnostics.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_fixtures.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_comparative_holdout.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_post_holdout_f5_b2_b3_development_calibration.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_f5_g7_tiera_calibration.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_likelihood_diagnostics.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  m30r20-raw-between-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Compile focused development runner
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m py_compile run_c10s_f5_m30r20_raw_between_dev.py run_c10s_f5_m1_dev_pilot.py c10s_f5_functional_refit_bootstrap.py
      - name: Run bounded M30/R20 raw-between development screen
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B run_c10s_f5_m30r20_raw_between_dev.py --execute-development-only --output ${{ runner.temp }}/c10s-f5-m30r20-raw-between-m1-dev.json
      - name: Upload development-only artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-m30r20-raw-between-m1-development
          path: ${{ runner.temp }}/c10s-f5-m30r20-raw-between-m1-dev.json
          if-no-files-found: error
          retention-days: 30
