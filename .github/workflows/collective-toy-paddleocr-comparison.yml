name: Collective Toy PaddleOCR comparison

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/paddleocr-text-benchmark-001-20261014
    paths:
      - 'prototypes/collective_toy/web/ocr_quality_evaluation.html'
      - 'prototypes/collective_toy/web/export_ocr_text_fixtures.cjs'
      - 'prototypes/collective_toy/web/paddleocr_text_benchmark.py'
      - '.github/workflows/collective-toy-paddleocr-comparison.yml'

permissions:
  contents: read

jobs:
  paddleocr-text-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install browser test dependency
        working-directory: prototypes/collective_toy/web
        run: npm install
      - name: Install Chromium
        working-directory: prototypes/collective_toy/web
        run: npx playwright install --with-deps chromium
      - name: Export the exact synthetic text fixtures
        working-directory: prototypes/collective_toy/web
        run: node export_ocr_text_fixtures.cjs
      - name: Install CPU PaddleOCR
        run: python -m pip install --upgrade pip && python -m pip install paddlepaddle==2.6.2 paddleocr==2.9.1
      - name: Run PaddleOCR benchmark locally
        working-directory: prototypes/collective_toy/web
        run: python paddleocr_text_benchmark.py
      - name: Upload PaddleOCR report and fixture manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgcv-paddleocr-text-comparison
          path: |
            prototypes/collective_toy/web/paddleocr-result.json
            prototypes/collective_toy/web/paddleocr-fixtures/expected.json
          if-no-files-found: warn
          retention-days: 30
