name: Rust Omega U real-data preflight tests

on:
  workflow_dispatch:

jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run preflight contract tests only
        working-directory: 07_CODE/tests
        env:
          PYTHONPATH: ../src
        run: |
          set -euo pipefail
          python -m pytest -q test_real_data_preflight_v01.py
