name: Collective Toy browser performance benchmark

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Measurements per topology and size (3-20)"
        required: false
        default: "5"
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/collective_toy/web/index.html'
      - 'prototypes/collective_toy/web/browser_performance_benchmark.cjs'
      - '.github/workflows/collective-toy-browser-performance.yml'

permissions:
  contents: read

jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: prototypes/collective_toy/web
        run: npm ci
      - name: Install Chromium
        working-directory: prototypes/collective_toy/web
        run: npx playwright install --with-deps chromium
      - name: Run browser performance benchmark
        working-directory: prototypes/collective_toy/web
        env:
          BENCHMARK_REPEATS: ${{ github.event.inputs.repeats || '5' }}
        run: node browser_performance_benchmark.cjs --repeats "$BENCHMARK_REPEATS"
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-toy-browser-performance
          path: prototypes/collective_toy/web/browser-performance-results.json
          if-no-files-found: warn
          retention-days: 30
