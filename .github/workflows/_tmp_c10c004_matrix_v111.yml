name: _tmp_c10c004_matrix_v111
on:
  push:
    branches:
      - governance/c10c004-g4-matrix-v1.11
permissions:
  contents: write
jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update matrix and self-remove
        shell: python
        run: |
          from pathlib import Path
          p = Path('00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md')
          s = p.read_text(encoding='utf-8')
          assert 'Current v1.10' in s
          s = s.replace('# TGCV — Evidence-to-Claim Matrix — Current v1.10', '# TGCV — Evidence-to-Claim Matrix — Current v1.11', 1)
          s = s.replace('**Date:** 2026-09-15  \n**Predecessor:** v1.9  \n**Incremental governance update:** v1.10 preserves the complete material evidentiary content and schema of v1.9; no evidence is deleted, collapsed, or downgraded. C10C-003 is propagated as material bounded methodological/empirical qualification to C02, C07, C08, C11 and C16. No claim-level status is upgraded by this propagation.', '**Date:** 2026-09-16  \n**Predecessor:** v1.10  \n**Incremental governance update:** v1.11 preserves the complete material evidentiary content and schema of v1.10; no evidence is deleted, collapsed, or downgraded. C10C-004 is propagated as bounded methodological evidence to C01, C11 and C16, with explicit negative/boundary qualification for C02 and no direct evidence contribution to C07, C08, C09 or C10. No claim-level status is upgraded by this propagation.', 1)
          s = s.replace('**C10C-003 update:**', '**C10C-004 update:** C10C-004 Morocco Gate G4 closed as `OPERATIONAL RECONSTRUCTION VERIFIED`. The endline women\'s-empowerment construct was independently reconstructed from questionnaire semantics, physical variables, observed coding and the historical Stata construction rule using Python. The historical duplicate `outcome2` and omission of `outcome3` were preserved. This is a bounded operationalisation/reconstruction result and does not identify TGCV `T_acc`, `Delta T_acc`, trajectory causality or value.\n\n**C10C-003 update:**', 1)
          s = s.replace('Formal architecture + bounded cross-domain traces + IT-G1 bounded industrial case | IT-G1 adds material bounded evidence for reconstruction of internal state and external enabling conditions; no claim-level upgrade.', 'Formal architecture + bounded cross-domain traces + IT-G1 bounded industrial case + C10C-004 | IT-G1 adds material bounded evidence for reconstruction of internal state and external enabling conditions. C10C-004 adds bounded methodological evidence that an empirical construct can be traced from instrument semantics through physical variables to an executable derived outcome, without establishing TGCV state representation. No claim-level upgrade.', 1)
          s = s.replace('Formalization + Rust + C-01 A-C + I-01 Gate C + IT-NOSD-010 G0/G1/G2 + EXT-UPD-4.8 + SWIM Reactive-0 + SWIM Reactive2 + IT-G1 + C10C-002 + C10C-001 + C10C-003 |', 'Formalization + Rust + C-01 A-C + I-01 Gate C + IT-NOSD-010 G0/G1/G2 + EXT-UPD-4.8 + SWIM Reactive-0 + SWIM Reactive2 + IT-G1 + C10C-002 + C10C-001 + C10C-003 + C10C-004 |', 1)
          s = s.replace('General `T_acc` remains unclosed and no claim-level upgrade is implied.', 'General `T_acc` remains unclosed. C10C-004 adds no direct positive accessibility evidence: its women\'s-empowerment construct is not an independently defined TGCV admissibility predicate and must not be relabeled as `T_acc`. No claim-level upgrade is implied.', 1)
          s = s.replace('C10C-003 | SWIM provides bounded non-Rust evidence', 'C10C-003 + C10C-004 | SWIM provides bounded non-Rust evidence', 1)
          s = s.replace('These cases qualify the distinction between observed structural change and accessible transformation-space change and are not evidence of `ΔT_acc`.', 'These cases qualify the distinction between observed structural change and accessible transformation-space change and are not evidence of `ΔT_acc`. C10C-004 is an endline operationalisation audit and does not reconstruct `U_tau`, `P_tau` or `ΔT_acc`.', 1)
          s = s.replace('C10C-002 + C10C-001 + C10C-003 | SWIM supports', 'C10C-002 + C10C-001 + C10C-003 + C10C-004 | SWIM supports', 1)
          s = s.replace('It does not close downstream value boundaries or establish transversal validity.', 'C10C-004 adds a worked non-software translation example preserving the distinction among instrument semantics, raw variables, derived outcomes and TGCV constructs. It does not close downstream value boundaries or establish transversal validity.', 1)
          marker = '\n## Claim boundary\n'
          block = '''\n## Material methodological evidence — C10C-004 Morocco Gate G4\n\n**Case:** `C10C-004 — Morocco microcredit / women's empowerment`  \n**Gate:** `G4`  \n**Status:** `CLOSED — OPERATIONAL RECONSTRUCTION VERIFIED`  \n**Result artifact:** `00_GOVERNANCE/SIP/C10C004_MOROCCO_G4_WOMENS_EMPOWERMENT_RECONSTRUCTION_RESULT_001.md`  \n**Propagation record:** `00_GOVERNANCE/SIP/C10C004_MOROCCO_G4_EVIDENCE_TO_CLAIM_PROPAGATION_001.md`\n\nC10C-004 provides a closed independent reconstruction of the historical endline women's-empowerment construct from `Microcredit_EL_mini_anonym.dta` (N=5,551). The reconstruction linked questionnaire semantics, physical variables, observed coding, the historical Stata construction block and an independent Python implementation. J1-J9 were reconstructed across the F1-F11 household slots; J9b was reconstructed separately as `women_10`; J10-J13 were reconstructed under the documented 3/4 rule as `women_11`-`women_14`. Standardisation and the historical `women_index` row-total specification were reproduced, including the duplicate `outcome2` and omission of `outcome3`, without post-hoc correction.\n\nThe reconstructed `women_index` had N=5,551, mean 0, sample SD 8.218129454, minimum -5.965017097, maximum 53.466739700 and zero missing values. J1-J9 showed no observed nonmissing coding outside `{1,2,-99}`. The result is bounded to operational reconstruction; it is not a TGCV accessibility, trajectory or value result.\n\n### Evidence-to-claim propagation\n\n- **C01:** Material methodological evidence, bounded. The case demonstrates explicit tracing from instrument semantics through physical variables to an executable derived outcome, but does not establish TGCV state representation. No upgrade.\n- **C02:** No direct positive evidence; bounded methodological relevance only. The empowerment construct is not an independently defined TGCV admissibility predicate `P_tau(S,C,L)` and must not be promoted to `T_acc`. No upgrade.\n- **C07:** No direct evidence. The case does not reconstruct a TGCV transformation universe, admissibility predicate or `Delta T_acc`. No upgrade.\n- **C08:** No direct evidence. The empowerment index is not a TGCV reachable-trajectory variable and no trajectory causal estimand is established. No upgrade.\n- **C09:** No evidence contribution. No TGCV causal estimate is produced.\n- **C10:** No evidence contribution. No `Delta T_acc → Delta V` causal or predictive pathway is tested.\n- **C11:** Bounded methodological contribution. The case adds a distinct non-software empirical domain for explicit construct translation, but does not establish transversal validity. No upgrade.\n- **C16:** Material methodological evidence. The reconstruction preserves distinctions among instrument semantics, raw variables, derived outcomes and TGCV constructs, and preserves a historical code anomaly rather than silently correcting it. No upgrade.\n\nC10C-004 does not modify TGCV Core, RMA, the accessibility definition, the causal chain or any claim-level status.\n'''
          assert marker in s
          s = s.replace(marker, block + marker, 1)
          s = s.replace('v1.10 and adds the C10C-003 empirical/methodological evidence record plus bounded propagation to C02, C07, C08, C11 and C16.', 'v1.10 and adds the C10C-004 methodological evidence record plus bounded propagation to C01, C11 and C16 and explicit boundary qualification for C02. C10C-004 does not contribute positive evidence to C07, C08, C09 or C10.', 1)
          s = s.replace('v1.8 added C10C-002 evidence propagation, v1.9 added C10C-001 evidence propagation, and v1.10 adds C10C-003 bounded evidence propagation.', 'v1.8 added C10C-002 evidence propagation, v1.9 added C10C-001 evidence propagation, v1.10 added C10C-003 bounded evidence propagation, and v1.11 adds C10C-004 bounded methodological evidence propagation.', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          Path('.github/workflows/_tmp_c10c004_matrix_v111.yml').unlink()
      - name: Commit governance update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md .github/workflows/_tmp_c10c004_matrix_v111.yml
          git commit -m 'Propagate C10C-004 Morocco G4 into Evidence-to-Claim Matrix v1.11'
          git push
