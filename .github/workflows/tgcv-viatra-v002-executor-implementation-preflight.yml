name: TGCV VIATRA V002 Executor Implementation Preflight

on:
  workflow_dispatch:
    inputs:
      tgcv_ref:
        description: "TGCV ref containing the executor implementation"
        required: true
        default: "viatra-v002-executor-implementation"

permissions:
  contents: read

jobs:
  implementation-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout TGCV implementation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tgcv_ref }}
          fetch-depth: 0

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Implementation source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java
          test -f 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002FixtureStateCapture.java
          test -f 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/historical/cpsXformM2M.vql
          grep -q 'BatchTransformation.forEngine(engine)' 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java
          grep -q 'addListener' 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java
          grep -q 'fireAllCurrent(hostRule)' 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java
          test "$(git hash-object 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/historical/cpsXformM2M.vql)" = "48033b9a6ddfd89bc875e1bbd4a505bd2411ff41"
          grep -q 'UnsupportedOperationException' 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/ViatraV002ObserverHost.java
          if grep -RniE 'value|utility|reward|T_acc|future.?assignment|scientific.?score' 05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java; then
            echo "Scientific firewall violation in executor"
            exit 1
          fi

      - name: Materialize pinned historical CPS model bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash materialize-historical-cps-models.sh

      - name: Comprehensive build-readiness preflight
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash build-readiness-preflight.sh

      - name: Tycho dependency-resolution gate
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -DskipTests validate

      - name: Build Tycho reactor
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp clean verify

      - name: Runtime execution firewall
        shell: bash
        run: |
          set -euo pipefail
          echo "IMPLEMENTATION_PREFLIGHT_PASS"
          echo "RUNTIME_EXECUTION_NOT_PERFORMED"
          echo "SCIENTIFIC_EXECUTION_NOT_AUTHORIZED"
