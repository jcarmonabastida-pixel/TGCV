name: Reconstruct cumulative Evidence-to-Claim Matrix v1.15

on: push

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verify propagate
        run: python3 00_GOVERNANCE/SIP/reconstruct_v115_cumulative.py
      - name: Commit reconstructed v1.15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.15.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md .github/workflows/reconstruct-v115.yml 00_GOVERNANCE/SIP/reconstruct_v115_cumulative.py .v115_reconstruction_trigger
          git commit -m 'C05: reconstruct cumulative Evidence-to-Claim Matrix v1.15'
          git push origin HEAD:governance/fix-v1.15-cumulative
