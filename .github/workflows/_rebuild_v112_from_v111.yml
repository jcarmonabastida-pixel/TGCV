name: Rebuild Matrix v1.12 cumulatively from v1.11

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild v1.12 without rewriting predecessor content
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          src = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.11.md'
          out = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md'
          current = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md'

          v111 = src.read_text(encoding='utf-8')
          if not v111.startswith('# TGCV — Evidence-to-Claim Matrix — Current v1.11\n'):
              raise SystemExit('v1.11 source header not found; refusing to rebuild')
          if '## Claim boundary\n' not in v111:
              raise SystemExit('v1.11 Claim boundary marker not found; refusing to rebuild')

          mt4 = r'''## Material methodological evidence — MT4 historical national electricity-system transitions

**Case:** `MT4 — historical national electricity-system transitions / energy-system technology change`  
**Status:** `BOUNDED PASS — METHODOLOGICAL TRANSFER DEMONSTRATED WITH EXPLICIT LIMITS`  
**Result artifact:** `00_GOVERNANCE/SIP/TGCV_MT4_DOMAIN_TRANSFER_RESULT_001.md`  
**Propagation record:** `00_GOVERNANCE/SIP/TGCV_MT4_EVIDENCE_TO_CLAIM_PROPAGATION_001.md`  
**Primary source:** Jaxa-Rozen, Wen & Trutnevyte, `Historic data of the national electricity system transitions in Europe in 1990–2019 for retrospective evaluation of models`, Zenodo record 6696776, v2.

MT4 transfers the candidate transversal methodology to a genuinely heterogeneous historical electricity-system domain while preserving explicit analytical distinctions among state/conditions, candidate technical constraints, admissibility/accessibility, realized transformations, state/trajectory and economic/value-related variables. The frozen public dataset covers 31 European countries and 1990–2019, with 1,359 processed/harmonized data files and 528 original data sources/references. The local frozen source package is governed independently by the MT4 source-freeze manifest.

### Gate results

- **MT4-1:** PASS — source discovery/provenance.
- **MT4-2:** PASS — source freeze/integrity.
- **MT4-3:** PASS — structural/schema reconstruction.
- **MT4-4:** PASS — bounded state/candidate-transformation/constraint coverage, with explicit temporal limitations.
- **MT4-5:** OPEN / BOUNDED — full `P_tau` remains undetermined. Temporal auditors identified retrospective/future-leakage risks in some `Buildrates`/`Potential_*` records; CORE6 coverage is 92.58%; the candidate technical rule is only partially formalized.
- **MT4-6:** PASS — independent reproducibility of the structural audit: 13,320 country-technology-year cells, 12,331 complete CORE6 cells, 989 incomplete cells, 92.58% coverage; 930 multi-technology country-year groups; one duplicate CORE6 signature group, without loss of discriminability across groups.
- **MT4-7:** BOUNDED PASS — candidate technical parameters remain separated from realized transformations (`Actual_new_capacity`, `Actual_retired_capacity`), state/trajectory variables (`Actual_capacity`, `Actual_generation`) and economic/value-related variables (`Inv`, `Fixed_OM_annual`, `Variable_OM`); candidate-rule/actual overlap violations = 0.
- **MT4-8:** BOUNDED PASS — economic/value-related variables are structurally isolated from the CORE6 candidate accessibility rule; no downstream TGCV `Delta V` endpoint is established and no causal value effect is tested.

### Methodological significance

MT4 provides bounded evidence that the candidate translation sequence can be applied in a non-software electricity-system domain without collapsing candidate constraints into realized technology changes or downstream economic/value-related variables. CORE6 provides a partially formalized candidate admissibility layer with 92.58% complete country-technology-year coverage, but full `P_tau` is not closed. The result therefore demonstrates methodological transfer and boundary preservation, not transversal validity or scientific closure.

### Evidence-to-claim propagation

The following is deliberately **additive**. The v1.11 claim table above is preserved without rewriting or shortening any pre-existing claim row.

- **C01:** bounded methodological support. MT4 demonstrates identification/preservation of a technical constraint/state layer in a heterogeneous electricity-system domain. No universal state representation or claim upgrade.
- **C02:** bounded qualification. CORE6 provides a partially formalized candidate admissibility layer with 92.58% complete coverage, but full `P_tau` remains undetermined. No claim upgrade.
- **C07:** boundary qualification only. MT4 distinguishes realized technology changes from accessibility-space change and does not substitute `Actual_*` variables for `T_acc` or `Delta T_acc`. No positive `Delta T_acc` propagation.
- **C08:** bounded methodological support only. MT4 separates candidate constraints, realized transformations and state/trajectory variables, but does not establish a trajectory causal estimand. No upgrade.
- **C09:** no positive propagation. MT4 contains no causal estimate of `Delta T_acc -> trajectory`; existing C09 bounded empirical causal-support status remains unchanged.
- **C10:** material boundary qualification. MT4-8 isolates `Inv`, `Fixed_OM_annual` and `Variable_OM` from the CORE6 candidate accessibility rule, but does not establish them as downstream TGCV value outcomes. No `Delta T_acc -> Delta V` evidence.
- **C11:** bounded methodological cross-domain evidence. MT4 adds a genuinely heterogeneous electricity-system domain and strengthens documented methodological transfer, but does not establish transversal validity.
- **C16:** material positive methodological evidence, bounded. MT4 preserves separation among state, candidate transformations, admissibility/accessibility, realized transformation, trajectory and economic/value-related variables. No upgrade.

### Explicit non-propagation

No positive evidence is propagated to C03, C04, C05, C06, C12, C13, C14 or C15. MT4 does not modify TGCV Core, RMA, claim levels, causal status or transversal-validity status. Evidence propagation remains separate from claim upgrade.

### Cumulative-integrity statement

This v1.12 artifact is constructed as **v1.11 complete content plus the MT4 material record above**. No v1.11 claim row, evidence description, interpretation, next requirement, empirical evidence section, methodological evidence section, routing statement or scientific-position statement is removed, collapsed or rewritten for MT4.

'''

          header = '''# TGCV — Evidence-to-Claim Matrix — Current v1.12

**Status:** GOVERNANCE CONTROL ARTIFACT — CURRENT  
**Date:** 2026-09-16  
**Predecessor:** v1.11  
**Incremental governance update:** v1.12 preserves the complete material evidentiary content and schema of v1.11 without rewriting predecessor claim rows or evidence records. MT4 is added as bounded methodological domain-transfer evidence with explicit propagation to C01, C02, C07, C08, C10, C11 and C16, explicit non-positive propagation to C09, and explicit non-propagation to C03, C04, C05, C06, C12, C13, C14 and C15. No claim-level status is upgraded.

**MT4 update:** MT4 closes as `BOUNDED PASS — METHODOLOGICAL TRANSFER DEMONSTRATED WITH EXPLICIT LIMITS`; MT4-5 remains `OPEN / BOUNDED` because full `P_tau` is not established. The MT4 record is additive and does not replace any v1.11 evidence.

'''

          body = v111.split('## Matrix preservation rule\n', 1)[1]
          body = body
          rebuilt = header + '## Matrix preservation rule\n' + body
          rebuilt = rebuilt.replace('## Claim boundary\n', mt4 + '## Claim boundary\n', 1)

          # Mechanical preservation checks: every v1.11 line after its header must remain verbatim,
          # except the three v1.11 header lines intentionally replaced by v1.12 metadata.
          original_body = v111.split('## Matrix preservation rule\n', 1)[1]
          rebuilt_body = rebuilt.split('## Matrix preservation rule\n', 1)[1]
          for line in original_body.splitlines():
              if line and line not in rebuilt_body:
                  raise SystemExit('PRESERVATION_FAILURE: missing predecessor line: ' + line[:180])

          out.write_text(rebuilt, encoding='utf-8', newline='\n')
          current.write_text(rebuilt, encoding='utf-8', newline='\n')

          # The stable pointer must resolve v1.12.
          pointer = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md'
          p = pointer.read_text(encoding='utf-8')
          p = p.replace('**Current version:** v1.12', '**Current version:** v1.12')
          p = p.replace('**Versioned artifact:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md`', '**Versioned artifact:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md`')
          pointer.write_text(p, encoding='utf-8', newline='\n')

          print('REBUILD=PASS')
          print('SOURCE=v1.11')
          print('TARGET=v1.12')
          print('CURRENT_ALIAS=BYTE_IDENTICAL')
          print('PRESERVATION=ALL_PREDECESSOR_BODY_LINES_PRESENT')

      - name: Validate governance state
        shell: bash
        run: |
          python 00_GOVERNANCE/tools/validate_current_state.py

      - name: Commit rebuilt matrix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_rebuild_v112_from_v111.yml
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md .github/workflows/_rebuild_v112_from_v111.yml
          git commit -m 'Rebuild Matrix v1.12 cumulatively from v1.11 plus MT4'
          git push origin main
