name: D-OPS 003 R001 governed conformance execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dops-003r001:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen R001 package
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify runtime
        run: python3 --version

      - name: Verify frozen R001 SHA-256 boundary
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path("00_GOVERNANCE/D-OPS_PACKAGE_003R001_PROVENANCE_MANIFEST_001.json").read_text(encoding="utf-8"))
          root=Path(".")
          for item in manifest["files"]:
              p=root/Path(item["path"])
              if not p.is_file(): raise SystemExit(f"MISSING_FROZEN_INPUT: {item['path']}")
              data=p.read_bytes()
              if len(data)!=item["bytes"]: raise SystemExit(f"BYTE_COUNT_MISMATCH: {item['path']}")
              if hashlib.sha256(data).hexdigest()!=item["sha256"]: raise SystemExit(f"SHA256_MISMATCH: {item['path']}")
          actual={str(p) for p in Path(manifest["package"]).iterdir() if p.is_file()}
          expected={x["path"] for x in manifest["files"]}
          if actual != expected: raise SystemExit(f"PACKAGE_BOUNDARY_MISMATCH: {sorted(actual ^ expected)}")
          print("FROZEN_R001_SHA256_AND_BOUNDARY_PASS")

      - name: Verify R001 execution authorization
        shell: python
        run: |
          from pathlib import Path
          p=Path("00_GOVERNANCE/D-OPS_PACKAGE_003R001_EXECUTION_AUTHORIZATION_001.md")
          if not p.is_file(): raise SystemExit("EXECUTION_AUTHORIZATION_RECORD_MISSING")
          t=p.read_text(encoding="utf-8")
          if "Status: EXECUTION AUTHORIZED" not in t or "execution_authorized: true" not in t:
              raise SystemExit("EXECUTION_AUTHORIZATION_INVALID")
          if "Package 003 R001" not in t: raise SystemExit("EXECUTION_AUTHORIZATION_SCOPE_INVALID")
          print("R001_EXECUTION_AUTHORIZATION_PASS")

      - name: Verify frozen R001 contract
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R001")
          expected=json.loads((root/"expected_results.json").read_text(encoding="utf-8"))
          perturb=json.loads((root/"perturbation_manifest.json").read_text(encoding="utf-8"))
          schema=json.loads((root/"result_schema.json").read_text(encoding="utf-8"))
          keys={"persistence","expansion","contraction","reconfiguration","mixed_identity_change"}
          if set(expected)!=keys or (set(perturb)-{"schema_version"})!=keys: raise SystemExit("R001_CONTRACT_KEYS_INVALID")
          if perturb.get("schema_version")!="003": raise SystemExit("R001_PERTURBATION_SCHEMA_VERSION_INVALID")
          if set(schema["required"])!={"test_id","expected_classification"}: raise SystemExit("R001_RESULT_SCHEMA_INVALID")
          allowed=set(schema["allowed_classifications"])
          if set(expected.values())-allowed: raise SystemExit("R001_EXPECTED_CLASSIFICATIONS_INVALID")
          print("R001_CONTRACT_PASS")

      - name: Execute five frozen R001 conformance cases
        shell: python
        run: |
          import json, hashlib, sys
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R001")
          fixture=json.loads((root/"D0_FORMAL_FIXTURE.json").read_text(encoding="utf-8"))
          r3=json.loads((root/"R3_manifest_D0.json").read_text(encoding="utf-8"))
          expected=json.loads((root/"expected_results.json").read_text(encoding="utf-8"))
          sys.path.insert(0,str(root))
          import dops_canonical, dops_oracle, dops_perturbations
          base=dops_canonical.canonical_omega(fixture,r3)
          cases={
            "persistence":(fixture,r3),
            "expansion":(dops_perturbations.expansion(fixture),r3),
            "contraction":(dops_perturbations.contraction(fixture),r3),
            "reconfiguration":(fixture,dops_perturbations.reconfiguration_r3(r3)),
            "mixed_identity_change":(dops_perturbations.mixed_identity(fixture),r3)}
          rows=[]
          for test_id,(new_fixture,new_r3) in cases.items():
              observed=dops_oracle.classify(base,dops_oracle.oracle_canonicalize(new_fixture,new_r3))
              if observed!=expected[test_id]: raise SystemExit(f"CLASSIFICATION_MISMATCH: {test_id}: {observed} != {expected[test_id]}")
              rows.append({"test_id":test_id,"expected_classification":expected[test_id],"observed_classification":observed,"pass":True})
          result={"status":"D-OPS-003-R001_CONFORMANCE_EXECUTION_COMPLETE","package":"D-OPS_FREEZE_PACKAGE_003R001","cases":rows}
          out=Path("d-ops-003r001-execution-result.json")
          out.write_text(json.dumps(result,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,sort_keys=True))
          print("RESULT_SHA256",hashlib.sha256(out.read_bytes()).hexdigest())

      - name: Upload R001 execution result
        uses: actions/upload-artifact@v4
        with:
          name: d-ops-003r001-conformance-execution-result
          path: d-ops-003r001-execution-result.json
          if-no-files-found: error
