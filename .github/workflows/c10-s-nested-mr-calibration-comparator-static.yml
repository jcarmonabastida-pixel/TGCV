      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f5_g7_resource_profile.py'
      - '03_EXPERIMENTS/C10-S/diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_001.json'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f5_g7_shard_execution.py'
      - '03_EXPERIMENTS/C10-S/design/C10S_F5_G7_EXECUTION_ARCHITECTURE_001.md'

permissions:
  contents: read
  actions: read

jobs:
  gaussian-oracle-static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Validate staged G7 workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/c10-s-f5-g7-tiera-calibration.yml")'
      # One-time compatibility verification of the persisted G7 resource profile.
      - name: Download the immutable G7 resource profile (one-time compatibility validation)
        if: contains(github.event.head_commit.message, 'validate persisted G7 resource profile')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14717426261
          run-id: 44926453920
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-profile
      - name: Validate source compatibility and assert the measured shard plan
        if: contains(github.event.head_commit.message, 'validate persisted G7 resource profile')
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PLAN_JSON: ${{ runner.temp }}/g7-resource-profile-validation.json
        run: |
          python validate_c10s_f5_g7_resource_profile.py \
            --profile "$RUNNER_TEMP/resource-profile/c10s-f5-g7-resource-parallel-profile.json" \
            --manifest ../diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_001.json \
            --root ../../.. \
            --output-json "$RUNNER_TEMP/g7-resource-profile-validation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["PLAN_JSON"]).read_text())
          assert data["datasets_per_shard"] == 50, data["datasets_per_shard"]
          assert data["end_to_end_conservative_wall_seconds"] < 10800
          print({
              "datasets_per_shard": data["datasets_per_shard"],
              "jobs_per_phase": data["shard_jobs_per_phase"],
              "primary_plus_replay_wall_seconds": data["primary_plus_replay_conservative_wall_seconds"],
              "end_to_end_wall_seconds": data["end_to_end_conservative_wall_seconds"],
              "aggregate_compute_hours": data["primary_plus_replay_aggregate_compute_hours"],
          })
          PY
      - name: Compile comparator and tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile c10s_gaussian_variance_oracles.py test_c10s_gaussian_variance_oracles.py c10s_beta_binomial_variance_oracles.py test_c10s_beta_binomial_variance_oracles.py c10s_variance_comparison_interface.py test_c10s_variance_comparison_interface.py c10s_f1_exact_pivotal_candidate.py test_c10s_f1_exact_pivotal_candidate.py c10s_fitted_beta_binomial_bootstrap.py test_c10s_fitted_beta_binomial_bootstrap.py run_c10s_f5_g7_tiera_calibration.py test_c10s_f5_g7_tiera_calibration.py execute_c10s_f5_g7_tiera_calibration.py validate_c10s_f5_g7_tiera_authorization.py test_c10s_f5_g7_tiera_authorization.py c10s_f5_beta_binomial_likelihood_diagnostics.py test_c10s_f5_beta_binomial_likelihood_diagnostics.py c10s_f1_between_profile_likelihood.py test_c10s_f1_between_profile_likelihood.py test_c10s_f1_near_degenerate_interval.py c10s_nested_mr_comparative_inference_engine.py test_c10s_nested_mr_comparative_inference_engine.py run_c10s_nested_mr_comparative_holdout.py test_c10s_nested_mr_comparative_holdout.py run_c10s_nested_mr_comparative_resource_preflight.py test_c10s_nested_mr_comparative_resource_preflight.py validate_c10s_nested_mr_resource_preflight_authorization.py validate_c10s_nested_mr_comparative_holdout_authorization.py test_c10s_nested_mr_comparative_holdout_authorization.py execute_c10s_nested_mr_comparative_holdout.py run_c10s_post_holdout_f1_f5_resource_preflight.py test_c10s_post_holdout_f1_f5_resource_preflight.py validate_c10s_post_holdout_resource_preflight_authorization.py run_c10s_post_holdout_f5_b2_b3_development_calibration.py test_c10s_post_holdout_f5_b2_b3_development_calibration.py validate_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py test_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py c10s_f5_g7_shard_execution.py execute_c10s_f5_g7_tiera_shard.py aggregate_c10s_f5_g7_tiera_shards.py test_c10s_f5_g7_shard_execution.py validate_c10s_f5_g7_resource_profile.py test_c10s_f5_g7_resource_profile.py
      - name: Run comparator oracle tests only
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_c10s_gaussian_variance_oracles test_c10s_beta_binomial_variance_oracles test_c10s_variance_comparison_interface test_c10s_f1_exact_pivotal_candidate test_c10s_fitted_beta_binomial_bootstrap test_c10s_f5_g7_tiera_calibration test_c10s_f5_g7_tiera_authorization test_c10s_f5_beta_binomial_likelihood_diagnostics test_c10s_f1_between_profile_likelihood test_c10s_f1_near_degenerate_interval test_c10s_nested_mr_comparative_inference_engine test_c10s_nested_mr_comparative_holdout test_c10s_nested_mr_comparative_resource_preflight test_c10s_nested_mr_comparative_holdout_authorization test_c10s_post_holdout_f1_f5_resource_preflight test_c10s_post_holdout_f5_b2_b3_development_calibration test_c10s_post_holdout_f5_b2_b3_development_calibration_authorization test_c10s_f5_g7_shard_execution test_c10s_f5_g7_resource_profile
