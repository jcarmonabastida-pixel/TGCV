name: C10-S nested M/R calibration comparator — static tests

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
    paths:
      - '.github/workflows/c10-s-nested-mr-calibration-comparator-static.yml'
      - '.github/workflows/c10-s-post-holdout-f1-f5-resource-preflight.yml'
      - '03_EXPERIMENTS/C10-S/harness/c10s_gaussian_variance_oracles.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_gaussian_variance_oracles.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_beta_binomial_variance_oracles.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_beta_binomial_variance_oracles.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_variance_comparison_interface.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_variance_comparison_interface.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f1_exact_pivotal_candidate.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f1_exact_pivotal_candidate.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_comparative_inference_engine.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_comparative_inference_engine.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_comparative_holdout.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_comparative_holdout.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_comparative_resource_preflight.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_comparative_resource_preflight.py'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_resource_preflight_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_post_holdout_f1_f5_resource_preflight.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_post_holdout_f1_f5_resource_preflight.py'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_post_holdout_resource_preflight_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_post_holdout_f5_b2_b3_development_calibration.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_post_holdout_f5_b2_b3_development_calibration.py'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py'
      - '.github/workflows/c10-s-post-holdout-f5-b2-b3-development-calibration.yml'
      - '03_EXPERIMENTS/C10-S/diagnostics/C10S_POST_HOLDOUT_F5_B2_B3_DEVELOPMENT_CALIBRATION_AUTHORIZATION_TEMPLATE_001.json'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_comparative_holdout_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_comparative_holdout_authorization.py'
      - '.github/workflows/c10-s-nested-mr-comparative-resource-preflight.yml'
      - '.github/workflows/c10-s-nested-mr-comparative-holdout.yml'
      - '03_EXPERIMENTS/C10-S/harness/execute_c10s_nested_mr_comparative_holdout.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_fitted_beta_binomial_bootstrap.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_fitted_beta_binomial_bootstrap.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_likelihood_diagnostics.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f5_beta_binomial_likelihood_diagnostics.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f1_between_profile_likelihood.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f1_between_profile_likelihood.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f1_near_degenerate_interval.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  gaussian-oracle-static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Compile comparator and tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile c10s_gaussian_variance_oracles.py test_c10s_gaussian_variance_oracles.py c10s_beta_binomial_variance_oracles.py test_c10s_beta_binomial_variance_oracles.py c10s_variance_comparison_interface.py test_c10s_variance_comparison_interface.py c10s_f1_exact_pivotal_candidate.py test_c10s_f1_exact_pivotal_candidate.py c10s_fitted_beta_binomial_bootstrap.py test_c10s_fitted_beta_binomial_bootstrap.py c10s_f5_beta_binomial_likelihood_diagnostics.py test_c10s_f5_beta_binomial_likelihood_diagnostics.py c10s_f1_between_profile_likelihood.py test_c10s_f1_between_profile_likelihood.py test_c10s_f1_near_degenerate_interval.py c10s_nested_mr_comparative_inference_engine.py test_c10s_nested_mr_comparative_inference_engine.py run_c10s_nested_mr_comparative_holdout.py test_c10s_nested_mr_comparative_holdout.py run_c10s_nested_mr_comparative_resource_preflight.py test_c10s_nested_mr_comparative_resource_preflight.py validate_c10s_nested_mr_resource_preflight_authorization.py validate_c10s_nested_mr_comparative_holdout_authorization.py test_c10s_nested_mr_comparative_holdout_authorization.py execute_c10s_nested_mr_comparative_holdout.py run_c10s_post_holdout_f1_f5_resource_preflight.py test_c10s_post_holdout_f1_f5_resource_preflight.py validate_c10s_post_holdout_resource_preflight_authorization.py run_c10s_post_holdout_f5_b2_b3_development_calibration.py test_c10s_post_holdout_f5_b2_b3_development_calibration.py validate_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py test_c10s_post_holdout_f5_b2_b3_development_calibration_authorization.py
      - name: Run comparator oracle tests only
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_c10s_gaussian_variance_oracles test_c10s_beta_binomial_variance_oracles test_c10s_variance_comparison_interface test_c10s_f1_exact_pivotal_candidate test_c10s_fitted_beta_binomial_bootstrap test_c10s_f5_beta_binomial_likelihood_diagnostics test_c10s_f1_between_profile_likelihood test_c10s_f1_near_degenerate_interval test_c10s_nested_mr_comparative_inference_engine test_c10s_nested_mr_comparative_holdout test_c10s_nested_mr_comparative_resource_preflight test_c10s_nested_mr_comparative_holdout_authorization test_c10s_post_holdout_f1_f5_resource_preflight test_c10s_post_holdout_f5_b2_b3_development_calibration test_c10s_post_holdout_f5_b2_b3_development_calibration_authorization
