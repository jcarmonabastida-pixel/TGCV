name: TI-001 NEXT4 Engine-002 to Model-011R fit-estimand audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Run deterministic fit-estimand audit
        run: |
          python 03_EXPERIMENTS/TI-001/TI001_V012_NEXT4_ENGINE_002_MODEL_011R_FIT_ESTIMAND_AUDIT_001.py

      - name: Assert no scientific execution artifact was produced
        run: |
          test ! -f 03_EXPERIMENTS/TI-001/TI001_V012_NEXT4_POWER_SIMULATION_RESULT_001.json
