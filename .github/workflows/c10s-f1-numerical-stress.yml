name: C10-S F1 deterministic numerical stress

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119

permissions:
  contents: write

concurrency:
  group: c10s-f1-numerical-stress-single
  cancel-in-progress: false

jobs:
  numerical-stress:
    if: ${{ github.ref == 'refs/heads/research/c10s-f1-integrated-correction-20261119' && contains(github.event.head_commit.message, 'AUTHORIZE-C10S-F1-NUMERICAL-STRESS-20261119-003') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_PATH: 00_GOVERNANCE/authorizations/C10S_F1_NUMERICAL_STRESS_AUTHORIZATION_003.json
      AUTH_ID: C10S-F1-NUMERICAL-STRESS-20261119-003
      APPROVAL_MARKER: AUTHORIZE-C10S-F1-NUMERICAL-STRESS-20261119-003
      SOURCE_COMMIT: d5edc0010f7a8c6587677eb2004b545367fc4b35
      FREEZE_MANIFEST_PATH: 03_EXPERIMENTS/C10-S/harness/C10S_F1_NUMERICAL_STRESS_FREEZE_MANIFEST_003.md
      FREEZE_MANIFEST_BLOB: d54aec3adaca0eef95d529a987dfb28a294119b3

    steps:
      - name: Checkout authorization and workflow snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: governance
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          check-latest: false

      - name: Initialize runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/c10s-f1-numerical-stress-evidence" >> "$GITHUB_ENV"
          echo "VENV=$RUNNER_TEMP/c10s-f1-numerical-stress-venv" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/c10s-f1-numerical-stress-evidence"

      - name: Validate one-shot authorization and workflow identity
        working-directory: governance
        shell: bash
        env:
          APPROVAL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          auth_path = Path(os.environ["AUTH_PATH"])
          auth = json.loads(auth_path.read_text(encoding="utf-8"))
          workflow_path = ".github/workflows/c10s-f1-numerical-stress.yml"
          workflow_blob = subprocess.check_output(
              ["git", "hash-object", workflow_path], text=True
          ).strip()
          manifest_blob = subprocess.check_output(
              ["git", "hash-object", os.environ["FREEZE_MANIFEST_PATH"]], text=True
          ).strip()

          checks = {
              "authorization_id": auth.get("authorization_id") == os.environ["AUTH_ID"],
              "approved_status": auth.get("status") == "APPROVED",
              "execution_authorized": auth.get("execution_authorized") is True,
              "approved_by_user": auth.get("approved_by_user") is True,
              "one_shot": auth.get("one_shot") is True,
              "not_consumed": auth.get("consumed") is False,
              "not_closed": auth.get("attempt_closed") is False,
              "source_commit": auth.get("source_commit") == os.environ["SOURCE_COMMIT"],
              "freeze_manifest_path": auth.get("freeze_manifest") == os.environ["FREEZE_MANIFEST_PATH"],
              "freeze_manifest_blob": manifest_blob == os.environ["FREEZE_MANIFEST_BLOB"] == auth.get("freeze_manifest_blob_sha"),
              "workflow_path": auth.get("workflow") == workflow_path,
              "workflow_blob": auth.get("workflow_blob_sha") == workflow_blob,
              "approval_marker": os.environ["APPROVAL_MARKER"] in os.environ["APPROVAL_COMMIT_MESSAGE"],
              "scope": auth.get("scope", {}).get("polynomial_sturm_records") == 115 and auth.get("scope", {}).get("f1_observation_scale_records") == 7,
              "single_execution": auth.get("limits", {}).get("primary_executions") == 1 and auth.get("limits", {}).get("automatic_retries") == 0 and auth.get("limits", {}).get("replay") is False,
              "prohibitions": all(auth.get("prohibitions", {}).get(k) is True for k in (
                  "unit_tests", "monte_carlo_calibration", "dgp_experiment",
                  "inferential_coverage_study", "parameter_tuning",
                  "external_dataset", "scientific_c10_execution",
                  "source_modification_during_run"
              )),
          }
          for name, passed in checks.items():
              print(f"{name}={'PASS' if passed else 'FAIL'}")
          if not all(checks.values()):
              sys.exit("AUTHORIZATION_PREFLIGHT_BLOCKED")
          PY

      - name: Checkout immutable numerical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d5edc0010f7a8c6587677eb2004b545367fc4b35
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen commit and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          while IFS=' ' read -r expected relative_path; do
            actual="$(git -C source hash-object "$relative_path")"
            printf '%s %s %s\n' "$expected" "$actual" "$relative_path"
            test "$actual" = "$expected"
          done <<'EOF'
          cc047a3b112caf84533c94e77d1908c99a0c2bdf 03_EXPERIMENTS/C10-S/harness/c10s_f1_numerical_stress.py
          b08ee28a1423b7a6c598db69c0ef15dff5f0ac22 03_EXPERIMENTS/C10-S/harness/run_c10s_f1_numerical_stress.py
          39f1732e1571f9d0705378d924b58b9475277e7a 03_EXPERIMENTS/C10-S/harness/c10s_f1_between_profile_likelihood.py
          3ac9ce31eb82421022fd8d2a65a0daee049322be 03_EXPERIMENTS/C10-S/harness/c10s_f1_independent_root_isolator.py
          9fa1cb21cd47e32030db8a00420e7dacfdc77321 03_EXPERIMENTS/C10-S/harness/c10s_f1_root_adjudication.py
          6d193798e792dd5129fbfb0c312286763791d463 03_EXPERIMENTS/C10-S/harness/c10s_variance_comparison_interface.py
          EOF

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --no-deps --only-binary=:all: numpy==2.1.3 scipy==1.14.1
          "$VENV/bin/python" - <<'PY'
          import sys, numpy, scipy
          assert ".".join(map(str, sys.version_info[:3])) == "3.12.3"
          assert numpy.__version__ == "2.1.3"
          assert scipy.__version__ == "1.14.1"
          print("PYTHON", sys.version)
          print("NUMPY", numpy.__version__)
          print("SCIPY", scipy.__version__)
          PY

      - name: Prepare provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          {
            echo "authorization_id=$AUTH_ID"
            echo "authorization_commit=$GITHUB_SHA"
            echo "frozen_source_commit=$SOURCE_COMMIT"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "python_version=$("$VENV/bin/python" --version 2>&1)"
            echo "platform=$(uname -a)"
            echo "execution_count=1"
            echo "replay=false"
          } > "$EVIDENCE_ROOT/workflow-preflight.txt"

      - name: Consume one-shot authorization before primary execution
        working-directory: governance
        shell: bash
        run: |
          set -euo pipefail
          "$VENV/bin/python" - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("00_GOVERNANCE/authorizations/C10S_F1_NUMERICAL_STRESS_AUTHORIZATION_003.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "APPROVED" or data.get("consumed") is not False:
              raise SystemExit("AUTHORIZATION_NOT_AVAILABLE_OR_ALREADY_CONSUMED")
          data["status"] = "CONSUMED"
          data["execution_authorized"] = False
          data["consumed"] = True
          data["consumed_by_run_id"] = "${{ github.run_id }}"
          data["consumed_at_utc"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AUTH_PATH"
          git commit -m "Consume one-shot authorization C10S-F1-NUMERICAL-STRESS-20261119-003 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Run deterministic numerical stress once
        working-directory: source/03_EXPERIMENTS/C10-S/harness
        shell: bash
        run: |
          set +e
          "$VENV/bin/python" run_c10s_f1_numerical_stress.py \
            --source-commit "$SOURCE_COMMIT" \
            --output-directory "$EVIDENCE_ROOT" \
            > "$EVIDENCE_ROOT/runner.stdout" \
            2> "$EVIDENCE_ROOT/runner.stderr"
          code=$?
          printf '%s\n' "$code" > "$EVIDENCE_ROOT/runner-exit-code.txt"
          exit "$code"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c10s-f1-numerical-stress-${{ github.run_id }}
          path: ${{ runner.temp }}/c10s-f1-numerical-stress-evidence/
          if-no-files-found: warn
          retention-days: 90
