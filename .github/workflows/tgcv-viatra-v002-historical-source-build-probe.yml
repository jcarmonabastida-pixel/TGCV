name: TGCV VIATRA V002 Historical Source Build Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VIATRA 2.0.2 source
        uses: actions/checkout@v4
        with:
          repository: eclipse-viatra/org.eclipse.viatra
          ref: 2.0.2
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "a304b8ec0d94ff1aee79b6651bf298f612d09e50"
          test -f transformation/plugins/org.eclipse.viatra.transformation.evm/META-INF/MANIFEST.MF
          test -f transformation/plugins/org.eclipse.viatra.transformation.runtime.emf/META-INF/MANIFEST.MF
          test -f query/plugins/org.eclipse.viatra.query.runtime/META-INF/MANIFEST.MF

      - name: Configure Java 8 Maven toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0">
            <toolchain>
              <type>jdk</type>
              <provides>
                <id>JavaSE-1.8</id>
              </provides>
              <configuration>
                <jdkHome>$java_home</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
          test -x "$java_home/bin/java"
          grep -F "<id>JavaSE-1.8</id>" "$HOME/.m2/toolchains.xml"

      - name: Inspect resolved JDT and Java execution environment
        run: |
          echo "=== TARGET PLATFORM / JDT INSPECTION ==="
          find ~/.m2/repository -type f \( -name 'org.eclipse.jdt.launching*.jar' -o -name 'org.eclipse.jdt.core*.jar' \) -print | sort | head -100
          echo "--- resolved JDT/JRE artifacts ---"
          find ~/.m2/repository -type f \( -name '*jdt*launching*.jar' -o -name '*jdt*core*.jar' \) -print | sort | head -100
          echo "--- target platform configuration ---"
          grep -R -n -E 'JavaSE-1\.8|JavaSE-1\.7|org\.eclipse\.jdt\.launching|org\.eclipse\.jdt\.core' target-platform-configuration releng 2>/dev/null | head -200 || true
          echo "=== END TARGET PLATFORM / JDT INSPECTION ==="

      - name: Microprobe Java 8 Stream availability
        run: |
          echo "=== MICROPROBE JAVA 8 STREAM ==="
          cat > /tmp/StreamProbe.java <<'EOF'
          import java.util.stream.Stream;
          public class StreamProbe {
              Stream<String> stream;
              public static void main(String[] args) {
                  Stream<String> s = Stream.of("ok");
                  System.out.println(s.findFirst().get());
              }
          }
          EOF
          javac -source 1.8 -target 1.8 /tmp/StreamProbe.java
          java -cp /tmp StreamProbe
          echo "=== MICROPROBE END ==="

      - name: Inspect duplicate signed Eclipse runtime classes
        run: |
          echo "=== DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class" && echo "$0"' | sort -u
          echo "--- signer metadata ---"
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'if jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class"; then echo "### $0"; unzip -p "$0" META-INF/MANIFEST.MF 2>/dev/null | grep -E "^(Bundle-SymbolicName|Bundle-Version|Bundle-Vendor|Bundle-ManifestVersion):"; fi' | sort
          echo "=== END DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="

      - name: Rewrite inaccessible historical Itemis repository for isolated probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          replacements = {
              "http://download.itemis.com/updates/releases/2.1.1/": "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/",
              "http://download.eclipse.org/modeling/tmf/xtext/updates/releases/xpand/R201406030414": "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -F "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          grep -F "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          old_jre = 'JavaSE-1.7'
          new_jre = 'JavaSE-1.8'
          assert old_jre in s
          p.write_text(s.replace(old_jre, new_jre))
          PY
          grep -n 'targetJRE' releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent.core/pom.xml")
          s = p.read_text()
          marker = '                    <resolver>p2</resolver>\n'
          assert marker in s
          s = s.replace(marker, marker + '                    <executionEnvironment>JavaSE-1.8</executionEnvironment>\n', 1)
          p.write_text(s)
          PY
          grep -F '<executionEnvironment>JavaSE-1.8</executionEnvironment>' releng/org.eclipse.viatra.parent.core/pom.xml
          echo "=== JAVA ENVIRONMENT ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_8_X64=$JAVA_HOME_8_X64"
          echo "=== TOOLCHAIN ==="
          cat "$HOME/.m2/toolchains.xml"
          echo "=== MAVEN/JAVA PROPERTIES ==="
          mvn -version
          echo "=== EFFECTIVE TYCHO CONFIGURATION MARKERS ==="
          grep -R -n -E 'useJDK|executionEnvironment|maven.compiler.source|maven.compiler.target|java.version' releng/org.eclipse.viatra.parent/pom.xml releng/org.eclipse.viatra.parent.core/pom.xml | head -80
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent/pom.xml")
          s = p.read_text()
          old = '<useJDK>BREE</useJDK>'
          new = '<useJDK>SYSTEM</useJDK>'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F '<useJDK>SYSTEM</useJDK>' releng/org.eclipse.viatra.parent/pom.xml
          echo "=== END DIAGNOSTICS ==="



      - name: Isolate JDT 3.47.0 from historical Maven plugin project realm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("maven/viatra-maven-plugin/pom.xml")
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          ET.register_namespace("", ns["m"])
          tree = ET.parse(p)
          root = tree.getroot()
          plugins = root.find("m:build/m:plugins", ns)
          assert plugins is not None
          xtext = None
          for plugin in plugins.findall("m:plugin", ns):
              aid = plugin.find("m:artifactId", ns)
              if aid is not None and aid.text == "xtext-maven-plugin":
                  xtext = plugin
                  break
          assert xtext is not None, "xtext-maven-plugin not found"
          exclusions = xtext.find("m:exclusions", ns)
          if exclusions is None:
              exclusions = ET.SubElement(xtext, "{%s}exclusions" % ns["m"])
          wanted = {("org.eclipse.jdt", "org.eclipse.jdt.core"), ("org.eclipse.jdt", "org.eclipse.jdt.compiler.apt")}
          found = set()
          for e in exclusions.findall("m:exclusion", ns):
              gid = e.find("m:groupId", ns)
              aid = e.find("m:artifactId", ns)
              key = (gid.text, aid.text) if gid is not None and aid is not None else None
              if key in wanted:
                  found.add(key)
          for gid_text, aid_text in sorted(wanted - found):
              e = ET.SubElement(exclusions, "{%s}exclusion" % ns["m"])
              ET.SubElement(e, "{%s}groupId" % ns["m"]).text = gid_text
              ET.SubElement(e, "{%s}artifactId" % ns["m"]).text = aid_text
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
          echo "=== XTEXT MAVEN PLUGIN JDT EXCLUSION ==="
          grep -A14 -B4 -F '<artifactId>xtext-maven-plugin</artifactId>' maven/viatra-maven-plugin/pom.xml
          echo "=== JDT PROJECT TREE AFTER EXCLUSION ==="
          mvn -B -U -f maven/viatra-maven-plugin/pom.xml dependency:tree -Dverbose -Dincludes=org.eclipse.jdt:org.eclipse.jdt.core
          echo "=== END JDT PROJECT TREE AFTER EXCLUSION ==="

      - name: Build historical core pass
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -X clean install -f releng/org.eclipse.viatra.parent.core/pom.xml -DskipTests -Dtycho.debug.resolution=true 2>&1 | tee /tmp/viatra-build-debug.log
          echo "=== TYCHO COMPILER DEBUG EXTRACT ==="
          grep -E -i "tycho-compiler-plugin|classpath|bootclasspath|execution environment|JavaSE-|JRE" /tmp/viatra-build-debug.log | tail -300 || true
          echo "=== END TYCHO COMPILER DEBUG EXTRACT ==="
