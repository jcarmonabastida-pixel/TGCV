name: TGCV VIATRA V002 Historical Source Build Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VIATRA 2.0.2 source
        uses: actions/checkout@v4
        with:
          repository: eclipse-viatra/org.eclipse.viatra
          ref: 2.0.2
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "a304b8ec0d94ff1aee79b6651bf298f612d09e50"
          test -f transformation/plugins/org.eclipse.viatra.transformation.evm/META-INF/MANIFEST.MF
          test -f transformation/plugins/org.eclipse.viatra.transformation.runtime.emf/META-INF/MANIFEST.MF
          test -f query/plugins/org.eclipse.viatra.query.runtime/META-INF/MANIFEST.MF

      - name: Configure Java 8 Maven toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0">
            <toolchain>
              <type>jdk</type>
              <provides>
                <id>JavaSE-1.8</id>
              </provides>
              <configuration>
                <jdkHome>$java_home</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
          test -x "$java_home/bin/java"
          grep -F "<id>JavaSE-1.8</id>" "$HOME/.m2/toolchains.xml"

      - name: Inspect resolved JDT and Java execution environment
        run: |
          echo "=== TARGET PLATFORM / JDT INSPECTION ==="
          find ~/.m2/repository -type f \( -name 'org.eclipse.jdt.launching*.jar' -o -name 'org.eclipse.jdt.core*.jar' \) -print | sort | head -100
          echo "--- resolved JDT/JRE artifacts ---"
          find ~/.m2/repository -type f \( -name '*jdt*launching*.jar' -o -name '*jdt*core*.jar' \) -print | sort | head -100
          echo "--- target platform configuration ---"
          grep -R -n -E 'JavaSE-1\.8|JavaSE-1\.7|org\.eclipse\.jdt\.launching|org\.eclipse\.jdt\.core' target-platform-configuration releng 2>/dev/null | head -200 || true
          echo "=== END TARGET PLATFORM / JDT INSPECTION ==="

      - name: Microprobe Java 8 Stream availability
        run: |
          echo "=== MICROPROBE JAVA 8 STREAM ==="
          cat > /tmp/StreamProbe.java <<'EOF'
          import java.util.stream.Stream;
          public class StreamProbe {
              Stream<String> stream;
              public static void main(String[] args) {
                  Stream<String> s = Stream.of("ok");
                  System.out.println(s.findFirst().get());
              }
          }
          EOF
          javac -source 1.8 -target 1.8 /tmp/StreamProbe.java
          java -cp /tmp StreamProbe
          echo "=== MICROPROBE END ==="

      - name: Inspect duplicate signed Eclipse runtime classes
        run: |
          echo "=== DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class" && echo "$0"' | sort -u
          echo "--- signer metadata ---"
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'if jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class"; then echo "### $0"; unzip -p "$0" META-INF/MANIFEST.MF 2>/dev/null | grep -E "^(Bundle-SymbolicName|Bundle-Version|Bundle-Vendor|Bundle-ManifestVersion):"; fi' | sort
          echo "=== END DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="

      - name: Rewrite inaccessible historical Itemis repository for isolated probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          replacements = {
              "http://download.itemis.com/updates/releases/2.1.1/": "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/",
              "http://download.eclipse.org/modeling/tmf/xtext/updates/releases/xpand/R201406030414": "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -F "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          grep -F "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          old_jre = 'JavaSE-1.7'
          new_jre = 'JavaSE-1.8'
          assert old_jre in s
          p.write_text(s.replace(old_jre, new_jre))
          PY
          grep -n 'targetJRE' releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent.core/pom.xml")
          s = p.read_text()
          marker = '                    <resolver>p2</resolver>\n'
          assert marker in s
          s = s.replace(marker, marker + '                    <executionEnvironment>JavaSE-1.8</executionEnvironment>\n', 1)
          p.write_text(s)
          PY
          grep -F '<executionEnvironment>JavaSE-1.8</executionEnvironment>' releng/org.eclipse.viatra.parent.core/pom.xml
          echo "=== JAVA ENVIRONMENT ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_8_X64=$JAVA_HOME_8_X64"
          echo "=== TOOLCHAIN ==="
          cat "$HOME/.m2/toolchains.xml"
          echo "=== MAVEN/JAVA PROPERTIES ==="
          mvn -version
          echo "=== EFFECTIVE TYCHO CONFIGURATION MARKERS ==="
          grep -R -n -E 'useJDK|executionEnvironment|maven.compiler.source|maven.compiler.target|java.version' releng/org.eclipse.viatra.parent/pom.xml releng/org.eclipse.viatra.parent.core/pom.xml | head -80
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent/pom.xml")
          s = p.read_text()
          old = '<useJDK>BREE</useJDK>'
          new = '<useJDK>SYSTEM</useJDK>'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F '<useJDK>SYSTEM</useJDK>' releng/org.eclipse.viatra.parent/pom.xml
          echo "=== END DIAGNOSTICS ==="

      - name: Add missing EMF Codegen runtime dependency to VIATRA Maven plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("maven/viatra-maven-plugin/pom.xml")
          s = p.read_text()
          marker = """        <dependency>\n            <groupId>org.eclipse.emf</groupId>\n            <artifactId>org.eclipse.emf.codegen.ecore</artifactId>\n            <version>[2.11.0,2.12.0)</version>\n        </dependency>\n"""
          addition = marker + """\n        <dependency>\n            <groupId>org.eclipse.emf</groupId>\n            <artifactId>org.eclipse.emf.codegen</artifactId>\n            <version>2.11.0</version>\n        </dependency>\n"""
          assert s.count(marker) == 1, "Expected exactly one EMF Codegen Ecore dependency block"
          assert "<artifactId>org.eclipse.emf.codegen</artifactId>" not in s, "Dependency already present"
          p.write_text(s.replace(marker, addition, 1))
          PY
          grep -A4 -B2 -F '<artifactId>org.eclipse.emf.codegen</artifactId>' maven/viatra-maven-plugin/pom.xml




      - name: Precompile generated EMF models before VIATRA query generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          NS = 'http://maven.apache.org/POM/4.0.0'
          ET.register_namespace('', NS)

          modules = {
              Path('transformation/plugins/org.eclipse.viatra.transformation.views/pom.xml'): [
                  'org/eclipse/viatra/transformation/views/Traceability*.java',
                  'org/eclipse/viatra/transformation/views/traceability/**/*.java',
              ],
              Path('addon/plugins/org.eclipse.viatra.addon.viewers.runtime/pom.xml'): [
                  'org/eclipse/viatra/addon/viewers/runtime/Notation*.java',
                  'org/eclipse/viatra/addon/viewers/runtime/notation/**/*.java',
              ],
          }

          for p, generated_includes in modules.items():
              assert p.exists(), f'POM not found: {p}'
              tree = ET.parse(p)
              root = tree.getroot()
              ns = {'m': NS}
              plugins = root.find('m:build/m:plugins', ns)
              assert plugins is not None, f'plugins section not found: {p}'
              plugin_list = list(plugins)
              names = [x.findtext('m:artifactId', default='', namespaces=ns) for x in plugin_list]
              viatra_index = names.index('viatra-maven-plugin')
              eclipserun_index = names.index('tycho-eclipserun-plugin')
              assert eclipserun_index < viatra_index, f'{p}: historical EMF generator must precede viatra-maven-plugin'

              compiler_indexes = [i for i, name in enumerate(names) if name == 'maven-compiler-plugin']
              assert len(compiler_indexes) <= 1, f'{p}: unexpected duplicate maven-compiler-plugin'

              if compiler_indexes:
                  compiler = plugin_list[compiler_indexes[0]]
              else:
                  compiler = ET.Element(f'{{{NS}}}plugin')
                  ET.SubElement(compiler, f'{{{NS}}}groupId').text = 'org.apache.maven.plugins'
                  ET.SubElement(compiler, f'{{{NS}}}artifactId').text = 'maven-compiler-plugin'
                  ET.SubElement(compiler, f'{{{NS}}}version').text = '3.5.1'
                  executions = ET.SubElement(compiler, f'{{{NS}}}executions')
                  execution = ET.SubElement(executions, f'{{{NS}}}execution')
                  ET.SubElement(execution, f'{{{NS}}}id').text = 'precompile-emf-generated-model'
                  ET.SubElement(execution, f'{{{NS}}}phase').text = 'generate-sources'
                  goals = ET.SubElement(execution, f'{{{NS}}}goals')
                  ET.SubElement(goals, f'{{{NS}}}goal').text = 'compile'
                  configuration = ET.SubElement(execution, f'{{{NS}}}configuration')
                  ET.SubElement(configuration, f'{{{NS}}}source').text = '1.8'
                  ET.SubElement(configuration, f'{{{NS}}}target').text = '1.8'
                  source_roots = ET.SubElement(configuration, f'{{{NS}}}compileSourceRoots')
                  source_root = ET.SubElement(source_roots, f'{{{NS}}}compileSourceRoot')
                  source_root.text = '${project.basedir}/emf-gen'
                  includes = ET.SubElement(configuration, f'{{{NS}}}includes')
                  for pattern in generated_includes:
                      ET.SubElement(includes, f'{{{NS}}}include').text = pattern
                  plugins.insert(viatra_index, compiler)

              plugin_list = list(plugins)
              names = [x.findtext('m:artifactId', default='', namespaces=ns) for x in plugin_list]
              eclipserun_index = names.index('tycho-eclipserun-plugin')
              compiler_index = names.index('maven-compiler-plugin')
              viatra_index = names.index('viatra-maven-plugin')
              assert eclipserun_index < compiler_index < viatra_index, f'{p}: expected EMF generator -> compiler -> VIATRA order'

              compiler = plugin_list[compiler_index]
              execution = compiler.find('m:executions/m:execution', ns)
              assert execution is not None
              assert execution.findtext('m:phase', default='', namespaces=ns) == 'generate-sources'
              assert execution.findtext('m:goals/m:goal', default='', namespaces=ns) == 'compile'

              compile_roots = execution.find('m:configuration/m:compileSourceRoots', ns)
              assert compile_roots is not None
              roots = [node.text for node in compile_roots.findall('m:compileSourceRoot', ns)]
              assert roots == ['${project.basedir}/emf-gen'], f'{p}: unexpected compileSourceRoots: {roots}'

              includes = execution.find('m:configuration/m:includes', ns)
              assert includes is not None
              actual_includes = [node.text for node in includes.findall('m:include', ns)]
              assert actual_includes == generated_includes, f'{p}: unexpected generated-source includes: {actual_includes}'

              tree.write(p, encoding='utf-8', xml_declaration=True)
              print(f'PRECOMPILE_ORDER_OK={p}')


      - name: Build historical core pass
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -X clean install -f releng/org.eclipse.viatra.parent.core/pom.xml -DskipTests -Dtycho.debug.resolution=true 2>&1 | tee /tmp/viatra-build-debug.log
          echo "=== TYCHO COMPILER DEBUG EXTRACT ==="
          grep -E -i "tycho-compiler-plugin|classpath|bootclasspath|execution environment|JavaSE-|JRE" /tmp/viatra-build-debug.log | tail -300 || true
          echo "=== END TYCHO COMPILER DEBUG EXTRACT ==="
