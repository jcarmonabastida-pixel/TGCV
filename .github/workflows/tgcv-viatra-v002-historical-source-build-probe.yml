name: TGCV VIATRA V002 Historical Source Build Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VIATRA 2.0.2 source
        uses: actions/checkout@v4
        with:
          repository: eclipse-viatra/org.eclipse.viatra
          ref: 2.0.2
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "a304b8ec0d94ff1aee79b6651bf298f612d09e50"
          test -f transformation/plugins/org.eclipse.viatra.transformation.evm/META-INF/MANIFEST.MF
          test -f transformation/plugins/org.eclipse.viatra.transformation.runtime.emf/META-INF/MANIFEST.MF
          test -f query/plugins/org.eclipse.viatra.query.runtime/META-INF/MANIFEST.MF

      - name: Configure Java 8 Maven toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0">
            <toolchain>
              <type>jdk</type>
              <provides>
                <id>JavaSE-1.8</id>
              </provides>
              <configuration>
                <jdkHome>$java_home</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
          test -x "$java_home/bin/java"
          grep -F "<id>JavaSE-1.8</id>" "$HOME/.m2/toolchains.xml"

      - name: Inspect resolved JDT and Java execution environment
        run: |
          echo "=== TARGET PLATFORM / JDT INSPECTION ==="
          find ~/.m2/repository -type f \( -name 'org.eclipse.jdt.launching*.jar' -o -name 'org.eclipse.jdt.core*.jar' \) -print | sort | head -100
          echo "--- resolved JDT/JRE artifacts ---"
          find ~/.m2/repository -type f \( -name '*jdt*launching*.jar' -o -name '*jdt*core*.jar' \) -print | sort | head -100
          echo "--- target platform configuration ---"
          grep -R -n -E 'JavaSE-1\.8|JavaSE-1\.7|org\.eclipse\.jdt\.launching|org\.eclipse\.jdt\.core' target-platform-configuration releng 2>/dev/null | head -200 || true
          echo "=== END TARGET PLATFORM / JDT INSPECTION ==="

      - name: Microprobe Java 8 Stream availability
        run: |
          echo "=== MICROPROBE JAVA 8 STREAM ==="
          cat > /tmp/StreamProbe.java <<'EOF'
          import java.util.stream.Stream;
          public class StreamProbe {
              Stream<String> stream;
              public static void main(String[] args) {
                  Stream<String> s = Stream.of("ok");
                  System.out.println(s.findFirst().get());
              }
          }
          EOF
          javac -source 1.8 -target 1.8 /tmp/StreamProbe.java
          java -cp /tmp StreamProbe
          echo "=== MICROPROBE END ==="

      - name: Inspect duplicate signed Eclipse runtime classes
        run: |
          echo "=== DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class" && echo "$0"' | sort -u
          echo "--- signer metadata ---"
          find ~/.m2 /tmp -type f -name '*.jar' -print0 2>/dev/null | xargs -0 -r -n1 sh -c 'if jar tf "$0" 2>/dev/null | grep -qx "org/eclipse/core/runtime/OperationCanceledException.class"; then echo "### $0"; unzip -p "$0" META-INF/MANIFEST.MF 2>/dev/null | grep -E "^(Bundle-SymbolicName|Bundle-Version|Bundle-Vendor|Bundle-ManifestVersion):"; fi' | sort
          echo "=== END DUPLICATE ECLIPSE RUNTIME CLASS INSPECTION ==="

      - name: Rewrite inaccessible historical Itemis repository for isolated probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          replacements = {
              "http://download.itemis.com/updates/releases/2.1.1/": "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/",
              "http://download.eclipse.org/modeling/tmf/xtext/updates/releases/xpand/R201406030414": "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -F "https://artifacts.itemis.cloud/repository/p2/xtext-updates/releases/2.1.1/" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          grep -F "https://mirror.twds.com.tw/eclipse/modeling/m2t/xpand/updates/releases/R201406030414" releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target")
          s = p.read_text()
          old_jre = 'JavaSE-1.7'
          new_jre = 'JavaSE-1.8'
          assert old_jre in s
          p.write_text(s.replace(old_jre, new_jre))
          PY
          grep -n 'targetJRE' releng/org.eclipse.viatra.target.core/org.eclipse.viatra.target.core.target
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent.core/pom.xml")
          s = p.read_text()
          marker = '                    <resolver>p2</resolver>\n'
          assert marker in s
          s = s.replace(marker, marker + '                    <executionEnvironment>JavaSE-1.8</executionEnvironment>\n', 1)
          p.write_text(s)
          PY
          grep -F '<executionEnvironment>JavaSE-1.8</executionEnvironment>' releng/org.eclipse.viatra.parent.core/pom.xml
          echo "=== JAVA ENVIRONMENT ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_8_X64=$JAVA_HOME_8_X64"
          echo "=== TOOLCHAIN ==="
          cat "$HOME/.m2/toolchains.xml"
          echo "=== MAVEN/JAVA PROPERTIES ==="
          mvn -version
          echo "=== EFFECTIVE TYCHO CONFIGURATION MARKERS ==="
          grep -R -n -E 'useJDK|executionEnvironment|maven.compiler.source|maven.compiler.target|java.version' releng/org.eclipse.viatra.parent/pom.xml releng/org.eclipse.viatra.parent.core/pom.xml | head -80
          python3 - <<'PY'
          from pathlib import Path
          p = Path("releng/org.eclipse.viatra.parent/pom.xml")
          s = p.read_text()
          old = '<useJDK>BREE</useJDK>'
          new = '<useJDK>SYSTEM</useJDK>'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F '<useJDK>SYSTEM</useJDK>' releng/org.eclipse.viatra.parent/pom.xml
          echo "=== END DIAGNOSTICS ==="



      - name: Inject historical Xtend 2.12 JDT compatibility dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('releng/org.eclipse.viatra.parent/pom.xml')
          assert p.exists(), f"historical parent POM not found: {p}"

          ET.register_namespace('', 'http://maven.apache.org/POM/4.0.0')
          tree = ET.parse(p)
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}

          plugins = root.findall('.//m:plugin', ns)
          matches = [
              plugin for plugin in plugins
              if plugin.findtext('m:artifactId', default='', namespaces=ns) == 'xtend-maven-plugin'
          ]
          assert len(matches) == 1, f"expected exactly one xtend-maven-plugin, found {len(matches)}"
          plugin = matches[0]

          deps = [
              ('org.eclipse.jdt', 'org.eclipse.jdt.core', '3.12.2'),
              ('org.eclipse.jdt', 'org.eclipse.jdt.compiler.apt', '1.2.100'),
              ('org.eclipse.emf', 'org.eclipse.emf.codegen', '2.11.0'),
              ('org.eclipse.platform', 'org.eclipse.core.runtime', '3.12.0'),
              ('org.eclipse.platform', 'org.eclipse.equinox.common', '3.9.0'),
          ]

          dependencies = plugin.find('m:dependencies', ns)
          if dependencies is None:
              dependencies = ET.SubElement(plugin, '{http://maven.apache.org/POM/4.0.0}dependencies')

          for gid, aid, version in deps:
              found = [
                  d for d in dependencies.findall('m:dependency', ns)
                  if d.findtext('m:groupId', default='', namespaces=ns) == gid
                  and d.findtext('m:artifactId', default='', namespaces=ns) == aid
              ]
              assert len(found) <= 1, f'duplicate plugin dependency: {gid}:{aid}'
              if found:
                  version_node = found[0].find('m:version', ns)
                  if version_node is None:
                      version_node = ET.SubElement(found[0], '{http://maven.apache.org/POM/4.0.0}version')
                  version_node.text = version
              else:
                  d = ET.SubElement(dependencies, '{http://maven.apache.org/POM/4.0.0}dependency')
                  ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}groupId').text = gid
                  ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}artifactId').text = aid
                  ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}version').text = version

          tree.write(p, encoding='utf-8', xml_declaration=True)
          print(f"PATCHED_POM={p}")
          PY



      - name: Inspect injected Xtend plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path('releng/org.eclipse.viatra.parent/pom.xml')
          root = ET.parse(p).getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          found = []
          for plugin in root.findall('.//m:plugin', ns):
              aid = plugin.findtext('m:artifactId', default='', namespaces=ns)
              if aid == 'xtend-maven-plugin':
                  gid = plugin.findtext('m:groupId', default='org.eclipse.xtend', namespaces=ns)
                  deps = []
                  for d in plugin.findall('./m:dependencies/m:dependency', ns):
                      deps.append((
                          d.findtext('m:groupId', default='', namespaces=ns),
                          d.findtext('m:artifactId', default='', namespaces=ns),
                          d.findtext('m:version', default='', namespaces=ns)
                      ))
                  found.append((gid, deps))

          assert found, 'injected xtend-maven-plugin not found'
          print('=== INJECTED XTEND-MAVEN-PLUGIN DEPENDENCIES ===')
          for gid, deps in found:
              print(f'plugin={gid}:xtend-maven-plugin')
              for d in deps:
                  print(f'{d[0]}:{d[1]}:{d[2]}')
          print('=== END INJECTED XTEND-MAVEN-PLUGIN DEPENDENCIES ===')

          deps = [d for _, ds in found for d in ds]
          assert ('org.eclipse.jdt', 'org.eclipse.jdt.core', '3.12.2') in deps
          assert ('org.eclipse.jdt', 'org.eclipse.jdt.compiler.apt', '1.2.100') in deps
          PY



      - name: Pin historical JDT Core for Maven plugin descriptor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('maven/viatra-maven-plugin/pom.xml')
          assert p.exists(), f'VIATRA Maven plugin POM not found: {p}'

          ET.register_namespace('', 'http://maven.apache.org/POM/4.0.0')
          tree = ET.parse(p)
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}

          matches = [
              plugin for plugin in root.findall('.//m:plugin', ns)
              if plugin.findtext('m:artifactId', default='', namespaces=ns) == 'maven-plugin-plugin'
          ]
          assert len(matches) == 1, f'expected exactly one maven-plugin-plugin, found {len(matches)}'
          plugin = matches[0]
          version = plugin.findtext('m:version', default='', namespaces=ns)
          assert version == '3.5', f'expected maven-plugin-plugin 3.5, found {version!r}'

          dependencies = plugin.find('m:dependencies', ns)
          if dependencies is None:
              dependencies = ET.SubElement(plugin, '{http://maven.apache.org/POM/4.0.0}dependencies')

          matches = [
              d for d in dependencies.findall('m:dependency', ns)
              if d.findtext('m:groupId', default='', namespaces=ns) == 'org.eclipse.jdt'
              and d.findtext('m:artifactId', default='', namespaces=ns) == 'org.eclipse.jdt.core'
          ]
          assert len(matches) <= 1, 'duplicate org.eclipse.jdt.core plugin dependency'

          if matches:
              version_node = matches[0].find('m:version', ns)
              if version_node is None:
                  version_node = ET.SubElement(matches[0], '{http://maven.apache.org/POM/4.0.0}version')
              version_node.text = '3.12.2'
          else:
              d = ET.SubElement(dependencies, '{http://maven.apache.org/POM/4.0.0}dependency')
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}groupId').text = 'org.eclipse.jdt'
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}artifactId').text = 'org.eclipse.jdt.core'
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}version').text = '3.12.2'

          tree.write(p, encoding='utf-8', xml_declaration=True)
          print(f'PATCHED_POM={p}')
          PY
          grep -A8 -B2 -F '<artifactId>maven-plugin-plugin</artifactId>' maven/viatra-maven-plugin/pom.xml


      - name: Pin historical JDT Core in Maven project dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('maven/viatra-maven-plugin/pom.xml')
          ET.register_namespace('', 'http://maven.apache.org/POM/4.0.0')
          tree = ET.parse(p)
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          deps = root.find('m:dependencies', ns)
          if deps is None:
              deps = ET.SubElement(root, '{http://maven.apache.org/POM/4.0.0}dependencies')
          matches = [d for d in deps.findall('m:dependency', ns)
                     if d.findtext('m:groupId', default='', namespaces=ns) == 'org.eclipse.jdt'
                     and d.findtext('m:artifactId', default='', namespaces=ns) == 'org.eclipse.jdt.core']
          assert len(matches) <= 1, 'duplicate direct org.eclipse.jdt.core dependencies'
          if matches:
              v = matches[0].find('m:version', ns)
              if v is None:
                  v = ET.SubElement(matches[0], '{http://maven.apache.org/POM/4.0.0}version')
              v.text = '3.12.2'
          else:
              d = ET.SubElement(deps, '{http://maven.apache.org/POM/4.0.0}dependency')
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}groupId').text = 'org.eclipse.jdt'
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}artifactId').text = 'org.eclipse.jdt.core'
              ET.SubElement(d, '{http://maven.apache.org/POM/4.0.0}version').text = '3.12.2'
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
          grep -A4 -B2 -F '<artifactId>org.eclipse.jdt.core</artifactId>' maven/viatra-maven-plugin/pom.xml


      - name: Diagnose origin of modern JDT Core 3.47.0
        shell: bash
        run: |
          set -euo pipefail
          echo "=== JDT CORE DEPENDENCY TREE ==="
          mvn -B -U -f maven/viatra-maven-plugin/pom.xml dependency:tree -Dverbose -Dincludes=org.eclipse.jdt:org.eclipse.jdt.core
          echo "=== EFFECTIVE POM JDT REFERENCES ==="
          mvn -B -U -f maven/viatra-maven-plugin/pom.xml help:effective-pom -Doutput=/tmp/viatra-maven-plugin-effective-pom.xml
          grep -n -C 5 -E 'org\\.eclipse\\.jdt|3\\.47\\.0' /tmp/viatra-maven-plugin-effective-pom.xml || true
          echo "=== SOURCE POM JDT REFERENCES ==="
          grep -R -n -C 4 -E 'org\\.eclipse\\.jdt|3\\.47\\.0' maven/viatra-maven-plugin/pom.xml maven 2>/dev/null | head -300 || true
          echo "=== END JDT ORIGIN DIAGNOSIS ==="

      - name: Replace historical Eclipse core.resources coordinate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('maven/viatra-maven-plugin/pom.xml')
          ET.register_namespace('', 'http://maven.apache.org/POM/4.0.0')
          tree = ET.parse(p)
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          deps = root.find('m:dependencies', ns)
          assert deps is not None, 'project dependencies not found'
          matches = [d for d in deps.findall('m:dependency', ns)
                     if d.findtext('m:groupId', default='', namespaces=ns) == 'org.eclipse.core'
                     and d.findtext('m:artifactId', default='', namespaces=ns) == 'org.eclipse.core.resources']
          assert len(matches) == 1, f'expected exactly one historical core.resources dependency, found {len(matches)}'
          d = matches[0]
          d.find('m:groupId', ns).text = 'org.eclipse.platform'
          v = d.find('m:version', ns)
          assert v is not None
          v.text = '3.11.1'
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
          echo '=== DIRECT CORE.RESOURCES COORDINATE ==='
          grep -A4 -B2 -F '<artifactId>org.eclipse.core.resources</artifactId>' maven/viatra-maven-plugin/pom.xml

      - name: Exclude core.expressions from normalized core.resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('maven/viatra-maven-plugin/pom.xml')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ET.register_namespace('', ns['m'])
          tree = ET.parse(p)
          root = tree.getroot()
          deps = root.find('m:dependencies', ns)
          assert deps is not None, 'project dependencies not found'
          core = next((d for d in deps.findall('m:dependency', ns)
                       if d.findtext('m:groupId', default='', namespaces=ns) == 'org.eclipse.platform'
                       and d.findtext('m:artifactId', default='', namespaces=ns) == 'org.eclipse.core.resources'), None)
          assert core is not None, 'normalized core.resources dependency not found'
          exclusions = core.find('m:exclusions', ns)
          if exclusions is None:
              exclusions = ET.SubElement(core, '{%s}exclusions' % ns['m'])
          key = ('org.eclipse.platform', 'org.eclipse.core.expressions')
          existing = any((e.findtext('m:groupId', default='', namespaces=ns),
                          e.findtext('m:artifactId', default='', namespaces=ns)) == key
                         for e in exclusions.findall('m:exclusion', ns))
          if not existing:
              e = ET.SubElement(exclusions, '{%s}exclusion' % ns['m'])
              ET.SubElement(e, '{%s}groupId' % ns['m']).text = key[0]
              ET.SubElement(e, '{%s}artifactId' % ns['m']).text = key[1]
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('EXCLUDED_FROM=org.eclipse.platform:org.eclipse.core.resources')
          print('EXCLUDED=org.eclipse.platform:org.eclipse.core.expressions')
          PY
          echo '=== NORMALIZED CORE.RESOURCES DEPENDENCY ==='
          grep -A12 -B2 -F '<artifactId>org.eclipse.core.resources</artifactId>' maven/viatra-maven-plugin/pom.xml

      - name: Isolate JDT 3.47.0 from historical Maven plugin project realm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("maven/viatra-maven-plugin/pom.xml")
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          ET.register_namespace("", ns["m"])
          tree = ET.parse(p)
          root = tree.getroot()
          deps = root.find("m:dependencies", ns)
          assert deps is not None, "project dependencies not found"
          xtext = next((d for d in deps.findall("m:dependency", ns)
                        if d.findtext("m:groupId", default="", namespaces=ns) == "org.eclipse.xtext"
                        and d.findtext("m:artifactId", default="", namespaces=ns) == "xtext-maven-plugin"), None)
          assert xtext is not None, "xtext-maven-plugin project dependency not found"
          exclusions = xtext.find("m:exclusions", ns)
          if exclusions is None:
              exclusions = ET.SubElement(xtext, "{%s}exclusions" % ns["m"])
          wanted = {
              # Remove only the historical coordinates observed in the failed realm.
              ("org.eclipse.emf", "org.eclipse.emf.codegen"),
              ("org.eclipse.core", "org.eclipse.core.resources"),
              ("org.eclipse.core", "org.eclipse.core.runtime"),
              ("org.eclipse.core", "org.eclipse.core.jobs"),
              ("org.eclipse.core", "org.eclipse.core.filesystem"),
              ("org.eclipse.equinox", "org.eclipse.equinox.common"),
              ("org.eclipse.equinox", "org.eclipse.equinox.registry"),
              ("org.eclipse.equinox", "org.eclipse.equinox.preferences"),
              ("org.eclipse.jdt", "org.eclipse.jdt.core"),
              ("org.eclipse.jdt", "org.eclipse.jdt.compiler.apt"),
              ("org.eclipse.jdt", "org.eclipse.jdt.launching"),
              ("org.eclipse.platform", "org.eclipse.debug.core"),
          }
          for gid_text, aid_text in sorted(wanted):
              if not any((e.findtext("m:groupId", default="", namespaces=ns) == gid_text and
                          e.findtext("m:artifactId", default="", namespaces=ns) == aid_text)
                         for e in exclusions.findall("m:exclusion", ns)):
                  e = ET.SubElement(exclusions, "{%s}exclusion" % ns["m"])
                  ET.SubElement(e, "{%s}groupId" % ns["m"]).text = gid_text
                  ET.SubElement(e, "{%s}artifactId" % ns["m"]).text = aid_text
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
          echo "=== XTEXT MAVEN PLUGIN JDT EXCLUSIONS ==="
          grep -A24 -B4 -F '<artifactId>xtext-maven-plugin</artifactId>' maven/viatra-maven-plugin/pom.xml
          echo "=== JDT PROJECT TREE AFTER EXCLUSION ==="
          mvn -B -U -f maven/viatra-maven-plugin/pom.xml dependency:tree -Dverbose -Dincludes=org.eclipse.jdt:org.eclipse.jdt.core
          echo "=== END JDT PROJECT TREE AFTER EXCLUSION ==="

      - name: Trace modern core.resources entry through JDT 3.12.2
        shell: bash
        run: |
          set -euo pipefail
          echo "=== JDT 3.12.2 POM DEPENDENCIES ==="
          JDT_POM="$HOME/.m2/repository/org/eclipse/jdt/org.eclipse.jdt.core/3.12.2/org.eclipse.jdt.core-3.12.2.pom"
          test -f "$JDT_POM"
          python3 - "$JDT_POM" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          p = sys.argv[1]
          root = ET.parse(p).getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          for d in root.findall('./m:dependencies/m:dependency', ns):
              gid = d.findtext('m:groupId', default='', namespaces=ns)
              aid = d.findtext('m:artifactId', default='', namespaces=ns)
              ver = d.findtext('m:version', default='', namespaces=ns)
              scope = d.findtext('m:scope', default='', namespaces=ns) or 'compile'
              if gid.startswith('org.eclipse') or gid.startswith('org.osgi'):
