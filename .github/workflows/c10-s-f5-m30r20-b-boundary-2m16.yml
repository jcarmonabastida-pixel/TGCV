name: C10-S F5 M30 R20 B and boundary robustness at 2^-16

on:
  push:
    branches:
      - research/c10s-instrumental-autonomous-workpackage-20261126
    paths:
      - '.github/workflows/c10-s-f5-m30r20-b-boundary-2m16.yml'
      - '03_EXPERIMENTS/C10-S/harness/profile_c10s_f5_m30r20_b_boundary_2m16.py'

permissions:
  contents: read

jobs:
  m30r20-b-boundary-2m16:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Compile robustness profiler
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m py_compile profile_c10s_f5_m30r20_b_boundary_2m16.py c10s_f5_sturm_call_instrumentation.py c10s_f5_component_profile_score.py c10s_f5_rational_score_polynomials.py
      - name: Run bounded B and boundary fixtures
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B profile_c10s_f5_m30r20_b_boundary_2m16.py
