name: G7 final adjudication contract tests

on:
  push:
    branches:
      - fix/g7-final-adjudication-resource-manifest-schema-20261126
    paths:
      - '.github/workflows/g7-final-adjudication-contract-tests.yml'
      - '03_EXPERIMENTS/C10-S/harness/aggregate_c10s_f5_g7_tiera_shards.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f5_g7_shard_execution.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_g7_shard_execution.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  g7-adjudication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock"

      - name: Compile adjudicator and its test module
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: >-
          python -m py_compile
          aggregate_c10s_f5_g7_tiera_shards.py
          c10s_f5_g7_shard_execution.py
          test_c10s_f5_g7_shard_execution.py

      - name: Run shard and full-aggregator unit tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m unittest -v test_c10s_f5_g7_shard_execution.py
