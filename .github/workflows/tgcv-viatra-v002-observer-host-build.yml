name: TGCV VIATRA V002 Observer Host Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout TGCV
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          mvn -version | tee maven-version.txt

      - name: Materialize pinned historical CPS model bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash materialize-historical-cps-models.sh

      - name: Comprehensive build-readiness preflight
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash build-readiness-preflight.sh

      - name: Tycho dependency-resolution gate
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -DskipTests validate

      - name: Build Tycho reactor
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp clean verify
