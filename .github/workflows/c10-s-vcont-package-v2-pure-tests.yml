name: C10-S V_cont package v2 pure capture tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vcont-package-v2-pure-capture-tests:
    name: Pure capture fixtures — no synthetic producer execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact research-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hash-locked JCS dependency
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-v2.lock'

      - name: Compile only pure capture module and fixture tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile vcont_evidence_export.py test_vcont_capture_v2.py

      - name: Run only pure capture fixture tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_vcont_capture_v2
