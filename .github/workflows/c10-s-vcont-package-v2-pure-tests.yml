name: C10-S V_cont package v2 pure capture, writer and verifier tests

on:
  push:
    branches:
      - research/c10-s-consolidation-draft
    paths:
      - '.github/workflows/c10-s-vcont-package-v2-pure-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vcont-package-v2-pure-capture-tests:
    name: Pure capture, package writer and independent verifier fixtures — no synthetic producer execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce research-branch-only execution
        shell: bash
        run: test "${GITHUB_REF}" = "refs/heads/research/c10-s-consolidation-draft"

      - name: Check out exact research-branch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ac6ee419f2bc8fae2d0554e4148fe198af332a3e

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Assert runner platform and capture runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p "$RUNNER_TEMP/c10s-runtime"
          python -c "import json,platform,sys; print(json.dumps({'implementation':platform.python_implementation(),'version':sys.version,'executable':sys.executable,'machine':platform.machine(),'platform':platform.platform(),'libc':platform.libc_ver()},sort_keys=True))" > "$RUNNER_TEMP/c10s-runtime/python-runtime.json"
          python -m pip --version > "$RUNNER_TEMP/c10s-runtime/pip-version.txt"
          cp /etc/os-release "$RUNNER_TEMP/c10s-runtime/os-release.txt"
          printf '%s\n' "${ImageOS:-unknown}" > "$RUNNER_TEMP/c10s-runtime/runner-image-os.txt"
          printf '%s\n' "${ImageVersion:-unknown}" > "$RUNNER_TEMP/c10s-runtime/runner-image-version.txt"
          uname -a > "$RUNNER_TEMP/c10s-runtime/uname.txt"
          ldd --version > "$RUNNER_TEMP/c10s-runtime/libc-version.txt" 2>&1 || true

      - name: Materialize exact EP-03 pure source closure
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/c10s-ep03-source"
          mkdir -p "$source_root"
          profile_paths=(
            03_EXPERIMENTS/C10-S/harness/test_vcont_capture_v2.py
            03_EXPERIMENTS/C10-S/harness/test_vcont_package_v2_serialization.py
            03_EXPERIMENTS/C10-S/harness/test_vcont_package_v2_verifier.py
            03_EXPERIMENTS/C10-S/harness/vcont_evidence_export.py
            03_EXPERIMENTS/C10-S/harness/vcont_package_v2.py
            03_EXPERIMENTS/C10-S/harness/vcont_package_v2_verify.py
            03_EXPERIMENTS/C10-S/harness/vcont_benchmark_protocol.py
            03_EXPERIMENTS/C10-S/harness/vcont_integrated_harness.py
            03_EXPERIMENTS/C10-S/harness/requirements-vcont-v2.lock
          )
          git archive "ac6ee419f2bc8fae2d0554e4148fe198af332a3e" "${profile_paths[@]}" | tar -x -C "$source_root"

      - name: Install existing hash-locked pure-profile dependency
        working-directory: ${{ runner.temp }}/c10s-ep03-source/03_EXPERIMENTS/C10-S/harness
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-v2.lock"

      - name: Compile only allowlisted pure capture, writer and verifier modules
        working-directory: ${{ runner.temp }}/c10s-ep03-source/03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile vcont_evidence_export.py vcont_package_v2.py vcont_package_v2_verify.py vcont_benchmark_protocol.py vcont_integrated_harness.py test_vcont_capture_v2.py test_vcont_package_v2_serialization.py test_vcont_package_v2_verifier.py

      - name: Remove generated bytecode and assert clean EP-03 import boundary
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/c10s-ep03-source/03_EXPERIMENTS/C10-S" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/c10s-ep03-source/03_EXPERIMENTS/C10-S" -type f -name '*.pyc' -delete
          if find "$RUNNER_TEMP/c10s-ep03-source/03_EXPERIMENTS/C10-S" \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit | grep -q .; then
            echo "Undeclared bytecode cache remains" >&2; exit 1
          fi

      - name: Run only allowlisted pure capture, package writer and verifier fixtures
        working-directory: ${{ runner.temp }}/c10s-ep03-source/03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest -v test_vcont_capture_v2 test_vcont_package_v2_serialization test_vcont_package_v2_verifier > "$RUNNER_TEMP/c10s-pure-tests-stdout.txt" 2> "$RUNNER_TEMP/c10s-pure-tests-stderr.txt"
          cat "$RUNNER_TEMP/c10s-pure-tests-stdout.txt"
          cat "$RUNNER_TEMP/c10s-pure-tests-stderr.txt" >&2
          if find "$RUNNER_TEMP/c10s-ep03-source/03_EXPERIMENTS/C10-S" \( -type d -name __pycache__ -o -type f -name "*.pyc" \) -print -quit | grep -q .; then exit 1; fi

      - name: Upload pure-test runtime payload and capture artifact identity
        id: payload
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-vcont-pure-payload-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c10s-runtime/**
            ${{ runner.temp }}/c10s-pure-tests-stdout.txt
            ${{ runner.temp }}/c10s-pure-tests-stderr.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Record pure-profile execution and materialization manifest
        id: manifest
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"]); temp=Path(os.environ["RUNNER_TEMP"])
          paths=[
            "03_EXPERIMENTS/C10-S/harness/test_vcont_capture_v2.py",
            "03_EXPERIMENTS/C10-S/harness/test_vcont_package_v2_serialization.py",
            "03_EXPERIMENTS/C10-S/harness/test_vcont_package_v2_verifier.py",
            "03_EXPERIMENTS/C10-S/harness/vcont_evidence_export.py",
            "03_EXPERIMENTS/C10-S/harness/vcont_package_v2.py",
            "03_EXPERIMENTS/C10-S/harness/vcont_package_v2_verify.py",
            "03_EXPERIMENTS/C10-S/harness/vcont_benchmark_protocol.py",
            "03_EXPERIMENTS/C10-S/harness/vcont_integrated_harness.py",
            "03_EXPERIMENTS/C10-S/harness/requirements-vcont-v2.lock"]
          def sha(p):
            h=hashlib.sha256()
            with p.open("rb") as f:
              for b in iter(lambda:f.read(1048576),b""): h.update(b)
            return h.hexdigest()
          m={
            "schema":"TGCV-C10S-EXECUTION-MATERIALIZATION-1","profile":"EP-03-VCONT-PURE-CAPTURE-WRITER-VERIFIER",
            "workflow_path":".github/workflows/c10-s-vcont-package-v2-pure-tests.yml",
            "workflow_blob_sha":subprocess.check_output(["git","hash-object",".github/workflows/c10-s-vcont-package-v2-pure-tests.yml"],text=True).strip(),
            "repository":os.environ["GITHUB_REPOSITORY"],"commit":os.environ["GITHUB_SHA"],
            "tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
            "event":os.environ["GITHUB_EVENT_NAME"],"ref":os.environ["GITHUB_REF"],
            "run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"job":os.environ.get("GITHUB_JOB"),"manifest_step_id":"manifest","job_status":os.environ.get("JOB_STATUS"),
            "authorization":{"type":"manual_dispatch","scope":"pure capture/writer/verifier fixtures only; no synthetic producer"},
            "actions":{"checkout":"de0fac2e4500dabe0009e67214ff5f5447ce83dd","setup-python":"83679a892e2d95755f2dac6acb0bfd1e9ac5d548","upload-artifact":"b7c566a772e6b6bfb58ed0dc250532a479d7789f"},
            "runner":{"image_os":os.environ.get("ImageOS"),"image_version":os.environ.get("ImageVersion"),"os_release":Path("/etc/os-release").read_text(),"uname":subprocess.check_output(["uname","-a"],text=True).strip(),"architecture":platform.machine(),"libc":platform.libc_ver()},
            "runtime":{"python":subprocess.check_output(["python","-c","import sys;print(sys.version)"],text=True).strip(),"pip":subprocess.check_output(["python","-m","pip","--version"],text=True).strip(),"installed":subprocess.check_output(["python","-m","pip","freeze"],text=True).splitlines()},
            "dependencies":{"lock":paths[8],"lock_blob_sha":subprocess.check_output(["git","hash-object",paths[8]],text=True).strip(),"install_command":"python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-v2.lock"},"python_patch_policy":"CPython 3.12.10; last 3.12 release with binary installers; later 3.12 security releases are source-only","selected_wheels":[{"filename":"rfc8785-0.1.4-py3-none-any.whl","platform_tags":["py3-none-any"],"sha256":"520d690b448ecf0703691c76e1a34a24ddcd4fc5bc41d589cb7c58ec651bcd48"}],
            "tests":{"modules":["test_vcont_capture_v2","test_vcont_package_v2_serialization","test_vcont_package_v2_verifier"],"command":"python -B -m unittest -v test_vcont_capture_v2 test_vcont_package_v2_serialization test_vcont_package_v2_verifier","working_directory":"$RUNNER_TEMP/c10s-ep03-source/03_EXPERIMENTS/C10-S/harness","bytecode_cache_policy":"compile, delete all __pycache__ and .pyc, assert absent, execute with -B"},
            "inputs":[{"path":p,"sha256":sha(root/p),"size_bytes":(root/p).stat().st_size,"mode":oct((root/p).stat().st_mode & 0o777),"file_type":"regular_file","evidence_state":"materialized_input","consumption":"not_observed"} for p in paths],
            "source_materialization":{"root":"$RUNNER_TEMP/c10s-ep03-source","archive_paths":paths},
            "artifact":{"payload_id":os.environ.get("PAYLOAD_ARTIFACT_ID"),"payload_digest":os.environ.get("PAYLOAD_ARTIFACT_DIGEST")},"outputs":{n:(sha(temp/n) if (temp/n).exists() else None) for n in ["c10s-pure-tests-stdout.txt","c10s-pure-tests-stderr.txt"]}}
          (temp/"c10s-vcont-pure-execution-materialization-manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload pure-profile execution manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-vcont-pure-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c10s-vcont-pure-execution-materialization-manifest.json
          if-no-files-found: warn
          retention-days: 30
