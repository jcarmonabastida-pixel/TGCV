name: C10-S V_cont package v2 pure capture, writer and verifier tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vcont-package-v2-pure-capture-tests:
    name: Pure capture, package writer and independent verifier fixtures — no synthetic producer execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce research-branch-only execution
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/research/c10-s-consolidation-draft"

      - name: Check out exact research-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hash-locked JCS dependency
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-v2.lock'

      - name: Compile only allowlisted pure capture, writer and fixture modules
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile vcont_evidence_export.py vcont_package_v2.py vcont_package_v2_verify.py test_vcont_capture_v2.py test_vcont_package_v2_serialization.py test_vcont_package_v2_verifier.py

      - name: Run only allowlisted pure capture and package writer fixtures
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_vcont_capture_v2 test_vcont_package_v2_serialization test_vcont_package_v2_verifier
