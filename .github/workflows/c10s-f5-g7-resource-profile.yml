name: C10-S F5/G7 v1.1 resource-only preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/c10s-f5-g7-canonical-mle-v1.1-20261122
    paths:
      - .github/workflows/c10s-f5-g7-resource-profile.yml
      - 03_EXPERIMENTS/C10-S/harness/profile_c10s_f5_g7_resource_preflight_parallel.py
      - 03_EXPERIMENTS/C10-S/harness/run_c10s_f5_g7_tiera_calibration.py
      - 03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock

permissions:
  contents: write

concurrency:
  group: c10s-f5-g7-resource-profile-v1-1
  cancel-in-progress: false

jobs:
  resource-only-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable profiling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Run v1.1 resource-only profile
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python profile_c10s_f5_g7_resource_preflight_parallel.py \
            --output "$RUNNER_TEMP/c10s-f5-g7-resource-parallel-profile.json"
      - name: Upload immutable resource-only profile
        id: profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-profile-v1-1
          path: ${{ runner.temp }}/c10s-f5-g7-resource-parallel-profile.json
          if-no-files-found: error
          retention-days: 90
      - name: Create provenance manifest for the immutable profile
        env:
          PROFILE_ARTIFACT_ID: ${{ steps.profile.outputs.artifact-id }}
          PROFILE_ARTIFACT_DIGEST: ${{ steps.profile.outputs.artifact-digest }}
          PROFILE_SOURCE_COMMIT: ${{ github.sha }}
          PROFILE_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          profile = Path(os.environ["RUNNER_TEMP"], "c10s-f5-g7-resource-parallel-profile.json")
          payload = {
              "schema": "C10S-F5-G7-RESOURCE-PROFILE-MANIFEST-002",
              "profile_run_id": int(os.environ["PROFILE_RUN_ID"]),
              "profile_artifact_id": int(os.environ["PROFILE_ARTIFACT_ID"]),
              "profile_source_commit": os.environ["PROFILE_SOURCE_COMMIT"],
              "profile_artifact_archive_sha256": os.environ["PROFILE_ARTIFACT_DIGEST"].removeprefix("sha256:"),
              "profile_json_sha256": hashlib.sha256(profile.read_bytes()).hexdigest(),
          }
          target = Path("03_EXPERIMENTS/C10-S/diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_002.json")
          target.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Persist exact artifact provenance manifest on research branch
        env:
          PROFILE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_EXPERIMENTS/C10-S/diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_002.json
          git commit -m "data(c10s): record G7 v1.1 resource profile provenance"
          git push origin "HEAD:research/c10s-f5-g7-canonical-mle-v1.1-20261122"
