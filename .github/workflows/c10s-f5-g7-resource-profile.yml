name: C10-S F5/G7 v1.1 resource-only preflight

on:
  push:
    branches:
      - research/c10s-f5-g7-canonical-mle-v1.1-20261122
    paths:
      - .github/workflows/c10s-f5-g7-resource-profile.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c10s-f5-g7-resource-profile-v1-1
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  resource-shards:
    name: Resource shard ${{ matrix.cell_id }} / ${{ matrix.replicate_start }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - cell_id: F5_beta22_M10_R5
            replicate_start: 0
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 10
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 20
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 30
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 40
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 50
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 60
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 70
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 80
            replicate_count: 10
          - cell_id: F5_beta22_M10_R5
            replicate_start: 90
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 0
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 10
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 20
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 30
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 40
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 50
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 60
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 70
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 80
            replicate_count: 10
          - cell_id: F5_beta22_M30_R20
            replicate_start: 90
            replicate_count: 10
    steps:
      - name: Checkout immutable profiling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock"
      - name: Execute deterministic timing-only shard
        working-directory: .
        run: |
          python 03_EXPERIMENTS/C10-S/harness/run_c10s_f5_g7_resource_shard.py \
            --cell-id "${{ matrix.cell_id }}" \
            --replicate-start "${{ matrix.replicate_start }}" \
            --replicate-count "${{ matrix.replicate_count }}" \
            --output "$RUNNER_TEMP/resource-shard-${{ matrix.cell_id }}-${{ matrix.replicate_start }}.json"
      - name: Upload immutable shard result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-shard-${{ matrix.cell_id }}-${{ matrix.replicate_start }}
          path: ${{ runner.temp }}/resource-shard-${{ matrix.cell_id }}-${{ matrix.replicate_start }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate-resource-profile:
    name: Verify and aggregate all resource shards
    needs: resource-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable profiling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Download shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: c10s-f5-g7-resource-shard-*
          path: ${{ runner.temp }}/resource-shards
          merge-multiple: true
      - name: Verify roster, replica identities and hashes; aggregate
        working-directory: .
        run: |
          python 03_EXPERIMENTS/C10-S/harness/aggregate_c10s_f5_g7_resource_shards.py \
            --shard-dir "$RUNNER_TEMP/resource-shards" \
            --output "$RUNNER_TEMP/c10s-f5-g7-resource-profile.json"
      - name: Upload consolidated resource-only profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-profile-v1-1
          path: ${{ runner.temp }}/c10s-f5-g7-resource-profile.json
          if-no-files-found: error
          retention-days: 90

  finalize-profile-manifest:
    name: Bind profile to immutable run and artifact
    needs: aggregate-resource-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable profiling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Download consolidated resource profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c10s-f5-g7-resource-profile-v1-1
          path: ${{ runner.temp }}/resource-profile
      - name: Create schema-002 manifest with archive and source digests
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python 03_EXPERIMENTS/C10-S/harness/create_c10s_f5_g7_resource_profile_manifest.py \
            --profile "$RUNNER_TEMP/resource-profile/c10s-f5-g7-resource-profile.json" \
            --output "$RUNNER_TEMP/resource-profile/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_002.json"
      - name: Upload immutable profile and manifest bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-profile-v1-1-validated-bundle
          path: ${{ runner.temp }}/resource-profile/
          if-no-files-found: error
          retention-days: 90
