name: C10-S P178 Analyzer Monte Carlo validation

on:
  workflow_dispatch:
    inputs:
      confirm_p178_profile_execution:
        description: "Authorize P178 synthetic contract tests, 27x10,000 Monte Carlo, clean replay and capture"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  p178-analyzer-monte-carlo:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/c10-s-consolidation-draft' && inputs.confirm_p178_profile_execution == true
    name: Explicitly authorized P178 profile and clean replay
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact research-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'

      - name: Assert runner platform and capture runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p "$RUNNER_TEMP/c10s-runtime"
          python --version > "$RUNNER_TEMP/c10s-runtime/python-version.txt" 2>&1
          python -c "import json,platform,sys; print(json.dumps({'implementation':platform.python_implementation(),'version':sys.version,'executable':sys.executable,'machine':platform.machine(),'platform':platform.platform(),'libc':platform.libc_ver()},sort_keys=True))" > "$RUNNER_TEMP/c10s-runtime/python-runtime.json"
          python -m pip --version > "$RUNNER_TEMP/c10s-runtime/pip-version.txt"
          cp /etc/os-release "$RUNNER_TEMP/c10s-runtime/os-release.txt"
          printf '%s\n' "${ImageOS:-unknown}" > "$RUNNER_TEMP/c10s-runtime/runner-image-os.txt"
          printf '%s\n' "${ImageVersion:-unknown}" > "$RUNNER_TEMP/c10s-runtime/runner-image-version.txt"
          uname -a > "$RUNNER_TEMP/c10s-runtime/uname.txt"
          ldd --version > "$RUNNER_TEMP/c10s-runtime/libc-version.txt" 2>&1 || true

      - name: Install complete hash-locked EP-01 dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-p178-analyzer.lock

      - name: Materialize identical primary and replay source closures
        shell: bash
        run: |
          set -euo pipefail
          primary_root="$RUNNER_TEMP/c10s-primary-source"
          replay_root="$RUNNER_TEMP/c10s-clean-replay"
          mkdir -p "$primary_root" "$replay_root"
          profile_paths=(
            03_EXPERIMENTS/C10-S/harness/test_focal_harness.py
            03_EXPERIMENTS/C10-S/harness/test_p178_analyzer_bridge.py
            03_EXPERIMENTS/C10-S/harness/test_p178_analyzer_monte_carlo.py
            03_EXPERIMENTS/C10-S/harness/focal_harness.py
            03_EXPERIMENTS/C10-S/harness/run_p178_analyzer_monte_carlo.py
            03_EXPERIMENTS/C10-S/harness/requirements-p178-analyzer.lock
            03_EXPERIMENTS/C10-S/calibration/p178_focal_monte_carlo.py
            03_EXPERIMENTS/C10-S/calibration/p178_reference_N700.csv
          )
          git archive "$GITHUB_SHA" "${profile_paths[@]}" | tar -x -C "$primary_root"
          git archive "$GITHUB_SHA" "${profile_paths[@]}" | tar -x -C "$replay_root"
          diff -qr "$primary_root" "$replay_root"

      - name: Compile declared P178 source and tests in primary materialization
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c10s-primary-source/03_EXPERIMENTS/C10-S/harness"
          python -m py_compile focal_harness.py test_focal_harness.py test_p178_analyzer_bridge.py run_p178_analyzer_monte_carlo.py test_p178_analyzer_monte_carlo.py ../calibration/p178_focal_monte_carlo.py

      - name: Remove generated bytecode and assert equivalent clean boundaries
        shell: bash
        run: |
          set -euo pipefail
          for root in "$RUNNER_TEMP/c10s-primary-source" "$RUNNER_TEMP/c10s-clean-replay"; do
            find "$root/03_EXPERIMENTS/C10-S" -type d -name __pycache__ -prune -exec rm -rf {} +
            find "$root/03_EXPERIMENTS/C10-S" -type f -name '*.pyc' -delete
            if find "$root/03_EXPERIMENTS/C10-S" \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit | grep -q .; then
              echo "Undeclared bytecode cache remains in $root" >&2; exit 1
            fi
          done
          diff -qr "$RUNNER_TEMP/c10s-primary-source" "$RUNNER_TEMP/c10s-clean-replay"

      - name: Run explicit P178 contract and smoke-test modules
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c10s-primary-source/03_EXPERIMENTS/C10-S/harness"
          python -B -m unittest -v test_focal_harness test_p178_analyzer_bridge test_p178_analyzer_monte_carlo > "$RUNNER_TEMP/c10s-primary-tests-stdout.txt" 2> "$RUNNER_TEMP/c10s-primary-tests-stderr.txt"
          cat "$RUNNER_TEMP/c10s-primary-tests-stdout.txt"
          cat "$RUNNER_TEMP/c10s-primary-tests-stderr.txt" >&2

      - name: Execute primary 27-cell Analyzer Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c10s-primary"
          cd "$RUNNER_TEMP/c10s-primary-source"
          PYTHONDONTWRITEBYTECODE=1 python -B 03_EXPERIMENTS/C10-S/harness/run_p178_analyzer_monte_carlo.py --out "$RUNNER_TEMP/c10s-primary" --replications 10000 --strict-protocol > "$RUNNER_TEMP/c10s-primary-stdout.txt" 2> "$RUNNER_TEMP/c10s-primary-stderr.txt"
          cat "$RUNNER_TEMP/c10s-primary-stdout.txt"
          cat "$RUNNER_TEMP/c10s-primary-stderr.txt" >&2

      - name: Replay explicit tests and Monte Carlo from equivalent source materialization
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c10s-clean-replay/03_EXPERIMENTS/C10-S/harness"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v test_focal_harness test_p178_analyzer_bridge test_p178_analyzer_monte_carlo > "$RUNNER_TEMP/c10s-replay-tests-stdout.txt" 2> "$RUNNER_TEMP/c10s-replay-tests-stderr.txt"
          cd "$RUNNER_TEMP/c10s-clean-replay"
          PYTHONDONTWRITEBYTECODE=1 python -B 03_EXPERIMENTS/C10-S/harness/run_p178_analyzer_monte_carlo.py --out "$RUNNER_TEMP/c10s-replay" --replications 10000 --strict-protocol > "$RUNNER_TEMP/c10s-replay-stdout.txt" 2> "$RUNNER_TEMP/c10s-replay-stderr.txt"
          cmp "$RUNNER_TEMP/c10s-primary/p178_analyzer_monte_carlo.csv" "$RUNNER_TEMP/c10s-replay/p178_analyzer_monte_carlo.csv"
          cmp "$RUNNER_TEMP/c10s-primary/p178_analyzer_monte_carlo_manifest.json" "$RUNNER_TEMP/c10s-replay/p178_analyzer_monte_carlo_manifest.json"
          for root in "$RUNNER_TEMP/c10s-primary-source" "$RUNNER_TEMP/c10s-clean-replay"; do
            if find "$root/03_EXPERIMENTS/C10-S" \\( -type d -name __pycache__ -o -type f -name '*.pyc' \\) -print -quit | grep -q .; then exit 1; fi
          done
          diff -qr "$RUNNER_TEMP/c10s-primary-source" "$RUNNER_TEMP/c10s-clean-replay"

      - name: Upload execution payload and capture artifact identity
        id: payload
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: c10s-p178-payload-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c10s-primary/**
            ${{ runner.temp }}/c10s-replay/**
            ${{ runner.temp }}/c10s-runtime/**
            ${{ runner.temp }}/c10s-primary-stdout.txt
            ${{ runner.temp }}/c10s-primary-stderr.txt
            ${{ runner.temp }}/c10s-primary-tests-stdout.txt
            ${{ runner.temp }}/c10s-primary-tests-stderr.txt
            ${{ runner.temp }}/c10s-replay-stdout.txt
            ${{ runner.temp }}/c10s-replay-stderr.txt
            ${{ runner.temp }}/c10s-replay-tests-stdout.txt
            ${{ runner.temp }}/c10s-replay-tests-stderr.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Record profile execution and materialization manifest
        id: manifest
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CONFIRM_P178_PROFILE_EXECUTION: ${{ inputs.confirm_p178_profile_execution }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          temp = Path(os.environ["RUNNER_TEMP"])
          paths = [
              "03_EXPERIMENTS/C10-S/harness/test_focal_harness.py",
              "03_EXPERIMENTS/C10-S/harness/test_p178_analyzer_bridge.py",
              "03_EXPERIMENTS/C10-S/harness/test_p178_analyzer_monte_carlo.py",
              "03_EXPERIMENTS/C10-S/harness/focal_harness.py",
              "03_EXPERIMENTS/C10-S/harness/run_p178_analyzer_monte_carlo.py",
              "03_EXPERIMENTS/C10-S/harness/requirements-p178-analyzer.lock",
              "03_EXPERIMENTS/C10-S/calibration/p178_focal_monte_carlo.py",
              "03_EXPERIMENTS/C10-S/calibration/p178_reference_N700.csv",
          ]
          def digest(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()
          manifest = {
              "schema":"TGCV-C10S-EXECUTION-MATERIALIZATION-1",
              "profile":"EP-01-P178-ANALYZER-MONTE-CARLO",
              "workflow_path":".github/workflows/c10-s-analyzer-monte-carlo.yml",
              "workflow_blob_sha":subprocess.check_output(["git","hash-object",".github/workflows/c10-s-analyzer-monte-carlo.yml"],text=True).strip(),
              "repository":os.environ["GITHUB_REPOSITORY"],"commit":os.environ["GITHUB_SHA"],
              "tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
              "event":os.environ["GITHUB_EVENT_NAME"],"ref":os.environ["GITHUB_REF"],
              "run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"job":os.environ.get("GITHUB_JOB"),"manifest_step_id":"manifest","job_status":os.environ.get("JOB_STATUS"),
              "authorization":{"input":"confirm_p178_profile_execution","value":os.environ.get("CONFIRM_P178_PROFILE_EXECUTION","not_exported"),"scope":"named synthetic tests + 27x10000 Monte Carlo + replay + capture"},
              "actions":{"checkout":"11bd71901bbe5b1630ceea73d27597364c9af683","setup-python":"a26af69be951a213d495a4c3e4e4022e16d87065","upload-artifact":"65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08"},
              "runner":{"image_os":os.environ.get("ImageOS"),"image_version":os.environ.get("ImageVersion"),"uname":subprocess.check_output(["uname","-a"],text=True).strip(),"os_release":Path("/etc/os-release").read_text(),"architecture":subprocess.check_output(["uname","-m"],text=True).strip()},
              "runtime":{"python":subprocess.check_output(["python","-c","import sys;print(sys.version)"],text=True).strip(),"pip":subprocess.check_output(["python","-m","pip","--version"],text=True).strip(),"libc":__import__("platform").libc_ver()},
              "dependencies":{"lock":"03_EXPERIMENTS/C10-S/harness/requirements-p178-analyzer.lock","lock_blob_sha":subprocess.check_output(["git","hash-object",paths[5]],text=True).strip(),"distributions":subprocess.check_output(["python","-m","pip","freeze"],text=True).splitlines()},
              "tests":{"modules":["test_focal_harness","test_p178_analyzer_bridge","test_p178_analyzer_monte_carlo"],"command":"python -B -m unittest -v test_focal_harness test_p178_analyzer_bridge test_p178_analyzer_monte_carlo","bytecode_cache_policy":"py_compile then delete all __pycache__ and .pyc; assert absent; run with -B"},
              "inputs":[{"path":p,"sha256":digest(root/p),"size_bytes":(root/p).stat().st_size,"mode":oct((root/p).stat().st_mode & 0o777),"file_type":"regular_file","evidence_state":"materialized_input","consumption":"not_observed"} for p in paths],
              "source_materialization":{"primary_root":"$RUNNER_TEMP/c10s-primary-source","replay_root":"$RUNNER_TEMP/c10s-clean-replay","primary_replay_file_tree_equal_asserted":True},
              "artifact":{"payload_id":os.environ.get("PAYLOAD_ARTIFACT_ID"),"payload_digest":os.environ.get("PAYLOAD_ARTIFACT_DIGEST")},
              "selected_wheels":[{"filename":"numpy-2.3.5-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl","platform_tags":["cp312-cp312-manylinux_2_27_x86_64","cp312-cp312-manylinux_2_28_x86_64"],"sha256":"0d8163f43acde9a73c2a33605353a4f1bc4798745a8b1d73183b28e5b435ae28"},{"filename":"scipy-1.17.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl","platform_tags":["cp312-cp312-manylinux_2_27_x86_64","cp312-cp312-manylinux_2_28_x86_64"],"sha256":"9eeb9b5f5997f75507814ed9d298ab23f62cf79f5a3ef90031b1ee2506abdb5b"}],"outputs":{}
          }
          for name in ["c10s-primary/p178_analyzer_monte_carlo.csv","c10s-primary/p178_analyzer_monte_carlo_manifest.json","c10s-replay/p178_analyzer_monte_carlo.csv","c10s-replay/p178_analyzer_monte_carlo_manifest.json","c10s-primary-stdout.txt","c10s-primary-stderr.txt","c10s-primary-tests-stdout.txt","c10s-primary-tests-stderr.txt","c10s-replay-stdout.txt","c10s-replay-stderr.txt","c10s-replay-tests-stdout.txt","c10s-replay-tests-stderr.txt"]:
              p=temp/name
              manifest["outputs"][name]=digest(p) if p.exists() else None
          (temp/"c10s-p178-execution-materialization-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload execution manifest
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: c10s-p178-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c10s-p178-execution-materialization-manifest.json
          if-no-files-found: warn
          retention-days: 30
