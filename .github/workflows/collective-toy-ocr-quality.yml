name: Collective Toy real OCR quality evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - development/collective-toy-ui-controls-001-20261013
      - development/collective-toy-ocr-preprocessing-001-20261013
      - development/collective-toy-ocr-topology-first-001-20261013
      - development/collective-toy-visual-graph-detector-001-20261013
    paths:
      - 'prototypes/collective_toy/web/ocr_quality_evaluation.html'
      - 'prototypes/collective_toy/web/index.html'
      - 'prototypes/collective_toy/web/ui_contract_test.cjs'
      - 'prototypes/collective_toy/web/ocr_quality_ci_test.cjs'
      - 'prototypes/collective_toy/web/ocr_graph_image_fixture_test.cjs'
      - 'prototypes/collective_toy/web/graph_structure_evaluator.cjs'
      - 'prototypes/collective_toy/web/graph_structure_evaluator_test.cjs'
      - 'prototypes/collective_toy/web/fixtures/ocr_graph_images/**'
      - '.github/workflows/collective-toy-ocr-quality.yml'

permissions:
  contents: read

jobs:
  real-ocr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        working-directory: prototypes/collective_toy/web
        run: npm install
      - name: Install Chromium
        working-directory: prototypes/collective_toy/web
        run: npx playwright install --with-deps chromium
      - name: Validate synthetic graph image fixtures and annotations
        working-directory: prototypes/collective_toy/web
        run: node ocr_graph_image_fixture_test.cjs
      - name: Test structural graph evaluator
        working-directory: prototypes/collective_toy/web
        run: node graph_structure_evaluator_test.cjs
      - name: Run Tesseract.js against reference images
        working-directory: prototypes/collective_toy/web
        run: node ocr_quality_ci_test.cjs
      - name: Run Collective Toy UI contract and OCR interpretation regressions
        working-directory: prototypes/collective_toy/web
        run: node ui_contract_test.cjs
      - name: Upload reproducible OCR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgcv-ocr-quality-result
          path: prototypes/collective_toy/web/ocr-quality-output/tgcv-ocr-quality-result.json
          if-no-files-found: warn
          retention-days: 30
