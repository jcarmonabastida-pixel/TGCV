name: TGCV one-shot GL-07 C05 completeness migration

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/zz_add_mt4_to_matrix_rows.yml' ]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate cumulative v1.16
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 9fdab42fce7da22fe1c095dfd876c2f438ff5dbc
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          root=Path('.')
          cur=root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md'
          v15=root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.15.md'
          exp=root/'00_GOVERNANCE/SIP/TGCV_C05_EV_GRID_MINIMUM_DEMONSTRATOR_MATERIAL_EXPEDIENT_001.md'
          text=cur.read_text(encoding='utf-8'); text15=v15.read_text(encoding='utf-8')
          assert text==text15, 'CURRENT != v1.15 before migration'
          assert text.startswith('# TGCV — Evidence-to-Claim Matrix — Current v1.15')
          marker='## Material empirical evidence — C05 EV–Grid Minimum Demonstrator v001'
          assert text.count(marker)==1
          pos=text.index(marker); tail=text[pos:]
          assert '## Material ' not in tail[len(marker):], 'C05 is not terminal; refusing destructive replacement'
          rows=[x for x in text.splitlines() if x.startswith('| C') and x.count('|')==7]
          assert len(rows)==16 and [x.split('|')[1].strip() for x in rows]==[f'C{i:02d}' for i in range(1,17)]
          old=subprocess.check_output(['git','show','9fdab42fce7da22fe1c095dfd876c2f438ff5dbc:00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.14.md'],text=True)
          for a in ['C10C-001 Structural Reconstruction','TSTC v004 Application-Fit Demonstrator','MT4 Domain Transfer','RUST-DYN-2 / EXEC-1A foundational Rust structural experiment']:
              assert a in old, 'v1.14 preservation anchor missing: '+a
          developed=exp.read_text(encoding='utf-8').strip()
          developed=developed.replace('# TGCV — C05 EV–Grid Minimum Demonstrator — Material Expediente 001','## Material empirical evidence — C05 EV–Grid Minimum Demonstrator v001',1)
          for h in ['## 1. Purpose, research role and frozen scope','## 2. Frozen transformation universe and operational contract','## 3. Provenance and execution integrity','## 4. Scenario coverage and quantitative findings','## 5. Interpretation of the result','## 6. Baseline reconstruction limitation','## 7. Negative controls and trajectory-policy limitation','## 8. Evidence-to-claim propagation','## 9. Scientific boundaries and explicit non-claims','## 10. Governance disposition and closure','## 11. GL-07 disposition']:
              assert h in developed, 'C05 GL-07 requirement missing: '+h
          assert 'baseline_equivalent=true' in developed and 'selection_tiebreak=reverse_lexical' in developed and 'does **not consume that field**' in developed
          assert '**Claim routing:** `C02`, `C07`, `C08`, `C16` only.' in developed
          body=text[:pos].rstrip()
          v16=body.replace('# TGCV — Evidence-to-Claim Matrix — Current v1.15','# TGCV — Evidence-to-Claim Matrix — Current v1.16',1)
          v16=v16.replace('**Predecessor:** v1.14','**Predecessor:** v1.15',1)
          v16=v16.replace('**Incremental governance update:** Adds the C05 EV–Grid Minimum Demonstrator material evidence record and bounded propagation to C02, C07, C08 and C16. No claim-level status/level is changed; C09 remains unchanged.','**Incremental governance update:** Enriches the C05 EV–Grid Minimum Demonstrator record into a complete GL-07 material expediente; supersedes the compressed v1.15 C05 section without changing claim status/level. C05 propagation remains limited to C02, C07, C08 and C16; C09 remains unchanged.',1)
          v16=v16+'\n\n'+developed+'\n'
          assert v16.count('| C01 |')==1 and v16.count('| C16 |')==1
          assert v16.count(marker)==1
          assert sum(1 for r in rows if 'C05 adds' in r)==4
          p=root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.16.md'; p.write_text(v16,encoding='utf-8'); cur.write_text(v16,encoding='utf-8')
          pointer=root/'00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md'
          pointer.write_text('# TGCV — Evidence-to-Claim Matrix — CURRENT POINTER\n\n**Status:** CURRENT CONTROL POINTER  \n**Current matrix:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md`  \n**Current version:** v1.16  \n**Versioned artifact:** `00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.16.md`  \n**Predecessor:** v1.15  \n**Established:** 2026-09-18\n\nv1.16 cumulatively preserves v1.15 and enriches C05 into a complete, enriched and autocontained GL-07 material expediente. C05 remains routed only to C02, C07, C08 and C16; no claim-level status/level changes; C09 remains unchanged.\n',encoding='utf-8')
          assert cur.read_bytes()==p.read_bytes()
          print('GL07_C05_ENRICHMENT=PASS')
          print('CLAIM_ROWS=16')
          print('C05_ROUTING=C02,C07,C08,C16')
          print('C09_UNCHANGED=true')
          print('V15_SHA256='+hashlib.sha256(text15.encode()).hexdigest())
          print('V16_SHA256='+hashlib.sha256(v16.encode()).hexdigest())
          PY
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.16.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT_POINTER.md
          git rm .github/workflows/zz_add_mt4_to_matrix_rows.yml
          git commit -m 'Governance: persist GL-07 complete C05 material expediente'
          git push origin main
