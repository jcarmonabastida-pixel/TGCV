name: TI-001 NEXT3 post-primary discrimination Q1-Q5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install pinned scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 statsmodels==0.14.6

      - name: Regenerate and verify frozen NEXT3 fixture
        run: |
          python 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_FIXTURE_GENERATOR_003.py /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json
          sha256sum /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json
          test "$(sha256sum /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json | cut -d' ' -f1)" = "0f16ebd02275ed32c481d34f92f704bb375dbe21e90d807483904ca73a9912d0"

      - name: Verify canonical execution result
        run: |
          test -f 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json
          test "$(sha256sum 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json | cut -d' ' -f1)" = "b908abe936bbfd19232a1436f8a308ac5dd23ca7df418c55715520c80ec9f5de"

      - name: Verify frozen implementation
        run: |
          test "$(git rev-parse HEAD)" != ""
          test "$(git rev-parse HEAD:03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py)" = "475f5c1c69ac6418168a5032d63fab0e792273f6"
          test "$(sha256sum 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py | cut -d' ' -f1)" != ""

      - name: Verify specification and gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002.json")
          gate=Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_006.json")
          s=json.loads(spec.read_text())
          g=json.loads(gate.read_text())
          assert s["artifact_id"]=="TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002"
          assert g["artifact_id"]=="TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_006"
          assert g["status"]=="AUTHORIZED_FOR_SCIENTIFIC_EXECUTION"
          assert g["decision"]=="ALLOW_AND_EXECUTE"
          assert g["governance"]["scientific_execution_authorized"] is True
          assert g["implementation_git_blob_sha"]=="475f5c1c69ac6418168a5032d63fab0e792273f6"
          print("GATE_VERIFY_PASS")
          PY

      - name: Static implementation preflight (no scientific fitting)
        run: |
          python -m py_compile 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py
          python - <<'PY'
          import importlib.util
          p="03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py"
          spec=importlib.util.spec_from_file_location("ti001_impl",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.REPLICATES == [1, 2, 3]
          assert all(isinstance(x, int) for x in m.REPLICATES)
          print("STATIC_IMPLEMENTATION_PREFLIGHT_PASS")
          PY

      - name: Run isolated post-primary Q1-Q5 analysis
        run: |
          python 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_EXECUTOR_001.py             --result 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json             --specification 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002.json             --implementation 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py             --gate 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_006.json             --matrix-audit 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_MATRIX_CONSTRUCTION_AUDIT_001.json             --fixture /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json             --output /tmp/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001.json

      - name: Publish analysis result
        uses: actions/upload-artifact@v4
        with:
          name: TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001
          path: /tmp/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001.json
          if-no-files-found: error
