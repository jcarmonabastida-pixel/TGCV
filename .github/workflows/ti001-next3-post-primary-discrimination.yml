name: TI-001 NEXT3 post-primary discrimination Q1-Q5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install pinned scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 statsmodels==0.14.6

      - name: Regenerate and verify frozen NEXT3 fixture
        run: |
          python 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_FIXTURE_GENERATOR_003.py /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json
          sha256sum /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json
          test "$(sha256sum /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json | cut -d' ' -f1)" = "0f16ebd02275ed32c481d34f92f704bb375dbe21e90d807483904ca73a9912d0"

      - name: Verify canonical execution result
        run: |
          test -f 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json
          test "$(sha256sum 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json | cut -d' ' -f1)" = "b908abe936bbfd19232a1436f8a308ac5dd23ca7df418c55715520c80ec9f5de"

      - name: Verify frozen implementation
        run: |
          test "$(git rev-parse HEAD)" != ""
          test "$(git rev-parse HEAD:03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py)" = "18db309ee4d25f9db2358a687812f90d24ed333f"
          IMPL_SHA256="$(sha256sum 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py | cut -d' ' -f1)"
          test -n "$IMPL_SHA256"
          echo "IMPLEMENTATION_SHA256=$IMPL_SHA256"
          echo "IMPLEMENTATION_GIT_BLOB_SHA=18db309ee4d25f9db2358a687812f90d24ed333f"

      - name: Verify specification, freeze and Gate 008
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002.json")
          freeze=Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_FREEZE_006.json")
          gate=Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_008.json")
          s=json.loads(spec.read_text())
          f=json.loads(freeze.read_text())
          g=json.loads(gate.read_text())
          assert s["artifact_id"]=="TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002"
          assert f["artifact_id"]=="TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_FREEZE_006"
          assert g["artifact_id"]=="TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_008"
          assert g["implementation_freeze"]==f["artifact_id"]
          assert g["implementation_commit"]=="f0550bbb09727a4eb238fcebf636e868b705677c"
          assert g["implementation_git_blob_sha"]=="18db309ee4d25f9db2358a687812f90d24ed333f"
          assert g["governance"]["scientific_execution_authorized"] is False
          assert g["decision"]=="BLOCK_UNTIL_PREFLIGHT_PASS"
          print("GATE_008_BINDING_VERIFY_PASS")
          PY

      - name: Static implementation preflight (no scientific fitting)
        run: |
          python -m py_compile 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py
          python - <<'PY'
          import importlib.util
          p="03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py"
          spec=importlib.util.spec_from_file_location("ti001_impl",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.REPLICATES == [1, 2, 3]
          assert all(isinstance(x, int) for x in m.REPLICATES)
          print("STATIC_IMPLEMENTATION_PREFLIGHT_PASS")
          PY

      - name: Non-scientific design-matrix rank preflight
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import numpy as np
          from pathlib import Path
          import pandas as pd

          impl_path = "03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py"
          spec = importlib.util.spec_from_file_location("ti001_impl", impl_path)
          impl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(impl)

          result = json.loads(Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json").read_text())
          fixture = json.loads(Path("/tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json").read_text())
          fixture_by_unit = {row["unit_id"]: row for row in fixture["rows"]}

          valid = [d for d in result["decisions"] if d["validity"] == "VALID"]
          rows = []
          for decision in valid:
              unit_id = decision["unit_id"]
              fixture_row = fixture_by_unit[unit_id]
              mapping = fixture_row["f"]
              parsed = decision["parsed_action"]
              condition = fixture_row["mapping_condition_metadata"]
              for action in impl.ACTIONS:
                  rows.append({
                      "unit_id": unit_id,
                      "action_identity": action,
                      "profile_id": mapping[action],
                      "chosen": int(parsed == action),
                      "condition": condition,
                      "domain": decision["domain"],
                      "operationalisation": decision["operationalisation"],
                      "presentation": decision["presentation"],
                      "replicate": decision["replicate"],
                  })

          df = pd.DataFrame(rows)
          assert len(df) == 90596
          assert df.groupby("unit_id").size().eq(4).all()
          assert df.groupby("unit_id")["chosen"].sum().eq(1).all()

          def rank(label, X):
              r = int(np.linalg.matrix_rank(X.to_numpy(dtype=float)))
              assert r == X.shape[1], f"{label}: rank deficient ({r}/{X.shape[1]})"
              print(f"{label}_FULL_RANK={r}/{X.shape[1]}")

          action, profile = impl.build_common(df)

          pc = impl.interaction(df["profile_id"], df["condition"], impl.PROFILES, impl.CONDITIONS, "profile", "condition")
          rank("Q1", pd.concat([action, profile, pc], axis=1))
          rank("Q3", pd.concat([action, profile, pc], axis=1))

          pp = impl.interaction(df["profile_id"], df["presentation"], impl.PROFILES, impl.PRESENTATIONS, "profile", "presentation")
          rank("Q2_REDUCED", pd.concat([action, profile], axis=1))
          rank("Q2", pd.concat([action, profile, pp], axis=1))

          for factor, levels, label in [
              ("domain", impl.DOMAINS, "Q4_DOMAIN"),
              ("operationalisation", impl.OPERATIONALISATIONS, "Q4_OPERATIONALISATION"),
              ("presentation", impl.PRESENTATIONS, "Q4_PRESENTATION"),
              ("replicate", impl.REPLICATES, "Q4_REPLICATE"),
          ]:
              inter = impl.interaction(df["profile_id"], df[factor], impl.PROFILES, levels, "profile", factor)
              rank(label, pd.concat([action, profile, inter], axis=1))

          ap = pd.DataFrame({
              f"action_{a}:profile_{p}":
                  ((df["action_identity"] == a).astype(float) * (df["profile_id"] == p).astype(float))
              for a in impl.ACTIONS[1:] for p in impl.PROFILES[1:]
          }, index=df.index)
          condition = impl.make_dummy(df["condition"], impl.CONDITIONS, "condition")
          apc = impl.three_way_action_profile_condition(df)
          rank("Q5", pd.concat([action, profile, ap, condition, apc], axis=1))
          print("NON_SCIENTIFIC_DESIGN_MATRIX_RANK_PREFLIGHT_PASS")
          PY

      - name: Evaluate scientific execution authorization
        id: gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_008.json").read_text())
          authorized = (
              g["status"] == "AUTHORIZED_FOR_SCIENTIFIC_EXECUTION"
              and g["decision"] == "ALLOW_AND_EXECUTE"
              and g["governance"]["scientific_execution_authorized"] is True
          )
          with open("${GITHUB_OUTPUT}", "a") as fh:
              fh.write(f"authorized={'true' if authorized else 'false'}\n")
          print("SCIENTIFIC_EXECUTION_AUTHORIZED" if authorized else "SCIENTIFIC_EXECUTION_BLOCKED_PENDING_EXPLICIT_AUTHORIZATION")
          PY

      - name: Run isolated post-primary Q1-Q5 analysis
        if: steps.gate.outputs.authorized == 'true'
        run: |
          python 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_EXECUTOR_001.py --result 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_EXPLORATORY_SCIENTIFIC_EXECUTION_RESULT_001.json --specification 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_SPECIFICATION_002.json --implementation 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_IMPLEMENTATION_001.py --gate 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_PRE_EXECUTION_GATE_008.json --matrix-audit 03_EXPERIMENTS/TI-001/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_MATRIX_CONSTRUCTION_AUDIT_001.json --fixture /tmp/TI001_V012_NEXT3_CANDIDATE_FIXTURE_003.json --output /tmp/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001.json

      - name: Publish analysis result
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001
          path: /tmp/TI001_V012_NEXT3_POST_PRIMARY_DISCRIMINATION_ANALYSIS_RESULT_001.json
          if-no-files-found: error
