name: Collective Toy browser and cross-runtime tests

on:
  push:
    branches:
      - main
      - prototype/collective-toy-cross-runtime-tests-001-20261011
      - prototype/tgcv-full-chain-001-20261014-scenario-context-recovery
    paths:
      - 'prototypes/collective_toy/**'
      - '.github/workflows/collective-toy-browser-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'prototypes/collective_toy/**'
      - '.github/workflows/collective-toy-browser-tests.yml'

permissions:
  contents: read

jobs:
  browser-cross-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test requirements
        run: python -m pip install --upgrade pip
      - name: Install browser test dependency
        working-directory: prototypes/collective_toy/web
        run: npm install
      - name: Install Chromium
        working-directory: prototypes/collective_toy/web
        run: npx playwright install --with-deps chromium
      - name: Run browser and Python concordance test
        working-directory: prototypes/collective_toy/web
        run: npm test
      - name: Build reproducible standalone distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Markdown==3.8.2'
          source_commit="$(git rev-parse HEAD)"
          dist_dir="$RUNNER_TEMP/tgcv-full-chain-$source_commit"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "DIST_DIR=$dist_dir" >> "$GITHUB_ENV"
          python prototypes/collective_toy/build_distribution_guide.py \
            --source-commit "$source_commit" \
            --output-dir "$dist_dir"
          python prototypes/collective_toy/test_distribution_package.py \
            --package-dir "$dist_dir" \
            --source-commit "$source_commit"
      - name: Upload standalone executable Full Chain distribution
        uses: actions/upload-artifact@v4
        with:
          name: tgcv-full-chain-executable-${{ env.SOURCE_COMMIT }}
          path: ${{ env.DIST_DIR }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validated Full Chain acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: tgcv-full-chain-acceptance-${{ github.sha }}
          path: prototypes/collective_toy/web/artifacts/tgcv-full-chain-acceptance-package.json
          if-no-files-found: error
          retention-days: 14
      - name: Replay browser and Python suite from clean source archive
        shell: bash
        run: |
          set -euo pipefail
          clean_root="$RUNNER_TEMP/collective-toy-browser-clean-room"
          mkdir -p "$clean_root"
          git archive "$(git rev-parse HEAD)" prototypes/collective_toy | tar -x -C "$clean_root"
          cd "$clean_root/prototypes/collective_toy/web"
          npm install
          npm test
