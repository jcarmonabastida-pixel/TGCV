name: TI-001 NEXT4 Monte Carlo runner deterministic cell audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run deterministic cell audit
        working-directory: 03_EXPERIMENTS/TI-001
        run: python TI001_V012_NEXT4_POWER_SIMULATION_RUNNER_DETERMINISTIC_CELL_AUDIT_001.py
      - name: Assert no scientific cell artifact
        run: |
          ! find 03_EXPERIMENTS/TI-001 -maxdepth 1 -name 'TI001_V012_NEXT4_POWER_SIMULATION_CELL_N*_E*.json' | grep -q .
