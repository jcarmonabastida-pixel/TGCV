name: D-OPS 003 R002 governed conformance execution

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dops-003r002:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen R002 package
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify runtime
        run: python3 --version

      - name: Download R002 freeze-preflight provenance
        uses: actions/download-artifact@v4
        with:
          name: D-OPS-003R002-provenance-manifest
          github-token: ${{ github.token }}
          repository: jcarmonabastida-pixel/TGCV
          run-id: 36885835005
          path: /tmp/r002-provenance

      - name: Verify frozen R002 SHA-256 boundary
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          manifest=Path("/tmp/r002-provenance/D-OPS_PACKAGE_003R002_PROVENANCE_MANIFEST_001.json")
          m=json.loads(manifest.read_text(encoding="utf-8"))
          if m["repository"]!="jcarmonabastida-pixel/TGCV" or m["ref"]!="main":
              raise SystemExit("R002_PROVENANCE_SCOPE_INVALID")
          if m["package"]!="00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002" or m["revision"]!="R002":
              raise SystemExit("R002_PROVENANCE_PACKAGE_INVALID")
          root=Path(".")
          actual={str(p) for p in Path(m["package"]).iterdir() if p.is_file()}
          expected={e["path"] for e in m["files"]}
          if actual!=expected:
              raise SystemExit(f"R002_PACKAGE_BOUNDARY_MISMATCH: {sorted(actual ^ expected)}")
          for e in m["files"]:
              p=root/Path(e["path"])
              if not p.is_file():
                  raise SystemExit(f"MISSING_FROZEN_INPUT: {e['path']}")
              data=p.read_bytes()
              if len(data)!=e["bytes"]:
                  raise SystemExit(f"BYTE_COUNT_MISMATCH: {e['path']}")
              got=hashlib.sha256(data).hexdigest()
              if got!=e["sha256"]:
                  raise SystemExit(f"SHA256_MISMATCH: {e['path']}: {got} != {e['sha256']}")
          print(f"FROZEN_R002_SHA256_AND_BOUNDARY_PASS: {len(m['files'])} files")

      - name: Verify R002 execution authorization
        shell: python
        run: |
          from pathlib import Path
          p=Path("00_GOVERNANCE/D-OPS_PACKAGE_003R002_EXECUTION_AUTHORIZATION_001.md")
          if not p.is_file(): raise SystemExit("EXECUTION_AUTHORIZATION_RECORD_MISSING")
          t=p.read_text(encoding="utf-8")
          if "Status: EXECUTION AUTHORIZED" not in t: raise SystemExit("EXECUTION_AUTHORIZATION_STATUS_MISSING")
          if "execution_authorized: true" not in t: raise SystemExit("EXECUTION_AUTHORIZATION_FLAG_MISSING")
          if "Package: D-OPS_FREEZE_PACKAGE_003R002" not in t: raise SystemExit("EXECUTION_AUTHORIZATION_SCOPE_INVALID")
          print("R002_EXECUTION_AUTHORIZATION_PASS")

      - name: Verify frozen R002 contract
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          expected=json.loads((root/"expected_results.json").read_text(encoding="utf-8"))
          perturb=json.loads((root/"perturbation_manifest.json").read_text(encoding="utf-8"))
          schema=json.loads((root/"result_schema.json").read_text(encoding="utf-8"))
          keys={"persistence","expansion","contraction","reconfiguration","mixed_identity_change"}
          if set(expected)!=keys: raise SystemExit("R002_EXPECTED_RESULT_KEYS_INVALID")
          if set(perturb)!=keys: raise SystemExit("R002_PERTURBATION_KEYS_INVALID")
          if set(schema["required"])!={"test_id","expected_classification"}: raise SystemExit("R002_RESULT_SCHEMA_INVALID")
          print("R002_CONTRACT_PASS")

      - name: Execute five frozen R002 conformance cases
        shell: python
        run: |
          import json, hashlib, sys
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          fixture=json.loads((root/"D0_FORMAL_FIXTURE.json").read_text(encoding="utf-8"))
          r3=json.loads((root/"R3_manifest_D0.json").read_text(encoding="utf-8"))
          expected=json.loads((root/"expected_results.json").read_text(encoding="utf-8"))
          sys.path.insert(0,str(root))
          import dops_canonical, dops_oracle, dops_perturbations
          base=dops_oracle.oracle_canonicalize(fixture,r3)
          cases={
            "persistence":(fixture,r3),
            "expansion":(dops_perturbations.expansion(fixture),r3),
            "contraction":(dops_perturbations.contraction(fixture),r3),
            "reconfiguration":(fixture,dops_perturbations.reconfiguration_r3(r3)),
            "mixed_identity_change":(dops_perturbations.mixed_identity(fixture),r3)}
          rows=[]
          for test_id,(new_fixture,new_r3) in cases.items():
              observed=dops_oracle.classify(base,dops_oracle.oracle_canonicalize(new_fixture,new_r3))
              if observed!=expected[test_id]:
                  raise SystemExit(f"CLASSIFICATION_MISMATCH: {test_id}: {observed} != {expected[test_id]}")
              rows.append({"test_id":test_id,"expected_classification":expected[test_id],"observed_classification":observed,"pass":True})
          result={"status":"D-OPS-003-R002_CONFORMANCE_EXECUTION_COMPLETE","package":"D-OPS_FREEZE_PACKAGE_003R002","cases":rows}
          out=Path("d-ops-003r002-execution-result.json")
          out.write_text(json.dumps(result,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,sort_keys=True))
          print("RESULT_SHA256",hashlib.sha256(out.read_bytes()).hexdigest())

      - name: Upload R002 execution result
        uses: actions/upload-artifact@v4
        with:
          name: d-ops-003r002-conformance-execution-result
          path: d-ops-003r002-execution-result.json
          if-no-files-found: error
