name: G7 F5 Tier-A readjudication from preserved run

on:
  push:
    branches:
      - fix/g7-final-adjudication-resource-manifest-schema-20261126
    paths:
      - '.github/workflows/g7-f5-tier-a-readjudication-20261126.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: g7-readjudication-45750949936
  cancel-in-progress: false

jobs:
  readjudicate-preserved-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '45750949936'
      SOURCE_RUN_HEAD_SHA: '091de2c0420b88653e643dd8d8272bdc0d73bbe4'
      SOURCE_CODE_COMMIT: '937ded9d0e431ad819a19a3e0209a922d61c2713'
      AUTHORIZATION_ID: 'C10S-F5-G7-20261126-006'
    steps:
      - name: Checkout corrected adjudicator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4dea11cceef81b6a56c42c1075e00edadadb0cfc
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Verify the exact original run identity
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$SOURCE_RUN_HEAD_SHA"
          test "$(jq -r '.event' <<<"$RUN_JSON")" = "workflow_dispatch"
          test "$(jq -r '.run_attempt' <<<"$RUN_JSON")" = "1"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "failure"
          echo "Original run identity verified: $SOURCE_RUN_ID"

      - name: Download original primary and replay artifacts
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "c10s-f5-g7-primary-$AUTHORIZATION_ID-*" \
            --dir "$RUNNER_TEMP/primary-download"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "c10s-f5-g7-replay-$AUTHORIZATION_ID-*" \
            --dir "$RUNNER_TEMP/replay-download"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "c10s-f5-g7-resource-plan-$AUTHORIZATION_ID" \
            --dir "$RUNNER_TEMP/resource-plan-download"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "c10s-f5-g7-authorization-$AUTHORIZATION_ID" \
            --dir "$RUNNER_TEMP/authorization-download"

      - name: Flatten and verify preserved shard inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g7-shards/primary" "$RUNNER_TEMP/g7-shards/replay"
          flatten_json() {
            local source="$1"
            local target="$2"
            local count=0
            while IFS= read -r -d '' file; do
              local base
              base="$(basename "$file")"
              test ! -e "$target/$base"
              cp "$file" "$target/$base"
              count=$((count + 1))
            done < <(find "$source" -type f -name '*.json' -print0)
            echo "$count"
          }
          PRIMARY_COUNT="$(flatten_json "$RUNNER_TEMP/primary-download" "$RUNNER_TEMP/g7-shards/primary")"
          REPLAY_COUNT="$(flatten_json "$RUNNER_TEMP/replay-download" "$RUNNER_TEMP/g7-shards/replay")"
          test "$PRIMARY_COUNT" -eq 250
          test "$REPLAY_COUNT" -eq 250
          echo "Preserved shard inventory verified: primary=$PRIMARY_COUNT replay=$REPLAY_COUNT"

      - name: Verify resource plan manifest and profile digest
        id: resource
        run: |
          set -euo pipefail
          PLAN_SOURCE="$RUNNER_TEMP/resource-plan-download"
          PLAN_DIR="$RUNNER_TEMP/g7-resource-plan"
          mkdir -p "$PLAN_DIR"
          for name in resource-profile.json resource-profile-manifest.json g7-resource-profile-validation.json; do
            test "$(find "$PLAN_SOURCE" -type f -name "$name" | wc -l)" -eq 1
            cp "$(find "$PLAN_SOURCE" -type f -name "$name" -print -quit)" "$PLAN_DIR/$name"
          done
          PROFILE_SHA="$(python - "$PLAN_DIR/resource-profile.json" "$PLAN_DIR/resource-profile-manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          profile = pathlib.Path(sys.argv[1]).read_bytes()
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text())
          actual = hashlib.sha256(profile).hexdigest()
          assert manifest.get("schema") == "C10S-F5-G7-RESOURCE-PROFILE-MANIFEST-003"
          assert manifest.get("profile_json_sha256") == actual
          assert manifest.get("profile_run_id") == 45365559253
          assert manifest.get("profile_artifact_id") == 14908914198
          assert manifest.get("profile_source_commit") == "8b62b89a78681cc39bdd4c0cbb76c43ef073c1e9"
          print(actual)
          PY
          )"
          echo "profile_sha256=$PROFILE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resource profile and MANIFEST-003 verified: $PROFILE_SHA"

      - name: Re-adjudicate preserved primary and replay shards
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          GITHUB_SHA: '937ded9d0e431ad819a19a3e0209a922d61c2713'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/g7-readjudication"
          mkdir -p "$OUT"
          python aggregate_c10s_f5_g7_tiera_shards.py \
            --primary-dir "$RUNNER_TEMP/g7-shards/primary" \
            --replay-dir "$RUNNER_TEMP/g7-shards/replay" \
            --preflight "$RUNNER_TEMP/g7-resource-plan/resource-profile.json" \
            --preflight-manifest "$RUNNER_TEMP/g7-resource-plan/resource-profile-manifest.json" \
            --expected-preflight-sha256 '${{ steps.resource.outputs.profile_sha256 }}' \
            --output-dir "$OUT" \
            --source-commit "$SOURCE_CODE_COMMIT" \
            --authorization-id "$AUTHORIZATION_ID"
          cp "$RUNNER_TEMP/g7-resource-plan/"*.json "$OUT/"
          mkdir -p "$OUT/original-authorization-evidence"
          cp "$RUNNER_TEMP/authorization-download/"*.json "$OUT/original-authorization-evidence/" 2>/dev/null || true
          python - "$OUT/readjudication_provenance.json" <<'PY'
          import json, pathlib, sys
          value = {
            "schema": "TGCV-C10S-F5-G7-READJUDICATION-PROVENANCE-001",
            "source_run_id": 45750949936,
            "source_run_head_sha": "091de2c0420b88653e643dd8d8272bdc0d73bbe4",
            "source_code_commit": "937ded9d0e431ad819a19a3e0209a922d61c2713",
            "corrected_aggregator_commit": "4dea11cceef81b6a56c42c1075e00edadadb0cfc",
            "authorization_id": "C10S-F5-G7-20261126-006",
            "new_authorization_consumed": False,
            "primary_or_replay_reexecuted": False,
            "operation": "POSTHOC_REUSE_OF_PRESERVED_PRIMARY_AND_REPLAY_ARTIFACTS"
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload readjudication result and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: g7-readjudication-45750949936-${{ github.sha }}
          path: ${{ runner.temp }}/g7-readjudication/
          if-no-files-found: warn
          retention-days: 90
