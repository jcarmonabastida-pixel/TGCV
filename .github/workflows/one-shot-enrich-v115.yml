name: One-shot v1.15 C05 material enrichment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrich matrix and persist GL-07
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          matrix = Path('00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md')
          versioned = Path('00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.15.md')
          text = matrix.read_text(encoding='utf-8')
          marker = '## Material empirical evidence — C05 EV–Grid Minimum Demonstrator v001'
          if marker not in text:
              section = r'''\n\n## Material empirical evidence — C05 EV–Grid Minimum Demonstrator v001\n\n**Case:** `C05_EV_GRID_SYNTHETIC_MINIMUM_DEMONSTRATOR_V001`  \n**Status:** `EXECUTION COMPLETE — PASS WITH METHODOLOGICAL LIMITATIONS`  \n**Evidence class:** bounded synthetic application-fit / methodological evidence; not empirical causal evidence.  \n**Runner:** `03_EXPERIMENTS/TGCV_APPLICATION_FIT_WP2_C05_EV_GRID_MINIMUM_DEMONSTRATOR_V001.py`  \n**Runner commit:** `e8e55f50f82b9bdf69eeca4d48deb9d23799672e`  \n**SPEC_COMMIT:** `5aa2c7e20ea3f5775b2d6e60797f9be9efe10e05`  \n**FIXTURE_COMMIT:** `9dd6e9b6bb8d0b7a7e686c4dc61926fc627fa8b6`  \n**Execution:** `C05_EXECUTION_COMPLETE`  \n**Python:** `3.8.10`  \n**Platform:** `Windows-10-10.0.26200-SP0`  \n**Output SHA-256:** `27025e638c05458e19a125c00d9d86d89906bc418eec5670eddec14c89e96880`  \n**Preflight:** `00_GOVERNANCE/SIP/TGCV_APPLICATION_FIT_WP2_C05_EV_GRID_RUNNER_PREFLIGHT_001.md`  \n**Post-execution audit:** `00_GOVERNANCE/SIP/TGCV_APPLICATION_FIT_WP2_C05_EV_GRID_POST_EXECUTION_AUDIT_001.md`  \n\n### 1. Purpose, research role and frozen scope\nC05 is the executed **EV–Grid Minimum Demonstrator** for TGCV application-fit. Its purpose is to instantiate the TGCV translation chain in a compact synthetic domain while preserving the distinction among system/context state, candidate transformations, admissibility, accessible transformation space (`T_acc`), transition, post-transition state/context and bounded subsequent trajectory. Its evidentiary role is methodological and application-fit oriented. It is not a real-world EV-grid study, causal identification experiment, value/ROI test, superiority comparison, generality test, deployment-readiness assessment, or claim-level validation.\n\nThe experiment is therefore interpreted as an executable demonstration of a bounded representation: conditions/context → admissibility → accessible candidate transformations → transition → post-transition accessibility and bounded trajectory fields. The synthetic character of the domain and rules is part of the evidence boundary.\n\n### 2. Frozen transformation universe and operational contract\nThe frozen candidate transformation universe `U_tau` contains exactly: `accept_A`, `accept_B`, `defer`, `reduce_power`, `shift_window`, `redirect_A_to_B`, `redirect_B_to_A`, `reserve_capacity`, `release_capacity`, `v1g_discharge`, `v2g_discharge`, and `reject`.\n\nFor each frozen scenario, candidate transformations are evaluated through an explicit admissibility rule and `T_acc` is the admissible subset of `U_tau`. The execution contract records the relevant initial state/context, candidate transformation universe, admissibility/accessibility results, transition identifier, post-transition state/context, `T_acc_1`, `Delta T_acc`, bounded trajectory fields, baseline fields, controls and explicit non-claims. This preserves the analytical separation between candidate transformations and transformations accessible under the current conditions.\n\n### 3. Provenance and execution integrity\nThe frozen runner executed to `C05_EXECUTION_COMPLETE` under Python `3.8.10` on `Windows-10-10.0.26200-SP0`. Runner, specification and fixture provenance are pinned by the commits above. The execution output is identified by SHA-256 `27025e638c05458e19a125c00d9d86d89906bc418eec5670eddec14c89e96880`. The preflight and post-execution audit establish execution-integrity PASS, runtime-contract PASS, transition-coverage PASS, negative-control PASS and observed-accessibility-delta PASS, while retaining the independent-baseline and trajectory-policy limitations below.\n\n### 4. Scenario coverage and quantitative result\nThe frozen execution contains scenarios `T1`–`T6` and negative controls `NC1` and `NC2`. The material positive result is concentrated in **T3**. Under T3, `|T_acc,0| = 8` and `|T_acc,1| = 6`, giving `Delta |T_acc| = -2`; the transformations that close are **`accept_B`** and **`redirect_A_to_B`**.\n\nUnder **T1, T2, T4, T5 and T6**, the frozen execution reports no accessibility delta. The same absence of an accessibility delta is reported for **NC1 and NC2**. Thus the demonstrator does not classify every state/context change as a transformation-space change; the observed delta is conditional on the frozen admissibility structure.\n\nThe narrow result is: within this synthetic rule system, an explicitly represented change in the conditions governing admissibility can produce a corresponding change in the accessible transformation space, while the specified control transitions leave that space unchanged.\n\n### 5. Interpretation and evidentiary boundary\nThe T3 result concerns the identity and cardinality of the **accessible candidate-transformation space**, not downstream operational outcomes. Closing `accept_B` and `redirect_A_to_B` is evidence of a bounded synthetic `T_acc` change. It is not evidence that an EV-grid intervention caused a real-world reliability, mobility, economic, energy or value outcome.\n\nThe demonstrator preserves the distinction among `U_tau`, admissibility, `T_acc`, transition, post-transition state/context and bounded trajectory fields. This is the principal methodological application-fit contribution.\n\n### 6. Baseline limitation — not independent validation\nThe frozen implementation defines `baseline(s,c,l)` by returning `admissible(s,c,l)`. Therefore `baseline_equivalent=true` is an implementation identity, not an independently constructed baseline model. It cannot support independent validation, comparative superiority, explanatory advantage or predictive advantage. This limitation is material and remains part of the C05 evidence record.\n\n### 7. Negative controls and NC2 trajectory-policy limitation\n`NC1` and `NC2` show no accessibility delta in the frozen execution. `NC2` specifies `selection_tiebreak=reverse_lexical`, but the frozen `trajectory()` implementation does **not consume that field**. Consequently NC2 is not a valid trajectory-policy sensitivity test. It is only a negative-control execution under the frozen implementation. C05 therefore does not establish trajectory-policy robustness, a causal trajectory estimand, or sensitivity of trajectory conclusions to selection policy.\n\n### 8. Evidence-to-claim routing\n**C02:** bounded synthetic application-fit evidence that candidate transformations, admissibility/accessibility and `T_acc` can be represented and executed, including T3 `8→6`; no independent baseline or general empirical accessibility is established.\n\n**C07:** bounded synthetic evidence that `T_acc` can change between frozen states/contexts, with `accept_B` and `redirect_A_to_B` closing under T3; no real-world temporal `T_acc` claim is established.\n\n**C08:** bounded representation of transition and subsequent trajectory fields; because the domain is synthetic and NC2 is not a genuine sensitivity test, no causal `Delta T_acc -> trajectory` estimand is established.\n\n**C16:** bounded methodological/application-fit evidence preserving the executable distinctions among candidate transformations, admissibility, `T_acc`, transition, bounded trajectory, controls and explicit non-claims. No transversal validity is established.\n\nNo propagation is made to C01, C03, C04, C05, C06, C09, C10, C11, C12, C13, C14 or C15. No claim-level status or level is changed.\n\n### 9. Scientific non-claims and closure\nC05 does **not** establish empirical causality, generality, transversal validity, value creation, ROI, downstream operational performance, explanatory superiority, predictive superiority, real-world EV-grid validity, industrial validation, deployment readiness, or a causal `Delta T_acc -> Delta V` pathway. It does not independently validate the baseline and does not establish trajectory-policy robustness.\n\nC05 is closed as **bounded synthetic methodological/application-fit evidence**. Its material result is retained because it qualifies the evidentiary basis of C02, C07, C08 and C16 without warranting a claim-level upgrade.\n\n**Claim routing:** `C02`, `C07`, `C08`, `C16` only.\n'''
              text = text.rstrip() + section
              matrix.write_text(text, encoding='utf-8')
          versioned.write_text(matrix.read_text(encoding='utf-8'), encoding='utf-8')
          gl = Path('00_GOVERNANCE/SIP/TGCV_GL07_MATERIAL_EVIDENCE_COMPLETENESS_RULE_001.md')
          gl.write_text(r'''# TGCV — GL-07 Material Evidence Completeness Rule\n\n**Status:** GOVERNANCE RULE — PERSISTENT\n**Effective:** 2026-09-18\n**Scope:** Evidence-to-Claim Matrix and all future cumulative matrix versions\n\n## Rule\nA material evidence section in the Evidence-to-Claim Matrix is an **expediente material desarrollado**, not a summary or citation stub. Whenever a material evidence item is routed to a claim, its corresponding `Material ... evidence` section MUST be **complete, enriched and autocontained** within the same matrix version.\n\n### Mandatory content\nA complete material section MUST contain, to the extent applicable to the evidence type:\n1. identity, status and evidence classification;\n2. purpose, research role and frozen scope;\n3. source/provenance, protocol, runner, fixture, commits, environment and output identifiers;\n4. operational universe/variables/constructs and execution or inspection contract;\n5. methods and coverage actually executed;\n6. quantitative or otherwise material findings, including controls and negative controls;\n7. interpretation of what the evidence establishes;\n8. explicit distinction between observation, reconstruction, inference and non-claim;\n9. methodological limitations, identification boundaries and reproducibility boundaries;\n10. evidence-to-claim routing, including positive, qualifying and explicitly excluded propagation;\n11. governance disposition and claim-level consequences.\n\n### Autocontainment test\nA reader MUST be able to understand the material result, its provenance, operational scope, findings, limitations and claim impact from the section itself, without reconstructing the evidentiary record from scattered table cells, short references or external chat context. External artifacts MAY be cited for auditability, but citations MUST supplement the developed section rather than substitute for it.\n\n### Anti-compression rule\nA version MUST NOT satisfy GL-07 by reducing a developed material record to a few summary paragraphs, a status line, a list of artifact names, or a compressed claim-table cell. If the predecessor contains a developed material expediente, the cumulative successor MUST preserve it. If a predecessor contains only a compressed representation of material evidence, the successor MUST restore the developed record when that evidence is carried forward or materially relied upon.\n\n### Versioning and GL-07\nGL-07 is distinct from the incremental-version header rule: the version header records only what the current version changes; GL-07 governs the required completeness of the underlying cumulative material-evidence record. Adding or enriching a material section is therefore a versioned governance change even when claim status/level remains unchanged.\n\n### Integrity relation\nThe matrix must satisfy the bidirectional relation:\n`material evidence item routed in claim table ↔ complete, enriched, autocontained material expediente`.\n\nA GL-07 failure is a **governance-integrity defect**, not a reason to silently delete, compress or downgrade the underlying evidence. The corrective action is to restore/enrich the material expediente and re-run the cumulative preservation and bidirectional-integrity checks.\n''', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.15.md 00_GOVERNANCE/SIP/TGCV_GL07_MATERIAL_EVIDENCE_COMPLETENESS_RULE_001.md
          git rm .github/workflows/one-shot-enrich-v115.yml
          git commit -m 'Governance: enrich C05 material expediente and persist GL-07'
          git push origin HEAD:main
