name: Rust Omega U synthetic tests

on:
  workflow_dispatch:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated synthetic suite
        working-directory: 07_CODE/tests
        run: |
          set -euo pipefail
          python -m pytest -q test_omega_u_constructor_v01.py
