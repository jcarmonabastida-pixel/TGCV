name: C10-S M1 manual positive N32

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-or-run:
    runs-on: ubuntu-latest
    steps:
      - name: Register on main without running the experiment
        if: github.event_name == 'push'
        run: echo "Workflow registered. No experiment executed on push."
      - name: Checkout selected research branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@83679a892e2d95755f2dacacb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install pinned dependencies
        if: github.event_name == 'workflow_dispatch'
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Run one positive N=32 pipeline
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c10s-m1-positive-n32"
          timeout --signal=TERM --kill-after=20s 15m python -B - <<'PY'
          import dataclasses, json, os, platform, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("03_EXPERIMENTS/C10-S/harness").resolve()))
          from theta_a_calibration_dgp import ThetaACalibrationDGPFactory
          factory = ThetaACalibrationDGPFactory()
          fixture = factory.build_fixture(theta_a_mode="positive", n_units=32)
          result = factory.run_pipeline(fixture, theta_a_confidence_level=None, theta_a_unit_independence_certified=False, point_s3=False)
          if result is None or result.analyzer_result is None or result.evaluator_result is None:
              raise RuntimeError("Missing Analyzer or independent Evaluator result")
          report = {
              "classification":"SINGLE_EXPLORATORY_SYNTHETIC_CAUSAL_RECOVERY_CHECK",
              "status":"EXPLORATORY_NOT_CONFIRMATORY",
              "source_commit":os.environ.get("GITHUB_SHA"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "selected_ref":os.environ.get("GITHUB_REF"),
              "python":platform.python_version(),
              "design":{"scenario":"positive","n_units":32,"expected_dgp_effect":0.5,"observation":"complete_interval_best_case","pipeline_invocations":1,"replay":False,"additional_scenarios":False,"confidence_interval":None,"unit_independence_certified":False},
              "analyzer":dataclasses.asdict(result.analyzer_result),
              "independent_evaluator":dataclasses.asdict(result.evaluator_result)
          }
          output=Path(os.environ["RUNNER_TEMP"])/"c10s-m1-positive-n32"/"result.json"
          output.write_text(json.dumps(report,indent=2,sort_keys=True,default=str,allow_nan=False)+"\\n",encoding="utf-8")
          print(json.dumps({"analyzer":report["analyzer"],"independent_evaluator":report["independent_evaluator"]},sort_keys=True,default=str),flush=True)
          print("PIPELINE_INVOCATIONS=1 REPLAY=0 ADDITIONAL_SCENARIOS=0",flush=True)
          PY
      - name: Upload exploratory result
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-m1-positive-n32-${{ github.run_id }}
          path: ${{ runner.temp }}/c10s-m1-positive-n32/**
          if-no-files-found: warn
          retention-days: 14
