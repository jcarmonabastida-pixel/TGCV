name: C10-S comparative holdout — resource-only preflight

on:
  push:
    branches:
      - 'research/c10s-nested-mr-resource-preflight-auth-*'
    paths:
      - '00_GOVERNANCE/authorizations/C10S_NESTED_MR_COMPARATIVE_RESOURCE_PREFLIGHT_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  resource-preflight:
    # Defense in depth: a resource authorization must never activate the holdout job.
    if: startsWith(github.ref, 'refs/heads/research/c10s-nested-mr-resource-preflight-auth-') && contains(github.event.head_commit.message, 'Approve one-use C10-S comparative resource-only preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout one-use authorization commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Validate resource-only authorization and exact parent
        id: authorization
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
        run: |
          python 03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_resource_preflight_authorization.py \
            --authorization 00_GOVERNANCE/authorizations/C10S_NESTED_MR_COMPARATIVE_RESOURCE_PREFLIGHT_AUTHORIZATION.json \
            --root . \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --branch "$WORKFLOW_BRANCH" \
            --output-json "$RUNNER_TEMP/validated-authorization.json"
          cp 00_GOVERNANCE/authorizations/C10S_NESTED_MR_COMPARATIVE_RESOURCE_PREFLIGHT_AUTHORIZATION.json "$RUNNER_TEMP/original-authorization.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "validated-authorization.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          for key in ("authorization_id", "approved_code_commit"):
              print(f"{key}={d[key]}")
          PY

      - name: Checkout exact approved code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.authorization.outputs.approved_code_commit }}
          path: source
          persist-credentials: false

      - name: Install hash-locked dependencies
        working-directory: source/03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'

      - name: Execute resource-only sample (no coverage adjudication)
        working-directory: source
        run: |
          mkdir -p "$RUNNER_TEMP/c10s-resource-preflight"
          python 03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_comparative_resource_preflight.py \
            --output-dir "$RUNNER_TEMP/c10s-resource-preflight"

      - name: Upload resource-only measurements and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-comparative-resource-preflight-${{ steps.authorization.outputs.authorization_id }}-${{ steps.authorization.outputs.approved_code_commit }}
          path: ${{ runner.temp }}/c10s-resource-preflight/
          if-no-files-found: warn
          retention-days: 90
