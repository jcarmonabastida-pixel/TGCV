name: TGCV VIATRA V002 Observer Listener Runtime P3 P4 Preflight V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-listener-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected development ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set Maven 3.6.3 for Tycho 1.0.0 compatibility probe
        run: |
          MAVEN_VERSION="3.6.3"
          MAVEN_HOME="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION"
          if [ ! -x "$MAVEN_HOME/bin/mvn" ]; then
            curl -fsSL "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$RUNNER_TEMP/apache-maven.tar.gz"
            tar -xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          fi
          echo "$MAVEN_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$MAVEN_HOME/bin:$PATH"
          mvn -version

      - name: Materialize pinned historical CPS model bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash materialize-historical-cps-models.sh

      - name: Stage materialized CPS sources into standalone P2 bridge reactor
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          for bundle in \
            org.eclipse.viatra.examples.cps.model \
            org.eclipse.viatra.examples.cps.deployment \
            org.eclipse.viatra.examples.cps.traceability \
            org.eclipse.viatra.examples.cps.xform.m2m.util; do
            src="cps-models/$bundle"
            dst="cps-p2-bridge/bundles/$bundle"
            test -d "$src/META-INF"
            test -d "$src/src"
            mkdir -p "$dst"
            rm -rf "$dst/META-INF" "$dst/src" "$dst/model" "$dst/plugin.xml" "$dst/plugin.properties" "$dst/build.properties"
            cp -R "$src/META-INF" "$dst/META-INF"
            cp -R "$src/src" "$dst/src"
            test -f "$src/build.properties"
            cp "$src/build.properties" "$dst/build.properties"
            if [ -d "$src/model" ]; then cp -R "$src/model" "$dst/model"; fi
            if [ -f "$src/plugin.xml" ]; then cp "$src/plugin.xml" "$dst/plugin.xml"; fi
            if [ -f "$src/plugin.properties" ]; then cp "$src/plugin.properties" "$dst/plugin.properties"; fi
          done

      - name: Build P2 bridge from materialized historical CPS bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -f cps-p2-bridge/pom.xml package

      - name: Verify P2 bridge contents
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          test -f cps-p2-bridge/repository/target/repository/content.jar
          test -f cps-p2-bridge/repository/target/repository/artifacts.jar
          for bundle in \
            org.eclipse.viatra.examples.cps.model \
            org.eclipse.viatra.examples.cps.deployment \
            org.eclipse.viatra.examples.cps.traceability \
            org.eclipse.viatra.examples.cps.xform.m2m.util; do
            find cps-p2-bridge/repository/target/repository -type f -name "${bundle}_*.jar" -print -quit | grep -q .
          done
          util_jar="$(find cps-p2-bridge/repository/target/repository -type f -name 'org.eclipse.viatra.examples.cps.xform.m2m.util_*.jar' -print -quit)"
          test -n "$util_jar"
          echo "Historical util JAR: $util_jar"
          unzip -l "$util_jar" | grep -F 'org/eclipse/viatra/examples/cps/xform/m2m/util/SignalUtil.class'
          echo "TGCV_VIATRA_V002_CPS_P2_BRIDGE=PASS"

      - name: Inject built CPS P2 bridge into runtime target platform
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path("target-definition/tgcv-viatra-v002-target.target")
          repo = (Path.cwd() / "cps-p2-bridge/repository/target/repository").resolve()

          text = target.read_text(encoding="utf-8")
          location = (
              '        <location includeAllPlatforms="false" '
              'includeConfigurePhase="false" includeMode="planner" '
              'includeSource="false" type="InstallableUnit">\n'
              '          <unit id="org.eclipse.viatra.examples.cps.model" version="0.0.0"/>\n'
              '          <unit id="org.eclipse.viatra.examples.cps.deployment" version="0.0.0"/>\n'
              '          <unit id="org.eclipse.viatra.examples.cps.traceability" version="0.0.0"/>\n'
              '          <unit id="org.eclipse.viatra.examples.cps.xform.m2m.util" version="0.0.0"/>\n'
              f'          <repository location="file://{repo}"/>\n'
              '        </location>\n'
          )

          if "cps-p2-bridge/repository/target/repository" in text:
              raise SystemExit("FAIL: CPS P2 bridge repository is already present")

          marker = "    </locations>"
          if text.count(marker) != 1:
              raise SystemExit("FAIL: expected exactly one target-definition locations marker")

          text = text.replace(marker, location + marker, 1)
          target.write_text(text, encoding="utf-8")

          if "cps-p2-bridge/repository/target/repository" not in target.read_text(encoding="utf-8"):
              raise SystemExit("FAIL: CPS P2 bridge repository injection was not persisted")

          print(f"Injected runtime P2 repository: {repo}")
          PY

      - name: Build and execute gated Observer Listener runtime tests
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -X -Dtycho.debug.resolver=true -pl target-definition,observer-runtime-test -am clean verify

      - name: Diagnose runtime provisioning
        if: ${{ always() }}
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          echo "== Runtime work directory =="
          if [ -d observer-runtime-test/target/work ]; then
            find observer-runtime-test/target/work -type f -printf '%p\n' | sort
          else
            echo "target/work not present"
          fi
          echo "== Historical util bundle / SignalUtil =="
          find observer-runtime-test/target/work -type f \( -iname '*org.eclipse.viatra.examples.cps.xform.m2m.util*' -o -iname '*SignalUtil*' \) -printf '%p\n' 2>/dev/null | sort || true
          echo "== Installed OSGi bundles =="
          find observer-runtime-test/target/work -type f \( -name 'MANIFEST.MF' -o -name '*.jar' \) -printf '%p\n' 2>/dev/null | grep -E 'org\.eclipse\.viatra|org\.tgcv|org\.eclipse\.emf' | sort || true
          echo "== Equinox simpleconfigurator provisioning list =="
          bundles_info="observer-runtime-test/target/work/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"
          if [ -f "$bundles_info" ]; then
            grep -E 'org\.eclipse\.viatra\.examples\.cps\.(model|deployment|traceability|xform\.m2m\.util)' "$bundles_info" || true
          else
            echo "bundles.info not present"
          fi
          echo "== Resolved historical P2 artifacts in local Maven cache =="
          find "$HOME/.m2/repository/p2/osgi/bundle/org.eclipse.viatra.examples.cps."* -maxdepth 2 -type f -name '*.jar' -print 2>/dev/null | sort || true

      - name: Diagnose XtypeGrammarAccess resource resolution
        if: ${{ always() }}
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          set -e
          work="observer-runtime-test/target/work"
          echo "== Locate XtypeGrammarAccess provider in runtime work =="
          xtype_jar=""
          if [ -d "$work" ]; then
            while IFS= read -r jar; do
              if unzip -l "$jar" 2>/dev/null | grep -q "org/eclipse/xtext/xbase/services/XtypeGrammarAccess.class"; then
                xtype_jar="$jar"; break
              fi
            done < <(find "$work" -type f -name "*.jar" -print 2>/dev/null | sort)
          fi
          echo "runtime_work_provider=${xtype_jar:-NOT_FOUND}"

          echo "== Locate exact Xbase 2.13 provider in Maven/P2 cache =="
          cache_jar=""
          while IFS= read -r jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q "org/eclipse/xtext/xbase/services/XtypeGrammarAccess.class"; then
              cache_jar="$jar"; break
            fi
          done < <(find "$HOME/.m2/repository/p2/osgi/bundle/org.eclipse.xtext.xbase" -type f -name "*.jar" -print 2>/dev/null | sort)
          echo "cache_provider=${cache_jar:-NOT_FOUND}"
          test -n "$cache_jar"
          echo "XTYPE_JAR=$cache_jar"
          sha256sum "$cache_jar"

          echo "== XtypeGrammarAccess bytecode resource references =="
          javap -classpath "$cache_jar" -verbose org.eclipse.xtext.xbase.services.XtypeGrammarAccess \
            | grep -E -i "String.*(xtext|ecore|xmi|grammar|Xtype)|Utf8.*(xtext|ecore|xmi|grammar|Xtype)" \
            | head -200 || true

          echo "== Candidate grammar/resource entries in exact provider JAR =="
          unzip -l "$cache_jar" \
            | grep -E -i "(xtextbin|\\.xtext$|\\.ecore$|\\.xmi$|grammar)" \
            | head -300 || true

          echo "== First bytes of candidate XML/resource entries =="
          unzip -Z1 "$cache_jar" \
            | grep -E -i "(xtextbin|\\.xtext$|\\.ecore$|\\.xmi$|grammar)" \
            | while IFS= read -r entry; do
                echo "--- $entry ---"
                unzip -p "$cache_jar" "$entry" 2>/dev/null | head -c 32 | od -An -tx1 -v || true
              done


          echo "== XtypeGrammarAccess.internalFindGrammar() bytecode =="
          javap -classpath "$cache_jar" -c -p org.eclipse.xtext.xbase.services.XtypeGrammarAccess \\
            | sed -n '/internalFindGrammar/,/^  [^ ].*(/p' | head -120

          echo "== Locate GrammarProvider class in P2 cache =="
          grammar_provider_jar=""
          while IFS= read -r jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q "org/eclipse/xtext/service/GrammarProvider.class"; then
              grammar_provider_jar="$jar"; break
            fi
          done < <(find "$HOME/.m2/repository/p2/osgi/bundle" -type f -name "*.jar" -print 2>/dev/null | sort)
          echo "grammar_provider_jar=${grammar_provider_jar:-NOT_FOUND}"
          test -n "$grammar_provider_jar"

          echo "== GrammarProvider.getGrammar() bytecode =="
          javap -classpath "$grammar_provider_jar" -c -p org.eclipse.xtext.service.GrammarProvider \\
            | sed -n '/getGrammar/,/^  [^ ].*(/p' | head -160

          echo "== Locate BaseEPackageAccess class in P2 cache =="
          base_access_jar=""
          while IFS= read -r jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q "org/eclipse/xtext/parser/BaseEPackageAccess.class"; then
              base_access_jar="$jar"; break
            fi
          done < <(find "$HOME/.m2/repository/p2/osgi/bundle" -type f -name "*.jar" -print 2>/dev/null | sort)
          echo "base_access_jar=${base_access_jar:-NOT_FOUND}"
          test -n "$base_access_jar"

          echo "== BaseEPackageAccess grammar/resource loading bytecode =="
          javap -classpath "$base_access_jar" -c -p org.eclipse.xtext.parser.BaseEPackageAccess \\
            | sed -n '/loadGrammarFile/,/^  [^ ].*(/p; /loadResource/,/^  [^ ].*(/p' | head -240

          echo "TGCV_VIATRA_V002_XTYPE_RESOURCE_DIAGNOSTIC=COMPLETE"
      - name: Runtime scientific firewall
        run: |
          if grep -R -nE '(utility|reward|performance[_ -]?score|value[_ -]?construction|future[_ -]?assignment|t_acc|accessibility[_ -]?label)' \
            05_IMPLEMENTATION/viatra-v002-observer-host/observer-runtime-test \
            05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer; then
            echo "FAIL: scientific-firewall term found"
            exit 1
          fi
          grep -q "V002SerialExecutor" \
            05_IMPLEMENTATION/viatra-v002-observer-host/observer-runtime-test/src/org/tgcv/viatra/v002/observer/runtime/V002ObserverRuntimeTest.java
          echo "TGCV_VIATRA_V002_RUNTIME_P3_P4_FIREWALL=PASS"
