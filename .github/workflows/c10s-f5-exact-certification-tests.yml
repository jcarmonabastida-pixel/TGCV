name: C10-S F5 exact certification deterministic tests

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
    paths:
      - .github/workflows/c10s-f5-runner-sentinel
  workflow_dispatch:
    inputs:
      confirm_f5_deterministic_validation:
        description: "Authorize deterministic F5 unit/adversarial tests only; no calibration, replay or scientific bank"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  f5-tests:
    if: github.ref == 'refs/heads/research/c10s-f1-integrated-correction-20261119' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_f5_deterministic_validation == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Compile F5 modules
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m py_compile c10s_f5_rational_score_polynomials.py test_c10s_f5_rational_score_polynomials.py c10s_f5_beta_binomial_likelihood_diagnostics.py test_c10s_f5_beta_binomial_likelihood_diagnostics.py c10s_f5_beta_binomial_mcse_profile.py test_c10s_f5_beta_binomial_mcse_profile.py
      - name: Run deterministic F5 suites (no calibration)
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m unittest -v test_c10s_f5_rational_score_polynomials test_c10s_f5_beta_binomial_likelihood_diagnostics test_c10s_f5_beta_binomial_mcse_profile
