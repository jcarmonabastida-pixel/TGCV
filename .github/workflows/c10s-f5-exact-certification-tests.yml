name: C10-S F5 deterministic certification

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
      - research/c10s-f5-g7-canonical-mle-v1.1-20261122
    paths:
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_rational_score_polynomials.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_rational_score_polynomials.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_likelihood_diagnostics.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_beta_binomial_likelihood_diagnostics.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_mcse_profile.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_beta_binomial_mcse_profile.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_fitted_beta_binomial_bootstrap.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_fitted_beta_binomial_bootstrap.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_comparative_inference_engine.py
      - 03_EXPERIMENTS/C10-S/harness/run_c10s_f5_g7_tiera_calibration.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_g7_shard_execution.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_g7_shard_execution.py
      - 03_EXPERIMENTS/C10-S/harness/aggregate_c10s_f5_g7_tiera_shards.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_g7_tiera_shards.py

concurrency:
  group: c10s-f5-deterministic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f5-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout research snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12.10"

      - name: Install locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Compile F5 modules
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m py_compile \
            c10s_f5_rational_score_polynomials.py \
            test_c10s_f5_rational_score_polynomials.py \
            c10s_f5_beta_binomial_likelihood_diagnostics.py \
            test_c10s_f5_beta_binomial_likelihood_diagnostics.py \
            c10s_f5_beta_binomial_mcse_profile.py \
            test_c10s_f5_beta_binomial_mcse_profile.py \
            c10s_fitted_beta_binomial_bootstrap.py \
            test_c10s_fitted_beta_binomial_bootstrap.py \
            c10s_nested_mr_comparative_inference_engine.py \
            run_c10s_f5_g7_tiera_calibration.py \
            c10s_f5_g7_shard_execution.py \
            test_c10s_f5_g7_shard_execution.py \
            aggregate_c10s_f5_g7_tiera_shards.py \
            test_c10s_f5_g7_tiera_shards.py

      - name: Run deterministic F5 and G7 software suites only
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -B -m unittest -v \
            test_c10s_f5_rational_score_polynomials \
            test_c10s_f5_beta_binomial_likelihood_diagnostics \
            test_c10s_f5_beta_binomial_mcse_profile \
            test_c10s_fitted_beta_binomial_bootstrap \
            test_c10s_f5_g7_shard_execution \
            test_c10s_f5_g7_tiera_shards
