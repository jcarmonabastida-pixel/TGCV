name: C10-S F5 deterministic certification

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
    paths:
      - .github/workflows/c10s-f5-exact-certification-tests.yml
      - 03_EXPERIMENTS/C10-S/harness/profile_c10s_f5_g7_resource_components.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_rational_score_polynomials.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_rational_score_polynomials.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_likelihood_diagnostics.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_beta_binomial_likelihood_diagnostics.py
      - 03_EXPERIMENTS/C10-S/harness/c10s_f5_beta_binomial_mcse_profile.py
      - 03_EXPERIMENTS/C10-S/harness/test_c10s_f5_beta_binomial_mcse_profile.py

concurrency:
  group: c10s-f5-deterministic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f5-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12.10"

      - name: Install locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Compile F5 modules
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m py_compile \
            c10s_f5_rational_score_polynomials.py \
            test_c10s_f5_rational_score_polynomials.py \
            c10s_f5_beta_binomial_likelihood_diagnostics.py \
            test_c10s_f5_beta_binomial_likelihood_diagnostics.py \
            c10s_f5_beta_binomial_mcse_profile.py \
            test_c10s_f5_beta_binomial_mcse_profile.py

      - name: Run deterministic F5 suites only
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -B -m unittest -v \
            test_c10s_f5_rational_score_polynomials \
            test_c10s_f5_beta_binomial_likelihood_diagnostics \
            test_c10s_f5_beta_binomial_mcse_profile

  f5-g7-resource-only-component-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Compile profiler
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m py_compile profile_c10s_f5_g7_resource_components.py

      - name: Profile two resource-only datasets per cell
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python profile_c10s_f5_g7_resource_components.py --output "$RUNNER_TEMP/c10s-f5-g7-resource-profile.json"

      - name: Upload component profile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-component-profile
          path: ${{ runner.temp }}/c10s-f5-g7-resource-profile.json
          if-no-files-found: warn
          retention-days: 30
