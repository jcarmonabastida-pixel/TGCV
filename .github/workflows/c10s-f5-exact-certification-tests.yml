name: C10-S F5 deterministic certification (partitioned)

on:
  push:
    branches:
      - research/c10s-f5-g7-canonical-mle-v1.1-20261122
    paths:
      - .github/workflows/c10s-f5-exact-certification-tests.yml
      - 03_EXPERIMENTS/C10-S/harness/**

# A new commit waits for the current immutable-snapshot validation; it cannot
# cancel it or launch a second competing full-suite job.
concurrency:
  group: c10s-f5-deterministic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  compile:
    name: Compile F5/G7 source and test modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable research snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Compile F5 and G7 modules
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m py_compile \
            c10s_f5_rational_score_polynomials.py test_c10s_f5_rational_score_polynomials.py \
            run_c10s_f5_unittest_partition.py \
            c10s_f5_beta_binomial_likelihood_diagnostics.py test_c10s_f5_beta_binomial_likelihood_diagnostics.py \
            c10s_f5_beta_binomial_mcse_profile.py test_c10s_f5_beta_binomial_mcse_profile.py \
            c10s_fitted_beta_binomial_bootstrap.py test_c10s_fitted_beta_binomial_bootstrap.py \
            c10s_nested_mr_comparative_inference_engine.py test_c10s_nested_mr_comparative_inference_engine.py \
            run_c10s_f5_g7_tiera_calibration.py c10s_f5_g7_shard_execution.py \
            test_c10s_f5_g7_shard_execution.py aggregate_c10s_f5_g7_tiera_shards.py \
            test_c10s_f5_g7_tiera_calibration.py test_c10s_f5_g7_tiera_authorization.py \
            profile_c10s_f5_g7_resource_preflight_parallel.py validate_c10s_f5_g7_resource_profile.py \
            validate_c10s_f5_g7_tiera_authorization.py execute_c10s_f5_g7_tiera_shard.py \
            test_c10s_f5_g7_resource_profile.py

  deterministic-tests:
    name: F5 deterministic module partition
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # The two M30/R20 end-to-end certificate tests are isolated so one
          # expensive census cannot hide the progress or result of the rest.
          - module: test_c10s_f5_rational_score_polynomials
            selection: exclude
            test_names: test_m30_r20_full_domain_bernstein_route_avoids_large_resultant,test_m30_r20_global_mle_orders_interior_and_boundary_candidates
            partition: rational-core
          - module: test_c10s_f5_rational_score_polynomials
            selection: only
            test_names: test_m30_r20_full_domain_bernstein_route_avoids_large_resultant
            partition: m30-census
          - module: test_c10s_f5_rational_score_polynomials
            selection: only
            test_names: test_m30_r20_global_mle_orders_interior_and_boundary_candidates
            partition: m30-global-mle
          - module: test_c10s_f5_beta_binomial_likelihood_diagnostics
            selection: all
            test_names: ''
            partition: likelihood-diagnostics
          - module: test_c10s_f5_beta_binomial_mcse_profile
            selection: all
            test_names: ''
            partition: mcse-profile
          - module: test_c10s_fitted_beta_binomial_bootstrap
            selection: all
            test_names: ''
            partition: fitted-bootstrap
          - module: test_c10s_f5_g7_shard_execution
            selection: all
            test_names: ''
            partition: shard-execution
          - module: test_c10s_f5_g7_tiera_calibration
            selection: all
            test_names: ''
            partition: tiera-calibration
          - module: test_c10s_nested_mr_comparative_inference_engine
            selection: all
            test_names: ''
            partition: nested-mr-inference
          - module: test_c10s_f5_g7_tiera_authorization
            selection: all
            test_names: ''
            partition: tiera-authorization
          - module: test_c10s_f5_g7_resource_profile
            selection: all
            test_names: ''
            partition: resource-profile
    steps:
      - name: Checkout immutable research snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python with dependency cache
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: 03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Run auditable isolated test selection
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          TEST_MODULE: ${{ matrix.module }}
          TEST_SELECTION: ${{ matrix.selection }}
          TEST_NAMES: ${{ matrix.test_names }}
        run: |
          python -B run_c10s_f5_unittest_partition.py \
            --module "$TEST_MODULE" \
            --selection "$TEST_SELECTION" \
            --test-names "$TEST_NAMES"
