name: C10-S F5 LR runtime probe

on:
  push:
    branches:
      - research/c10s-instrumental-autonomous-workpackage-20261126
    paths:
      - '.github/workflows/c10-s-f5-lr-runtime-probe.yml'
      - '03_EXPERIMENTS/C10-S/harness/profile_c10s_f5_lr_runtime.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f5_rational_score_polynomials.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_component_profile_score.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f5_rational_score_polynomials.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  f5-lr-runtime-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Compile runtime probe
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m py_compile profile_c10s_f5_lr_runtime.py c10s_f5_component_profile_score.py c10s_f5_rational_score_polynomials.py
      - name: Run rational Sturm deterministic tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m unittest -v test_c10s_f5_rational_score_polynomials
      - name: Run bounded deterministic runtime probe
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B profile_c10s_f5_lr_runtime.py
