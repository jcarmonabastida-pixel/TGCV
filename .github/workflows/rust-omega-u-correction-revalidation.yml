name: Rust Omega U correction revalidation v0.4

on:
  workflow_dispatch:

jobs:
  correction-revalidation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run corrected synthetic suite v0.4 v0.4
        working-directory: 07_CODE/tests
        env:
          PYTHONPATH: ../src
        run: |
          set -euo pipefail
          python -m pytest -q test_omega_u_constructor_v01.py
