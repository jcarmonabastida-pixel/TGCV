name: Collective Toy synthetic engine tests

on:
  push:
    branches:
      - prototype/collective-toy-engine-001-20261011
      - prototype/sequentiality-contract-tests-001-20261014
      - prototype/tgcv-full-chain-001-20261014-scenario-context-recovery
  pull_request:
    branches:
      - main
    paths:
      - 'prototypes/collective_toy/**'
      - '.github/workflows/collective-toy-engine-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile engine and both test suites
        run: >-
          python -m py_compile
          prototypes/collective_toy/collective_toy_engine_001.py
          prototypes/collective_toy/test_collective_toy_engine_001.py
          prototypes/collective_toy/test_collective_toy_sequentiality_001.py
      - name: Run historical unit tests
        working-directory: prototypes/collective_toy
        run: python -m unittest -v test_collective_toy_engine_001.py
      - name: Run temporal sequentiality contract tests
        working-directory: prototypes/collective_toy
        run: python -m unittest -v test_collective_toy_sequentiality_001.py
      - name: Replay both suites from clean source archive
        shell: bash
        run: |
          set -euo pipefail
          clean_root="$RUNNER_TEMP/collective-toy-clean-room"
          mkdir -p "$clean_root"
          git archive "$GITHUB_SHA" prototypes/collective_toy | tar -x -C "$clean_root"
          cd "$clean_root/prototypes/collective_toy"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v test_collective_toy_engine_001.py
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v test_collective_toy_sequentiality_001.py
