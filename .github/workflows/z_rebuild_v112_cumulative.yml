name: Rebuild v1.12 cumulatively from v1.11

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild cumulative v1.12
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          src = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.11.md'
          out = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md'
          current = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md'

          v111 = src.read_text(encoding='utf-8')
          marker = '## Material empirical evidence — C10C-001 Structural Reconstruction\n'
          if not v111.startswith('# TGCV — Evidence-to-Claim Matrix — Current v1.11\n'):
              raise SystemExit('SOURCE_HEADER_FAILURE')
          if marker not in v111:
              raise SystemExit('INSERTION_MARKER_FAILURE')

          header_end = v111.index('## Matrix preservation rule\n')
          body = v111[header_end:]
          body = body.replace('Formal architecture + bounded cross-domain traces + IT-G1 bounded industrial case + C10C-004 |', 'Formal architecture + bounded cross-domain traces + IT-G1 bounded industrial case + C10C-004 + MT4 |', 1)
          body = body.replace('without establishing TGCV state representation. No claim-level upgrade.', 'without establishing TGCV state representation. MT4 adds bounded methodological support that a technical constraint/state layer can be identified and preserved in a heterogeneous electricity-system domain. No claim-level upgrade.', 1)
          body = body.replace('C10C-003 + C10C-004 | SWIM provides bounded accessibility operationalization;', 'C10C-003 + C10C-004 + MT4 | SWIM provides bounded accessibility operationalization;', 1)
          body = body.replace('No claim-level upgrade is implied. | Independent operationalization across a distinct exemplar |', 'MT4 provides a partially formalized technical candidate admissibility layer (`CORE6`) with 92.58% complete country-technology-year coverage, but full `P_tau` remains undetermined. No claim-level upgrade is implied. | Independent operationalization across a distinct exemplar |', 1)
          body = body.replace('C10C-003 + C10C-004 | SWIM provides bounded non-Rust evidence', 'C10C-003 + C10C-004 + MT4 | SWIM provides bounded non-Rust evidence', 1)
          body = body.replace('This does not upgrade the Rust-specific claim level. | Independent closed operationalization / replication |', 'MT4 adds a new-domain bounded methodological separation between candidate constraints and realized technology changes, but does not identify a complete `T_acc` or positive `Delta T_acc` result. This does not upgrade the Rust-specific claim level. | Independent closed operationalization / replication |', 1)
          body = body.replace('C10C-003 | SWIM adds bounded reconstructability', 'C10C-003 + MT4 | SWIM adds bounded reconstructability', 1)
          body = body.replace('No claim-level upgrade is implied. | Independent valid trajectory test', 'MT4 establishes downstream separation of candidate constraints, realized transformations and state/trajectory variables, but does not establish a trajectory causal estimand. No claim-level upgrade is implied. | Independent valid trajectory test', 1)
          body = body.replace('C10C-003 do not establish causal `DeltaT_acc → DeltaV` or predictive value.', 'C10C-003 do not establish causal `DeltaT_acc → DeltaV` or predictive value. MT4-8 structurally isolates `Inv`, `Fixed_OM_annual` and `Variable_OM` from the CORE6 candidate accessibility rule, but does not establish them as downstream TGCV value outcomes or test `DeltaT_acc → DeltaV`.', 1)
          body = body.replace('No Value evidence |', 'No Value evidence + MT4 value-isolation boundary |', 1)
          body = body.replace('C10C-002 + C10C-001 + C10C-003 |', 'C10C-002 + C10C-001 + C10C-003 + MT4 |', 1)
          body = body.replace('This strengthens documented heterogeneity and boundary evidence only; it does not establish transversal validity or justify a claim upgrade.', 'This strengthens documented heterogeneity and boundary evidence only; MT4 adds a genuinely heterogeneous historical electricity-system domain and strengthens the documented record of methodological transfer and boundary preservation. It does not establish transversal validity or justify a claim upgrade.', 1)
          body = body.replace('C10C-003 + C10C-004 | SWIM supports bounded state/context', 'C10C-003 + C10C-004 + MT4 | SWIM supports bounded state/context', 1)
          body = body.replace('It does not close downstream value boundaries or establish transversal validity.', 'MT4 adds a heterogeneous electricity-system transfer case preserving separation among candidate technical constraints, admissibility/accessibility, realized transformations, state/trajectory and economic/value-related variables. It does not close downstream value boundaries or establish transversal validity.', 1)

          mt4 = '''## Material methodological evidence — MT4 historical national electricity-system transitions\n\n**Case:** `MT4 — historical national electricity-system transitions / energy-system technology change`  \n**Status:** `BOUNDED PASS — METHODOLOGICAL TRANSFER DEMONSTRATED WITH EXPLICIT LIMITS`  \n**Result artifact:** `00_GOVERNANCE/SIP/TGCV_MT4_DOMAIN_TRANSFER_RESULT_001.md`  \n**Propagation record:** `00_GOVERNANCE/SIP/TGCV_MT4_EVIDENCE_TO_CLAIM_PROPAGATION_001.md`  \n**Primary source:** Jaxa-Rozen, Wen & Trutnevyte, `Historic data of the national electricity system transitions in Europe in 1990–2019 for retrospective evaluation of models`, Zenodo record 6696776, v2.\n\nMT4 transfers the candidate transversal methodology to a heterogeneous historical electricity-system domain while preserving separation among state/conditions, candidate technical constraints, admissibility/accessibility, realized transformations, state/trajectory and economic/value-related variables. The frozen dataset covers 31 European countries and 1990–2019, with 1,359 processed/harmonized data files and 528 original data sources/references.\n\n### Gate results\n\n- **MT4-1:** PASS — source discovery/provenance.\n- **MT4-2:** PASS — source freeze/integrity.\n- **MT4-3:** PASS — structural/schema reconstruction.\n- **MT4-4:** PASS — bounded state/candidate-transformation/constraint coverage, with explicit temporal limitations.\n- **MT4-5:** OPEN / BOUNDED — full `P_tau` remains undetermined; CORE6 coverage is 92.58% and the candidate technical rule is only partially formalized.\n- **MT4-6:** PASS — independent reproducibility: 13,320 country-technology-year cells, 12,331 complete CORE6 cells, 989 incomplete cells, 92.58% coverage; 930 multi-technology country-year groups; one duplicate CORE6 signature group.\n- **MT4-7:** BOUNDED PASS — candidate technical parameters remain separated from realized transformations, state/trajectory variables and economic/value-related variables; candidate-rule/actual overlap violations = 0.\n- **MT4-8:** BOUNDED PASS — economic/value-related variables are structurally isolated from the CORE6 candidate accessibility rule; no downstream TGCV `Delta V` endpoint is established and no causal value effect is tested.\n\n### Methodological significance\n\nMT4 demonstrates bounded methodological transfer and boundary preservation in a non-software electricity-system domain. It does not establish full `P_tau`, transversal validity, causal accessibility-to-trajectory transfer, or `Delta T_acc → Delta V`.\n\n### Evidence-to-claim propagation\n\nMT4 is additive to the complete v1.11 claim matrix. It provides bounded methodological support/qualification to C01, C02, C07, C08, C10, C11 and C16; no positive propagation to C03, C04, C05, C06, C12, C13, C14 or C15; and no positive causal propagation to C09. No claim-level status is upgraded.\n\n'''

          rebuilt = v111[:header_end]
          rebuilt = rebuilt.replace('# TGCV — Evidence-to-Claim Matrix — Current v1.11', '# TGCV — Evidence-to-Claim Matrix — Current v1.12', 1)
          rebuilt = rebuilt.replace('**Predecessor:** v1.10', '**Predecessor:** v1.11', 1)
          rebuilt += body
          rebuilt = rebuilt.replace(marker, mt4 + marker, 1)

          # Exact preservation gate for the predecessor body, modulo explicitly authorized MT4 additions.
          for line in v111[header_end:].splitlines():
              if line and line not in rebuilt:
                  raise SystemExit('PRESERVATION_FAILURE:' + line[:200])

          out.write_text(rebuilt, encoding='utf-8', newline='\n')
          current.write_text(rebuilt, encoding='utf-8', newline='\n')

          print('REBUILD=PASS')
          print('SOURCE_SHA=02fe951b99ee36b6c4f9e28d8ded6c294bbbca88')
          print('TARGET=v1.12')
          print('PREDECESSOR_BODY_PRESERVED=TRUE')
          print('CURRENT_ALIAS=BYTE_IDENTICAL')

      - name: Validate
        shell: bash
        run: python 00_GOVERNANCE/tools/validate_current_state.py

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/z_rebuild_v112_cumulative.yml .github/workflows/_rebuild_v112_from_v111.yml
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md .github/workflows/z_rebuild_v112_cumulative.yml .github/workflows/_rebuild_v112_from_v111.yml
          git commit -m 'Rebuild Matrix v1.12 cumulatively from v1.11 with MT4'
          git push origin main
