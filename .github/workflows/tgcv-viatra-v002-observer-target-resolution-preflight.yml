name: TGCV VIATRA V002 Observer Target Resolution Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-resolution:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout TGCV
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Toolchain
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          mvn -version | tee maven-version.txt

      - name: Materialize pinned historical CPS model bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash materialize-historical-cps-models.sh

      - name: Target and manifest inspection
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          set -euo pipefail
          grep -q 'org.eclipse.viatra.transformation.evm.feature.group.*version="2.0.2"' target-definition/tgcv-viatra-v002-target.target
          grep -q 'org.eclipse.viatra.transformation.runtime.emf.feature.group.*version="2.0.2"' target-definition/tgcv-viatra-v002-target.target
          grep -q 'org.eclipse.viatra.transformation.evm,' observer/META-INF/MANIFEST.MF
          grep -q 'org.eclipse.viatra.transformation.runtime.emf' observer/META-INF/MANIFEST.MF

      - name: Tycho target-resolution gate
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -DskipTests validate
