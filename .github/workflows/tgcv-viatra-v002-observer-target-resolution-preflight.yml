name: TGCV VIATRA V002 Observer Target Resolution Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-resolution:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout TGCV
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Toolchain
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          mvn -version | tee maven-version.txt

      - name: Materialize pinned historical CPS model bundles
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: bash materialize-historical-cps-models.sh

      - name: Inspect actual VIATRA 2.0.2 p2 metadata
        run: |
          set -euo pipefail
          url="https://download.eclipse.org/viatra/updates/release/2.0.2/content.xml.xz"
          curl -fsSL "$url" -o viatra-content.xml.xz
          xz -dc viatra-content.xml.xz > viatra-content.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("viatra-content.xml").getroot()
          rows = []
          for element in root.iter():
              if element.tag.rsplit("}", 1)[-1] != "unit":
                  continue
              unit_id = element.attrib.get("id", "")
              if unit_id.startswith("org.eclipse.viatra.transformation."):
                  rows.append((unit_id, element.attrib.get("version", "")))

          rows.sort()
          for unit_id, version in rows:
              print(f"{unit_id} {version}")

          expected = {
              "org.eclipse.viatra.transformation.evm",
              "org.eclipse.viatra.transformation.runtime.emf",
              "org.eclipse.viatra.transformation.evm.feature.feature.group",
              "org.eclipse.viatra.transformation.runtime.emf.feature.feature.group",
          }
          found = {unit_id for unit_id, _ in rows}
          missing = sorted(expected - found)
          if missing:
              raise SystemExit(
                  "Missing expected VIATRA transformation IUs: " + ", ".join(missing)
              )
          PY

      - name: Target and manifest inspection
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: |
          set -euo pipefail
          grep -q 'org.eclipse.viatra.transformation.evm.feature.feature.group.*version="2.0.2.201808291256"' target-definition/tgcv-viatra-v002-target.target
          grep -q 'org.eclipse.viatra.transformation.runtime.emf.feature.feature.group.*version="2.0.2.201808291256"' target-definition/tgcv-viatra-v002-target.target
          grep -q 'org.eclipse.viatra.transformation.evm,' observer/META-INF/MANIFEST.MF
          grep -q 'org.eclipse.viatra.transformation.runtime.emf' observer/META-INF/MANIFEST.MF

      - name: Tycho target-resolution gate
        working-directory: 05_IMPLEMENTATION/viatra-v002-observer-host
        run: mvn -B -ntp -DskipTests validate
