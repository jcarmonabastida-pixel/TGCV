name: C10-S F1 profile deterministic tests

on:
  push:
    branches:
      - research/c10s-instrumental-autonomous-workpackage-20261126
    paths:
      - '.github/workflows/c10-s-f1-profile-static-tests.yml'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f1_between_profile_likelihood.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_f1_between_profile_likelihood.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f1_root_adjudication.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_f1_independent_root_isolator.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_variance_comparison_interface.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  f1-profile-deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Compile F1 profile implementation and tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m py_compile c10s_f1_between_profile_likelihood.py test_c10s_f1_between_profile_likelihood.py c10s_f1_root_adjudication.py c10s_f1_independent_root_isolator.py c10s_variance_comparison_interface.py
      - name: Run deterministic F1 profile tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: python -B -m unittest -v test_c10s_f1_between_profile_likelihood
