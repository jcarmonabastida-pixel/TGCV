name: TGCV fix GL-07 v1.13
on:
  push:
    paths:
      - '.github/workflows/zz_fix_v113_gl07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v1.13 from v1.12
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md')
          assert p.exists()
          old=p.read_text(encoding='utf-8')
          assert '## Matrix preservation rule' in old
          print('SOURCE_V112_PRESENT=PASS')
          PY
