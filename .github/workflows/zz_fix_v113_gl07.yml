name: TGCV fix GL-07 v1.13
on:
  push:
    paths:
      - '.github/workflows/zz_fix_v113_gl07.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute staged GL-07 propagation
        run: python 00_GOVERNANCE/SIP/_tmp_apply_gl07_v113.py
      - name: Commit and clean one-shot artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.13.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md
          git rm .github/workflows/zz_apply_v113_gl07.yml .github/workflows/zz_fix_v113_gl07.yml 00_GOVERNANCE/SIP/_tmp_apply_gl07_v113.py
          git commit -m 'Close GL-07 cumulative Evidence-to-Claim Matrix v1.13'
          git push origin main
