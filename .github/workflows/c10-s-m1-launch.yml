name: C10-S M1 manual positive N32

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  register:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. No scientific execution on push."

  positive-n32:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: One positive DGP run (N=32)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dacacb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Install pinned harness dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Run exactly one typed positive N=32 pipeline
        working-directory: 03_EXPERIMENTS/C10-S/harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c10s-m1-positive-n32"
          timeout --signal=TERM --kill-after=20s 15m python -B - <<'PY'
          import dataclasses
          import json
          import os
          import platform
          from pathlib import Path

          from theta_a_calibration_dgp import ThetaACalibrationDGPFactory
          from theta_a_calibration_protocol import (
              ThetaASeedAssignment,
              build_theta_a_candidate_scenario_roster,
          )

          # Use the existing typed roster and its equal-support contract. This
          # keeps the reserved oracle separate from Analyzer inputs.
          scenario = next(
              item for item in build_theta_a_candidate_scenario_roster()
              if item.scenario_id == "THETA_A_POSITIVE_V1"
          )
          if scenario.dgp_profile is None:
              raise RuntimeError("Positive scenario has no typed DGP profile")
          if scenario.dgp_profile.expected_theta_a_truth != 0.5:
              raise RuntimeError("Positive scenario contract does not declare theta_A truth +0.5")
          if scenario.dgp_profile.support_relation != "EQUAL":
              raise RuntimeError("M1 requires the declared equal-support benchmark")
          if not scenario.unit_independence_certified:
              raise RuntimeError("Positive scenario lacks its unit-independence design declaration")

          # One deterministic world and one pipeline invocation; no calibration
          # bank, replay, additional scenario, or inferential CI is created.
          assignment = ThetaASeedAssignment(
              bank="evaluation",
              scenario_id=scenario.scenario_id,
              scenario_version=scenario.scenario_version,
              n_units=32,
              outer_world_id="outer-m1-000001",
              assignment_replicate=0,
              world_family_id=scenario.world_family_id or scenario.scenario_id,
              world_id="C10S-M1-POSITIVE-N32",
              roster_id="C10S-M1-POSITIVE-N32-ROSTER",
              world_version=scenario.world_version,
              dgp_id=scenario.dgp_id,
              dgp_version=scenario.dgp_version,
              roster_version=scenario.roster_version,
              unit_id_prefix="M1",
              run_id="C10S-M1-POSITIVE-N32-RUN",
              world_seed=20261128,
              randomization_salt="c10s-m1-positive-n32-assignment-seed-20261128",
              s3_seed=2026112801,
              dgp_profile_sha256=scenario.dgp_profile_sha256,
          )
          factory = ThetaACalibrationDGPFactory()
          result = factory.execute_calibration_scenario(
              assignment,
              scenario,
              {
                  "theta_a_confidence_level": None,
                  "theta_a_unit_independence_certified": True,
              },
          )
          if result is None or result.analyzer_result is None or result.evaluator_result is None:
              raise RuntimeError("Pipeline did not return both Analyzer and independent Evaluator results")

          # Read truth only from the reserved evaluator-only oracle bundle.
          oracle_truth = result.theta_a_truth.theta_a_truth.theta_a_truth
          evaluator_truth = result.evaluator_result.truth
          if abs(oracle_truth - 0.5) > 1e-12:
              raise RuntimeError(f"Reserved DGP truth is {oracle_truth}, expected +0.5")
          if abs(evaluator_truth - oracle_truth) > 1e-12:
              raise RuntimeError("Independent Evaluator truth differs from reserved DGP oracle")
          if not result.evaluator_result.correct_adjudication:
              raise RuntimeError("Independent Evaluator rejected the Analyzer adjudication")
          if not result.evaluator_result.truth_within_bounds:
              raise RuntimeError("Analyzer bounds do not contain the reserved DGP truth")

          report = {
              "classification": "SINGLE_EXPLORATORY_SYNTHETIC_CAUSAL_RECOVERY_CHECK",
              "status": "EXPLORATORY_NOT_CONFIRMATORY",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "selected_ref": os.environ.get("GITHUB_REF"),
              "python": platform.python_version(),
              "design": {
                  "scenario_id": scenario.scenario_id,
                  "scenario_version": scenario.scenario_version,
                  "dgp_id": scenario.dgp_id,
                  "dgp_version": scenario.dgp_version,
                  "n_units": 32,
                  "expected_theta_a_truth": 0.5,
                  "structural_support_contract_id": scenario.dgp_profile.structural_support_contract_id,
                  "support_relation": scenario.dgp_profile.support_relation,
                  "observation": "complete_interval_best_case",
                  "pipeline_invocations": 1,
                  "replay": False,
                  "additional_scenarios": False,
                  "confidence_interval": None,
                  "unit_independence_design_declared": True
              },
              "truth_audit": {
                  "reserved_oracle_truth": oracle_truth,
                  "independent_evaluator_truth": evaluator_truth,
                  "truth_match": True,
                  "truth_within_analyzer_bounds": result.evaluator_result.truth_within_bounds,
                  "correct_adjudication": result.evaluator_result.correct_adjudication
              },
              "analyzer": dataclasses.asdict(result.analyzer_result),
              "independent_evaluator": dataclasses.asdict(result.evaluator_result)
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "c10s-m1-positive-n32" / "result.json"
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str, allow_nan=False) + "\\n",
              encoding="utf-8"
          )
          print(json.dumps({
              "truth_audit": report["truth_audit"],
              "analyzer": report["analyzer"],
              "independent_evaluator": report["independent_evaluator"]
          }, sort_keys=True, default=str), flush=True)
          print("PIPELINE_INVOCATIONS=1 REPLAY=0 ADDITIONAL_SCENARIOS=0", flush=True)
          PY

      - name: Upload exploratory result
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-m1-positive-n32-${{ github.run_id }}
          path: ${{ runner.temp }}/c10s-m1-positive-n32/**
          if-no-files-found: warn
          retention-days: 14
