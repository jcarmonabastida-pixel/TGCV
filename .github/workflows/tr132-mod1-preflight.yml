name: TGCV TR-132-MOD-1 preflight (manual — validated/closed)

on:
  workflow_dispatch:

permissions:
  contents: read

# TR-132-MOD-1 preflight is a validated/closed control artifact.
# It must not execute on ordinary repository pushes. Manual dispatch is retained
# only for explicit re-verification if governance later authorizes it.

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run deterministic TR-132-MOD-1 preflight
        run: python 03_EXPERIMENTS/TR-132-MOD-1/execution/preflight_mod1_v01.py
