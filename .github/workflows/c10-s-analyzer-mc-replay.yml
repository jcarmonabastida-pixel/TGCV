name: C10-S P178 Analyzer clean replay (recovery)

on:
  push:
    branches:
      - research/c10-s-consolidation-draft
    paths:
      - '.github/workflows/c10-s-analyzer-mc-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  clean-replay:
    name: Replay the exact 27-cell primary result from a clean source archive
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the exact primary-execution commit
        uses: actions/checkout@v4
        with:
          ref: 689c8f0164e0625ca536a20b1805e555cd63d5fd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned reference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0

      - name: Compile and run the 17 contract tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile focal_harness.py test_focal_harness.py test_p178_analyzer_bridge.py run_p178_analyzer_monte_carlo.py test_p178_analyzer_monte_carlo.py
          python -B -m unittest -v

      - name: Download the already completed primary artifact
        uses: actions/download-artifact@v4
        with:
          name: c10s-p178-analyzer-mc-689c8f0164e0625ca536a20b1805e555cd63d5fd-43083651875-1
          run-id: 43083651875
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/c10s-primary-artifact

      - name: Verify primary artifact integrity and declared completion
        shell: bash
        run: |
          set -euo pipefail
          primary="${RUNNER_TEMP}/c10s-primary-artifact/c10s-primary"
          test -s "$primary/p178_analyzer_monte_carlo.csv"
          test -s "$primary/p178_analyzer_monte_carlo_manifest.json"
          echo "CSV_SHA256=$(sha256sum "$primary/p178_analyzer_monte_carlo.csv" | cut -d' ' -f1)"
          test "$(sha256sum "$primary/p178_analyzer_monte_carlo.csv" | cut -d' ' -f1)" = "e73a204b6ffc3ff4666c37d9a3e2d5ff4612a3d0602a25349cbb8bc12287914f"
          python - "$primary/p178_analyzer_monte_carlo_manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["status"] == "PASS"
          assert p["cells"] == 27
          assert p["replications_per_cell"] == 10000
          assert p["acceptance"]["status"] == "PASS"
          assert all(p["acceptance"]["criteria"].values())
          print("PRIMARY_MANIFEST=PASS; 27 cells; 10,000 replications/cell")
          PY

      - name: Build a clean source archive from the primary commit
        shell: bash
        run: |
          set -euo pipefail
          clean_root="$RUNNER_TEMP/c10s-clean-replay"
          mkdir -p "$clean_root"
          git archive 689c8f0164e0625ca536a20b1805e555cd63d5fd \
            03_EXPERIMENTS/C10-S/harness \
            03_EXPERIMENTS/C10-S/calibration/p178_focal_monte_carlo.py \
            03_EXPERIMENTS/C10-S/calibration/p178_reference_N700.csv \
            | tar -x -C "$clean_root"

      - name: Execute the full clean 27-cell replay
        shell: bash
        run: |
          set -euo pipefail
          clean_root="$RUNNER_TEMP/c10s-clean-replay"
          cd "$clean_root"
          python 03_EXPERIMENTS/C10-S/harness/run_p178_analyzer_monte_carlo.py \
            --out "$RUNNER_TEMP/c10s-replay" \
            --replications 10000 \
            --strict-protocol \
            > "$RUNNER_TEMP/c10s-replay-stdout.txt" \
            2> "$RUNNER_TEMP/c10s-replay-stderr.txt"
          cat "$RUNNER_TEMP/c10s-replay-stdout.txt"
          cat "$RUNNER_TEMP/c10s-replay-stderr.txt" >&2

      - name: Compare replay outputs byte-for-byte with the primary artifact
        shell: bash
        run: |
          set -euo pipefail
          primary="$RUNNER_TEMP/c10s-primary-artifact/c10s-primary"
          replay="$RUNNER_TEMP/c10s-replay"
          cmp "$primary/p178_analyzer_monte_carlo.csv" "$replay/p178_analyzer_monte_carlo.csv"
          cmp "$primary/p178_analyzer_monte_carlo_manifest.json" "$replay/p178_analyzer_monte_carlo_manifest.json"
          echo "CLEAN_REPLAY_BYTE_IDENTICAL=PASS"

      - name: Record replay provenance and hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          def digest(path):
              if not path.exists():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          names = [
              "c10s-primary-artifact/c10s-primary/p178_analyzer_monte_carlo.csv",
              "c10s-primary-artifact/c10s-primary/p178_analyzer_monte_carlo_manifest.json",
              "c10s-replay/p178_analyzer_monte_carlo.csv",
              "c10s-replay/p178_analyzer_monte_carlo_manifest.json",
              "c10s-replay-stdout.txt", "c10s-replay-stderr.txt",
          ]
          record = {
              "protocol": "TGCV-C10-S-P178-ANALYZER-MC-001",
              "primary_run_id": "43083651875",
              "primary_commit": "689c8f0164e0625ca536a20b1805e555cd63d5fd",
              "replay_workflow_commit": os.environ["GITHUB_SHA"],
              "replay_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha256": {n: digest(root / n) for n in names},
          }
          (root / "c10s-clean-replay-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload clean replay and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10s-p178-analyzer-clean-replay-43083651875-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c10s-replay/**
            ${{ runner.temp }}/c10s-replay-stdout.txt
            ${{ runner.temp }}/c10s-replay-stderr.txt
            ${{ runner.temp }}/c10s-clean-replay-provenance.json
          if-no-files-found: warn
          retention-days: 30

# Replay invocation record: exact P178 primary artifact 43083651875; no Analyzer or protocol changes.
