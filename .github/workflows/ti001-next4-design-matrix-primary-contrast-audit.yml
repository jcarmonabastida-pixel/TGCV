name: TI-001 NEXT4 design matrix primary contrast audit 002

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --upgrade pip numpy
      - name: Run deterministic design audit
        working-directory: 03_EXPERIMENTS/TI-001
        run: python TI001_V012_NEXT4_DESIGN_MATRIX_AND_PRIMARY_CONTRAST_AUDIT_002.py
