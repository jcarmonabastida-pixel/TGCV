name: TGCV one-shot exact v1.12 reconstruction

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/zz_fix_v112_exact.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild v1.12 mechanically from v1.11
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          root = Path('.')
          src = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.11.md'
          dst = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md'
          cur = root / '00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md'

          base = src.read_text(encoding='utf-8')
          before = hashlib.sha256(base.encode('utf-8')).hexdigest()
          print('V111_SHA256=' + before)

          text = base
          text = text.replace('# TGCV — Evidence-to-Claim Matrix — Current v1.11', '# TGCV — Evidence-to-Claim Matrix — Current v1.12', 1)
          text = text.replace('**Predecessor:** v1.10', '**Predecessor:** v1.11', 1)
          old_intro = '**Incremental governance update:** v1.11 preserves the complete material evidentiary content and schema of v1.10; no evidence is deleted, collapsed, or downgraded. C10C-004 is propagated as bounded methodological evidence to C01, C11 and C16, with explicit negative/boundary qualification for C02 and no direct evidence contribution to C07, C08, C09 or C10. No claim-level status is upgraded by this propagation.'
          new_intro = '**Incremental governance update:** v1.12 preserves the complete material evidentiary content and schema of v1.11; no evidence is deleted, collapsed, or downgraded. MT4 is propagated as bounded methodological evidence/qualification to C01, C02, C07, C08, C10, C11 and C16, with explicit non-positive propagation to C09. No claim-level status is upgraded by this propagation.'
          if old_intro not in text:
              raise SystemExit('ERROR: v1.11 incremental-update paragraph not found exactly')
          text = text.replace(old_intro, new_intro, 1)

          mt4 = {
            'C01': ('MT4 adds bounded methodological support that a technical constraint/state layer can be identified and preserved in a heterogeneous historical electricity-system domain. No claim-level upgrade.', ' + MT4'),
            'C02': ('MT4 provides a partially formalized technical candidate admissibility layer (CORE6) with 92.58% complete country-technology-year coverage, demonstrating bounded operationalization/auditability of the admissibility distinction in a new domain, but full P_tau remains undetermined. No claim-level upgrade.', ' + MT4'),
            'C07': ('MT4 adds a new-domain bounded methodological separation between candidate constraints and realized technology changes, but does not identify a complete T_acc or positive Delta T_acc result. No claim-level upgrade.', ' + MT4'),
            'C08': ('MT4 establishes downstream separation of candidate constraints, realized transformations and state/trajectory variables, but does not establish a trajectory causal estimand. No claim-level upgrade.', ' + MT4'),
            'C09': ('MT4 contains no causal estimate of Delta T_acc -> trajectory and therefore provides no positive C09 propagation; the existing bounded causal-support status is unchanged.', ' + MT4'),
            'C10': ('MT4-8 structurally isolates Inv, Fixed_OM_annual and Variable_OM from the CORE6 candidate accessibility rule, but does not establish those variables as downstream TGCV value outcomes and does not test Delta T_acc -> Delta V. C10 remains open.', ' + MT4'),
            'C11': ('MT4 adds a genuinely heterogeneous historical electricity-system domain and strengthens the documented record of methodological transfer and boundary preservation. It does not establish transversal validity or justify a claim upgrade.', ' + MT4'),
            'C16': ('MT4 adds a heterogeneous electricity-system transfer case preserving separation among candidate technical constraints, admissibility/accessibility, realized transformations, state/trajectory and economic/value-related variables. It supports the candidate translation sequence while leaving full P_tau, downstream value and transversal validity open. No claim-level upgrade.', ' + MT4'),
          }

          lines = text.splitlines(keepends=True)
          out = []
          seen = set()
          in_table = False
          for line in lines:
              if line.startswith('| ID | Claim | Status |'):
                  in_table = True
                  out.append(line)
                  continue
              if in_table and line.startswith('|---|'):
                  out.append(line)
                  continue
              if in_table and line.startswith('| C'):
                  parts = line.rstrip('\n').split('|')
                  if len(parts) >= 7:
                      cid = parts[1].strip()
                      if cid in mt4:
                          impact, basis_suffix = mt4[cid]
                          # Preserve all v1.11 cell content; append only MT4 material.
                          if cid != 'C09':
                              parts[4] = parts[4].rstrip() + ' ' + impact
                          else:
                              parts[4] = parts[4].rstrip() + ' ' + impact
                          parts[3] = parts[3].rstrip() + basis_suffix
                          line = '|'.join(parts) + '\n'
                          seen.add(cid)
                  out.append(line)
                  continue
              if in_table and line.startswith('## '):
                  in_table = False
              out.append(line)
          missing = set(mt4) - seen
          if missing:
              raise SystemExit('ERROR: MT4 claim rows not found: ' + ','.join(sorted(missing)))

          text = ''.join(out).rstrip() + '\n'
          mt4_section = r'''

## Material methodological evidence — MT4 Domain Transfer

**Case:** Historical national electricity-system transitions / energy-system technology change  
**Status:** `BOUNDED PASS — METHODOLOGICAL TRANSFER DEMONSTRATED WITH EXPLICIT LIMITS`  
**Primary source:** Jaxa-Rozen, Wen & Trutnevyte, *Historic data of the national electricity system transitions in Europe in 1990–2019 for retrospective evaluation of models*, Zenodo record 6696776, v2.  
**Frozen source SHA256:** `691F950A314015A7DE9D4CBABCC177846D74ABF7036B6A89E192B152A88E6D30`  
**Closure artifact:** `00_GOVERNANCE/SIP/TGCV_MT4_DOMAIN_TRANSFER_RESULT_001.md`

MT4 demonstrates bounded transfer of the candidate TGCV analytical methodology to a heterogeneous historical electricity-system domain while preserving the distinctions among state/conditions, candidate transformations, admissibility/accessibility, realized transformations, subsequent state/trajectory and economic/value-related variables.

### Gate results

- **MT4-1:** PASS
- **MT4-2:** PASS
- **MT4-3:** PASS
- **MT4-4:** PASS — BOUNDED
- **MT4-5:** OPEN / BOUNDED — full `P_tau` not established
- **MT4-6:** PASS — independent reproducibility of the structural audit
- **MT4-7:** BOUNDED PASS — downstream separation
- **MT4-8:** BOUNDED PASS — value isolation

### Material bounded findings

- CORE6 candidate technical layer: 12,331 of 13,320 country-technology-year cells complete (**92.58%**).
- The six CORE6 dimensions are `Fuel_efficiency`, `LF_min`, `LF_max`, `Peak_contr`, `Ramp_rate` and `Resource`.
- Full `P_tau` remains **UNDETERMINED**; MT4-5 remains open/bounded.
- Realized transformation variables (`Actual_new_capacity`, `Actual_retired_capacity`) remain separated from candidate accessibility.
- State/trajectory variables (`Actual_capacity`, `Actual_generation`) remain separated from candidate accessibility and realized transformation.
- Economic/value-related variables (`Inv`, `Fixed_OM_annual`, `Variable_OM`) were structurally isolated from the CORE6 candidate rule; their common historical time span does not establish downstream value ordering.
- MT4 contains no causal estimate of `Delta T_acc -> trajectory` and no estimate of `Delta T_acc -> Delta V`.

### Interpretation and limits

MT4 is methodological domain-transfer evidence, not transversal causal validation. It does not establish a complete accessibility predicate, a downstream TGCV value endpoint, a causal accessibility-to-value mechanism, or a claim-level upgrade. It does not modify the TGCV Core, RMA ontology, C09 bounded causal-support status, or the open status of C10, C11, C12 and C16.

### Claim propagation

The MT4 evidence is propagated as bounded methodological evidence/qualification to **C01, C02, C07, C08, C10, C11 and C16**. It provides **no positive propagation to C03, C04, C05, C06, C12, C13, C14 or C15**. C09 receives an explicit **non-positive propagation** because MT4 does not estimate the causal link from `Delta T_acc` to subsequent trajectory.

This section is additive to the complete v1.11 matrix. No material v1.11 evidence is deleted, collapsed or replaced.
'''
          text += mt4_section

          # The v1.11 content must remain a prefix after the explicitly authorized header/intro/row additions.
          if '## Material methodological evidence — MT4 Domain Transfer' not in text:
              raise SystemExit('ERROR: MT4 section missing')

          dst.write_text(text, encoding='utf-8')
          cur.write_text(text, encoding='utf-8')

          # Exact equality of CURRENT and versioned current matrix is mandatory.
          if dst.read_bytes() != cur.read_bytes():
              raise SystemExit('ERROR: CURRENT and v1.12 differ')

          print('V112_SHA256=' + hashlib.sha256(text.encode('utf-8')).hexdigest())
          print('V112_BYTES=' + str(len(text.encode('utf-8'))))
          print('RESULT=EXACT_V111_BASE_PLUS_AUTHORIZED_MT4_ADDITIONS')

      - name: Validate canonical current state
        run: python 00_GOVERNANCE/tools/validate_current_state.py

      - name: Commit exact v1.12 and canonical alias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_v1.12.md 00_GOVERNANCE/EVIDENCE_TO_CLAIM_MATRIX_CURRENT.md
          git commit -m "Rebuild v1.12 exactly from v1.11 with MT4 additions"
          git push origin main

      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/zz_fix_v112_exact.yml
          git add -u .github/workflows/zz_fix_v112_exact.yml
          git diff --cached --quiet || git commit -m "Remove one-shot exact v1.12 reconstruction workflow"
          git push origin main || true
