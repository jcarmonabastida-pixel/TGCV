name: C10-S F5 G7 prospective Tier-A calibration — staged one-use authorization

on:
  push:
    branches:
      - 'research/c10s-f5-g7-auth-*'
    paths:
      - '00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json'

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'


jobs:
  authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      authorization_id: ${{ steps.authorization.outputs.authorization_id }}
      approved_code_commit: ${{ steps.authorization.outputs.approved_code_commit }}
      resource_profile_run_id: ${{ steps.authorization.outputs.resource_profile_run_id }}
      resource_profile_artifact_id: ${{ steps.authorization.outputs.resource_profile_artifact_id }}
    steps:
      - name: Gate branch and explicit authorization commit
        id: gate
        env:
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$WORKFLOW_BRANCH" == research/c10s-f5-g7-auth-* && "$COMMIT_MESSAGE" == *"Approve one-use C10-S F5 G7 TierA calibration"* ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "Non-authorization push; no G7 computation will be scheduled."
          fi
      - name: Checkout one-use authorization commit
        if: steps.gate.outputs.approved == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pinned Python
        if: steps.gate.outputs.approved == 'true'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies for authorization validation
        if: steps.gate.outputs.approved == 'true'
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Validate one-use G7 authorization and exact code parent
        if: steps.gate.outputs.approved == 'true'
        id: authorization
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
        run: |
          python 03_EXPERIMENTS/C10-S/harness/validate_c10s_f5_g7_tiera_authorization.py \
            --authorization 00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json \
            --root . \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --branch "$WORKFLOW_BRANCH" \
            --output-json "$RUNNER_TEMP/validated-g7-authorization.json"
          cp 00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json "$RUNNER_TEMP/original-g7-authorization.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "validated-g7-authorization.json").read_text())
          print(f"authorization_id={data['authorization_id']}")
          print(f"approved_code_commit={data['approved_code_commit']}")
          print(f"resource_profile_run_id={data['resource_profile_run_id']}")
          print(f"resource_profile_artifact_id={data['resource_profile_artifact_id']}")
          PY
      - name: Preserve original and validated one-use authorization evidence
        if: steps.gate.outputs.approved == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-authorization-${{ steps.authorization.outputs.authorization_id }}
          path: |
            ${{ runner.temp }}/validated-g7-authorization.json
            ${{ runner.temp }}/original-g7-authorization.json
          if-no-files-found: error
          retention-days: 90

  resource_preflight_validation:
    needs: authorization
    if: needs.authorization.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
      resource_profile_sha256: ${{ steps.plan.outputs.resource_profile_sha256 }}
      datasets_per_shard: ${{ steps.plan.outputs.datasets_per_shard }}
      estimated_end_to_end_wall_seconds: ${{ steps.plan.outputs.estimated_end_to_end_wall_seconds }}
    steps:
      - name: Checkout exact approved research code and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.authorization.outputs.approved_code_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Download immutable resource-only profile artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.authorization.outputs.resource_profile_artifact_id }}
          run-id: ${{ needs.authorization.outputs.resource_profile_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-profile
          merge-multiple: true
      - name: Validate immutable resource profile and derive safe shard matrix
        id: plan
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PLAN_JSON: ${{ runner.temp }}/g7-resource-profile-validation.json
        run: |
          PROFILE_JSON="$(find "$RUNNER_TEMP/resource-profile" -type f -name 'c10s-f5-g7-resource-parallel-profile.json' -print -quit)"
          test -n "$PROFILE_JSON"
          python validate_c10s_f5_g7_resource_profile.py \
            --profile "$PROFILE_JSON" \
            --manifest ../diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_001.json \
            --root ../../.. \
            --output-json "$RUNNER_TEMP/g7-resource-profile-validation.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["PLAN_JSON"]).read_text())
          print("shard_matrix=" + json.dumps(data["shard_matrix"], separators=(",", ":")))
          print("resource_profile_sha256=" + data["profile_json_sha256"])
          print("datasets_per_shard=" + str(data["datasets_per_shard"]))
          print("estimated_end_to_end_wall_seconds=" + str(data["end_to_end_conservative_wall_seconds"]))
          PY
          mkdir -p "$RUNNER_TEMP/g7-resource-plan"
          cp "$RUNNER_TEMP/g7-resource-profile-validation.json" "$RUNNER_TEMP/g7-resource-plan/"
          cp "$PROFILE_JSON" "$RUNNER_TEMP/g7-resource-plan/resource-profile.json"
          cp ../diagnostics/C10S_F5_G7_RESOURCE_PROFILE_MANIFEST_001.json "$RUNNER_TEMP/g7-resource-plan/resource-profile-manifest.json"
      - name: Upload validated resource plan and immutable profile (no recomputation)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-resource-plan-${{ needs.authorization.outputs.authorization_id }}
          path: ${{ runner.temp }}/g7-resource-plan/
          if-no-files-found: error
          retention-days: 90

  primary_bank:
    needs: [authorization, resource_preflight_validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.resource_preflight_validation.outputs.shard_matrix) }}
    steps:
      - name: Checkout exact approved research code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.authorization.outputs.approved_code_commit }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Execute one primary shard
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          GITHUB_SHA: ${{ needs.authorization.outputs.approved_code_commit }}
          APPROVED_CODE_COMMIT: ${{ needs.authorization.outputs.approved_code_commit }}
        run: |
          python execute_c10s_f5_g7_tiera_shard.py \
            --phase primary \
            --cell-id "${{ matrix.shard.cell_id }}" \
            --replicate-start "${{ matrix.shard.replicate_start }}" \
            --replicate-count "${{ matrix.shard.replicate_count }}" \
            --source-commit "$APPROVED_CODE_COMMIT" \
            --output "$RUNNER_TEMP/${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}.json"
      - name: Upload immutable primary shard
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-primary-${{ needs.authorization.outputs.authorization_id }}-${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}
          path: ${{ runner.temp }}/${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Create clean source tree for replay on the same runner
        env:
          APPROVED_CODE_COMMIT: ${{ needs.authorization.outputs.approved_code_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/g7-clean-replay"
          git archive "$APPROVED_CODE_COMMIT" | tar -x -C "$RUNNER_TEMP/g7-clean-replay"
      - name: Execute clean-source replay shard on the primary runner
        working-directory: ${{ runner.temp }}/g7-clean-replay/03_EXPERIMENTS/C10-S/harness
        env:
          GITHUB_SHA: ${{ needs.authorization.outputs.approved_code_commit }}
          APPROVED_CODE_COMMIT: ${{ needs.authorization.outputs.approved_code_commit }}
        run: |
          python execute_c10s_f5_g7_tiera_shard.py \
            --phase replay \
            --cell-id "${{ matrix.shard.cell_id }}" \
            --replicate-start "${{ matrix.shard.replicate_start }}" \
            --replicate-count "${{ matrix.shard.replicate_count }}" \
            --source-commit "$APPROVED_CODE_COMMIT" \
            --output "$RUNNER_TEMP/${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}-replay.json"
      - name: Upload immutable replay shard
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-replay-${{ needs.authorization.outputs.authorization_id }}-${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}
          path: ${{ runner.temp }}/${{ matrix.shard.cell_id }}-${{ matrix.shard.replicate_start }}-replay.json
          if-no-files-found: error
          retention-days: 90
  final_adjudication:
    needs: [authorization, resource_preflight_validation, primary_bank]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact approved research code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.authorization.outputs.approved_code_commit }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock
      - name: Download all completed primary shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: c10s-f5-g7-primary-${{ needs.authorization.outputs.authorization_id }}-*
          path: ${{ runner.temp }}/g7-shards/primary
          merge-multiple: true
      - name: Download all completed replay shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: c10s-f5-g7-replay-${{ needs.authorization.outputs.authorization_id }}-*
          path: ${{ runner.temp }}/g7-shards/replay
          merge-multiple: true
      - name: Download validated resource profile plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c10s-f5-g7-resource-plan-${{ needs.authorization.outputs.authorization_id }}
          path: ${{ runner.temp }}/g7-resource-plan
      - name: Download original and validated authorization evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c10s-f5-g7-authorization-${{ needs.authorization.outputs.authorization_id }}
          path: ${{ runner.temp }}/c10s-f5-g7-tiera/authorization
      - name: Aggregate, verify exact replay and adjudicate full denominators once
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          GITHUB_SHA: ${{ needs.authorization.outputs.approved_code_commit }}
        run: |
          python aggregate_c10s_f5_g7_tiera_shards.py \
            --primary-dir "$RUNNER_TEMP/g7-shards/primary" \
            --replay-dir "$RUNNER_TEMP/g7-shards/replay" \
            --preflight "$RUNNER_TEMP/g7-resource-plan/resource-profile.json" \
            --preflight-manifest "$RUNNER_TEMP/g7-resource-plan/resource-profile-manifest.json" \
            --expected-preflight-sha256 "${{ needs.resource_preflight_validation.outputs.resource_profile_sha256 }}" \
            --output-dir "$RUNNER_TEMP/c10s-f5-g7-tiera" \
            --source-commit "${{ needs.authorization.outputs.approved_code_commit }}" \
            --authorization-id "${{ needs.authorization.outputs.authorization_id }}"
          mkdir -p "$RUNNER_TEMP/c10s-f5-g7-tiera/resource-profile" "$RUNNER_TEMP/c10s-f5-g7-tiera/resource-plan"
          cp "$RUNNER_TEMP/g7-resource-plan/resource-profile.json" "$RUNNER_TEMP/c10s-f5-g7-tiera/resource-profile/"
          cp "$RUNNER_TEMP/g7-resource-plan/resource-profile-manifest.json" "$RUNNER_TEMP/c10s-f5-g7-tiera/resource-profile/"
          cp "$RUNNER_TEMP/g7-resource-plan/g7-resource-profile-validation.json" "$RUNNER_TEMP/c10s-f5-g7-tiera/resource-plan/"
      - name: Upload final G7 result and immutable bank artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-tiera-${{ needs.authorization.outputs.authorization_id }}-${{ needs.authorization.outputs.approved_code_commit }}
          path: ${{ runner.temp }}/c10s-f5-g7-tiera/
          if-no-files-found: warn
          retention-days: 90
