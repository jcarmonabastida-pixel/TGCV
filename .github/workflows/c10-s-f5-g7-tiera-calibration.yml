name: C10-S F5 G7 prospective Tier-A calibration — one-use authorization

on:
  push:
    branches:
      - 'research/c10s-f5-g7-auth-*'
    paths:
      - '00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  f5-g7-tiera-calibration:
    if: startsWith(github.ref, 'refs/heads/research/c10s-f5-g7-auth-') && contains(github.event.head_commit.message, 'Approve one-use C10-S F5 G7 TierA calibration')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout one-use authorization commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
      - name: Install hash-locked dependencies for validator/executor
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Validate one-use G7 authorization and exact code parent
        id: authorization
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
        run: |
          python 03_EXPERIMENTS/C10-S/harness/validate_c10s_f5_g7_tiera_authorization.py \
            --authorization 00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json \
            --root . \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --branch "$WORKFLOW_BRANCH" \
            --output-json "$RUNNER_TEMP/validated-g7-authorization.json"
          cp 00_GOVERNANCE/authorizations/C10S_F5_G7_TIERA_CALIBRATION_AUTHORIZATION.json "$RUNNER_TEMP/original-g7-authorization.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "validated-g7-authorization.json").read_text())
          print(f"authorization_id={data['authorization_id']}")
          print(f"approved_code_commit={data['approved_code_commit']}")
          PY
      - name: Checkout exact approved research code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.authorization.outputs.approved_code_commit }}
          path: source
          persist-credentials: false
      - name: Install hash-locked dependencies for G7
        working-directory: source/03_EXPERIMENTS/C10-S/harness
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock'
      - name: Execute resource preflight, primary G7 and clean-source replay
        working-directory: source
        env:
          GITHUB_SHA: ${{ steps.authorization.outputs.approved_code_commit }}
          APPROVED_CODE_COMMIT: ${{ steps.authorization.outputs.approved_code_commit }}
        run: |
          python 03_EXPERIMENTS/C10-S/harness/execute_c10s_f5_g7_tiera_calibration.py \
            --validated-authorization "$RUNNER_TEMP/validated-g7-authorization.json" \
            --original-authorization "$RUNNER_TEMP/original-g7-authorization.json" \
            --code-commit "$APPROVED_CODE_COMMIT" \
            --output-dir "$RUNNER_TEMP/c10s-f5-g7-tiera" \
            --root .
      - name: Upload G7 resource, primary, replay and integrity artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-f5-g7-tiera-${{ steps.authorization.outputs.authorization_id }}-${{ steps.authorization.outputs.approved_code_commit }}
          path: ${{ runner.temp }}/c10s-f5-g7-tiera/
          if-no-files-found: warn
          retention-days: 90
