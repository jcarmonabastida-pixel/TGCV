name: C10-S nested M/R precision — static validation

on:
  push:
    branches:
      - research/c10-s-consolidation-draft
    paths:
      - '.github/workflows/c10-s-nested-mc-static-validation.yml'
      - '03_EXPERIMENTS/C10-S/harness/theta_a_nested_mc_precision.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_fixtures.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_validation.py'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_execution_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_validation.py'
      - '03_EXPERIMENTS/C10-S/harness/test_theta_a_nested_mc_precision.py'
      - '03_EXPERIMENTS/C10-S/harness/theta_a_calibration_protocol.py'
      - '03_EXPERIMENTS/C10-S/harness/test_theta_a_calibration_protocol.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'
  pull_request:
    branches:
      - research/c10-d1-protocol-draft
    paths:
      - '.github/workflows/c10-s-nested-mc-static-validation.yml'
      - '03_EXPERIMENTS/C10-S/harness/theta_a_nested_mc_precision.py'
      - '03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_fixtures.py'
      - '03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_validation.py'
      - '03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_execution_authorization.py'
      - '03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_validation.py'
      - '03_EXPERIMENTS/C10-S/harness/test_theta_a_nested_mc_precision.py'
      - '03_EXPERIMENTS/C10-S/harness/theta_a_calibration_protocol.py'
      - '03_EXPERIMENTS/C10-S/harness/test_theta_a_calibration_protocol.py'
      - '03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock'

permissions:
  contents: read

jobs:
  nested-mr-static-tests:
    name: Compile and run the two authorized software-contract modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'

      - name: Install hash-locked test dependencies
        working-directory: 03_EXPERIMENTS/C10-S/harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-vcont-integrated.lock

      - name: Compile only the nested precision implementation and its protocol integration
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile theta_a_nested_mc_precision.py test_theta_a_nested_mc_precision.py theta_a_calibration_protocol.py test_theta_a_calibration_protocol.py c10s_nested_mr_fixtures.py run_c10s_nested_mr_validation.py validate_c10s_nested_mr_execution_authorization.py test_c10s_nested_mr_validation.py

      - name: Run only the two authorized software-contract test modules
        id: tests
        working-directory: 03_EXPERIMENTS/C10-S/harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set +e
          python -B -m unittest -v test_theta_a_nested_mc_precision test_theta_a_calibration_protocol test_c10s_nested_mr_validation > "$RUNNER_TEMP/c10s-nested-mr-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/c10s-nested-mr-tests.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Write machine-readable validation manifest
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          paths = [
              ".github/workflows/c10-s-nested-mc-static-validation.yml",
              "03_EXPERIMENTS/C10-S/harness/theta_a_nested_mc_precision.py",
              "03_EXPERIMENTS/C10-S/harness/test_theta_a_nested_mc_precision.py",
              "03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_fixtures.py",
              "03_EXPERIMENTS/C10-S/harness/run_c10s_nested_mr_validation.py",
              "03_EXPERIMENTS/C10-S/harness/validate_c10s_nested_mr_execution_authorization.py",
              "03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_validation.py",
              "03_EXPERIMENTS/C10-S/harness/theta_a_calibration_protocol.py",
              "03_EXPERIMENTS/C10-S/harness/test_theta_a_calibration_protocol.py",
              "03_EXPERIMENTS/C10-S/harness/requirements-vcont-integrated.lock",
          ]
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          manifest = {
              "schema": "TGCV-C10S-NESTED-MR-STATIC-VALIDATION-001",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python": sys.version,
              "platform": platform.platform(),
              "architecture": platform.machine(),
              "test_modules": [
                  "test_theta_a_nested_mc_precision",
                  "test_theta_a_calibration_protocol",
                  "test_c10s_nested_mr_validation",
              ],
              "compile_scope": [
                  "theta_a_nested_mc_precision.py",
                  "test_theta_a_nested_mc_precision.py",
                  "theta_a_calibration_protocol.py",
                  "test_theta_a_calibration_protocol.py",
              ],
              "test_exit_code": os.environ.get("TEST_EXIT_CODE"),
              "inputs": {p: {"sha256": digest(p), "bytes": (root / p).stat().st_size} for p in paths},
              "scope_exclusions": [
                  "no Generator, Analyzer or Evaluator execution",
                  "no DGP or calibration-bank execution",
                  "no Monte Carlo or scientific workflow",
                  "no writes to main",
              ],
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "c10s-nested-mr-validation-manifest.json"
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload logs and validation manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c10s-nested-mr-static-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c10s-nested-mr-tests.log
            ${{ runner.temp }}/c10s-nested-mr-validation-manifest.json
          if-no-files-found: warn
          retention-days: 30
