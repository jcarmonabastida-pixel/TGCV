name: TGCV governance current-state consistency

on:
  push:
    branches:
      - main
      - matrix-v1.9-c10c001-staging
      - prototype/tgcv-full-chain-001-20261014-scenario-context-recovery
    paths:
      - '00_GOVERNANCE/**'
      - 'STATUS.md'
      - 'prototypes/collective_toy/FC5_FC6_NUMBERED_ACCEPTANCE_REGISTER_001.md'
      - 'prototypes/collective_toy/FC5_FC6_RISK_PRIORITIZED_GROUPED_TEST_PLAN_001.md'
      - 'prototypes/collective_toy/web/ui_contract_test.cjs'
      - '.github/workflows/governance-current-state.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  governance-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate canonical current-state governance chain
        run: python 00_GOVERNANCE/tools/validate_current_state.py
