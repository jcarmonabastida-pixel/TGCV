name: TGCV VIATRA V002 Scientific Entry Point Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-entry-point-preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact execution ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify canonical implementation commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="8bef1d02c23b58dc5d5165b8aff51b264d4fd52f"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          echo "TGCV_V002_CANONICAL_IMPLEMENTATION_COMMIT=$EXPECTED"
          echo "TGCV_V002_EXECUTION_PACKAGE_HEAD=$(git rev-parse HEAD)"

      - name: Verify authorization remains blocked
        shell: bash
        run: |
          set -euo pipefail
          GATE="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION_GATE_001.json"
          grep -q '"scientific_execution_authorized": false' "$GATE"
          grep -q '"decision": "BLOCKED_PENDING_EXPLICIT_AUTHORIZATION"' "$GATE"
          echo "TGCV_V002_AUTHORIZATION_FIREWALL=PASS"

      - name: Verify exact entry point declaration
        shell: bash
        run: |
          set -euo pipefail
          ENTRY_POINT="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_ENTRY_POINT_v001.md"
          test -f "$ENTRY_POINT"
          grep -q 'org.tgcv.viatra.v002.observer.V002SerialExecutor.execute()' "$ENTRY_POINT"
          grep -q 'seed_policy = NOT_APPLICABLE_DETERMINISTIC_SERIAL_EXECUTION' "$ENTRY_POINT"
          grep -q 'This document does not authorize scientific execution.' "$ENTRY_POINT"
          echo "TGCV_V002_ENTRY_POINT_DECLARATION=PASS"

      - name: Verify source and test binding
        shell: bash
        run: |
          set -euo pipefail
          EXECUTOR="05_IMPLEMENTATION/viatra-v002-observer-host/observer/src/org/tgcv/viatra/v002/observer/V002SerialExecutor.java"
          TEST="05_IMPLEMENTATION/viatra-v002-observer-host/observer-runtime-test/src/org/tgcv/viatra/v002/observer/runtime/V002ObserverRuntimeTest.java"
          test -f "$EXECUTOR"
          test -f "$TEST"
          grep -q 'class V002SerialExecutor' "$EXECUTOR"
          grep -q 'void execute' "$EXECUTOR"
          grep -q 'V002SerialExecutor executor = new V002SerialExecutor' "$TEST"
          grep -q 'executor.execute()' "$TEST"
          echo "TGCV_V002_SOURCE_TEST_BINDING=PASS"

      - name: Verify scientific execution is not invoked
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude-dir=target --exclude-dir=.git             'ALLOW_AND_EXECUTE|scientific_execution_authorized[[:space:]]*:[[:space:]]*true'             05_IMPLEMENTATION/viatra-v002-observer-host; then
            echo "FAIL: scientific execution authorization marker detected"
            exit 1
          fi
          echo "TGCV_V002_EXECUTION_INVOCATION_FIREWALL=PASS"

      - name: Verify expected output contract
        shell: bash
        run: |
          set -euo pipefail
          ENTRY_POINT="05_IMPLEMENTATION/viatra-v002-observer-host/TGCV_VIATRA_V002_SCIENTIFIC_EXECUTION_ENTRY_POINT_v001.md"
          grep -q 'transformation identity' "$ENTRY_POINT"
          grep -q 'activation instance identity' "$ENTRY_POINT"
          grep -q 'pre-state digest' "$ENTRY_POINT"
          grep -q 'post-state digest' "$ENTRY_POINT"
          grep -q 'raw outputs and cryptographic hashes' "$ENTRY_POINT"
          echo "TGCV_V002_OUTPUT_CONTRACT=PASS"

      - name: Final preflight decision
        shell: bash
        run: |
          set -euo pipefail
          echo "TGCV_V002_SCIENTIFIC_ENTRY_POINT_PREFLIGHT=PASS"
          echo "TGCV_V002_SCIENTIFIC_EXECUTION_AUTHORIZATION=NOT_GRANTED"
          echo "TGCV_V002_NEXT_GATE=EXPLICIT_AUTHORIZATION_REQUIRED"
