name: Collective Toy performance benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Benchmark profile: standard CI-size cases or engine scale-bound cases"
        required: true
        type: choice
        default: standard
        options:
          - standard
          - scale
  pull_request:
    branches:
      - main
    paths:
      - 'prototypes/collective_toy/benchmark_collective_toy_engine_001.py'
      - 'prototypes/collective_toy/collective_toy_engine_001.py'
      - '.github/workflows/collective-toy-performance-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reproducible engineering benchmark
        working-directory: prototypes/collective_toy
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'scale' }}" = "true" ]; then
            python benchmark_collective_toy_engine_001.py --repeats 3 --sizes 100 250 500 > benchmark-results.json
            EXPECTED_REPEATS=3
          else
            python benchmark_collective_toy_engine_001.py --repeats 7 --sizes 25 50 100 > benchmark-results.json
            EXPECTED_REPEATS=7
          fi
          export EXPECTED_REPEATS
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("benchmark-results.json").read_text())
          expected_repeats = int(os.environ["EXPECTED_REPEATS"])
          assert data["scientific_execution"] is False
          assert data["latency_threshold_enforced"] is False
          assert data["resource_bounds"] == {"max_states": 500, "max_transitions": 2000}
          assert len(data["reports"]) == 9
          for row in data["reports"]:
              assert row["median_elapsed_ms"] >= 0
              assert row["peak_alloc_bytes_max"] >= 0
              assert row["repeats"] == expected_repeats
              assert row["states"] <= data["resource_bounds"]["max_states"]
              assert row["transitions"] <= data["resource_bounds"]["max_transitions"]
          print(json.dumps({
              "benchmark": data["benchmark"],
              "scientific_execution": data["scientific_execution"],
              "latency_threshold_enforced": data["latency_threshold_enforced"],
              "resource_bounds": data["resource_bounds"],
              "cases": len(data["reports"]),
              "cases_summary": [
                  {"graph_kind": row["graph_kind"], "size": row["size"],
                   "transitions": row["transitions"],
                   "median_elapsed_ms": row["median_elapsed_ms"],
                   "p95_elapsed_ms": row["p95_elapsed_ms"],
                   "peak_alloc_bytes_max": row["peak_alloc_bytes_max"]}
                  for row in data["reports"]
              ]
          }, indent=2))
          PY
      - name: Upload raw benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: collective-toy-performance-benchmark
          path: prototypes/collective_toy/benchmark-results.json
          if-no-files-found: error
          retention-days: 30
