name: C10-S F1 integrated numerical validation 001

on:
  push:
    branches:
      - research/c10s-f1-integrated-correction-20261119
    paths:
      - .github/workflows/c10s-f1-integrated-validation-001.yml
      - 00_GOVERNANCE/authorizations/C10S_F1_INTEGRATED_NUMERICAL_VALIDATION_AUTHORIZATION_DRAFT_003.json

permissions:
  contents: read

jobs:
  validate-frozen-f1:
    if: >-
      ${{ github.ref == 'refs/heads/research/c10s-f1-integrated-correction-20261119'
          && contains(github.event.head_commit.message, 'C10S-F1-INTEGRATED-VALIDATION-20261119-03') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact frozen source (detached)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 41d91bd19ba0dfd789d21b3d8398184daa100ff9
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Python baseline
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          check-latest: false

      - name: Verify frozen commit, clean checkout, and nine blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "41d91bd19ba0dfd789d21b3d8398184daa100ff9"
          test "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.3"
          test -z "$(git status --porcelain)"
          mkdir -p validation-evidence
          {
            echo "authorization_id=C10S-F1-INTEGRATED-VALIDATION-20261119-03"
            echo "expected_commit=41d91bd19ba0dfd789d21b3d8398184daa100ff9"
            echo "actual_commit=$(git rev-parse HEAD)"
            echo "python_version=$(python --version 2>&1)"
            echo "platform=$(uname -a)"
            echo "working_directory=$PWD"
            echo "git_status_before_evidence_directory=CLEAN"
          } | tee validation-evidence/preflight.txt
          cat > validation-evidence/expected-blobs.tsv <<'EOF'
          ae2fc89c8da09bbeba88a9309b5ba37750bcd631 03_EXPERIMENTS/C10-S/harness/c10s_f1_between_profile_likelihood.py
          3ac9ce31eb82421022fd8d2a65a0daee049322be 03_EXPERIMENTS/C10-S/harness/c10s_f1_independent_root_isolator.py
          9fa1cb21cd47e32030db8a00420e7dacfdc77321 03_EXPERIMENTS/C10-S/harness/c10s_f1_root_adjudication.py
          d277db712f8d2fdc7efbb5da5213d3087a84358a 03_EXPERIMENTS/C10-S/harness/c10s_nested_mr_comparative_inference_engine.py
          e7684bd3f70687ed5eeccb515db1d9e161407223 03_EXPERIMENTS/C10-S/harness/test_c10s_f1_between_profile_likelihood.py
          bb5cd2b8d2819fdb8757ea293d7e8f8fb9a1b4ce 03_EXPERIMENTS/C10-S/harness/test_c10s_f1_independent_root_isolator.py
          2bcaed7423528fbbf9a6783c3f32e5edd30a10bc 03_EXPERIMENTS/C10-S/harness/test_c10s_f1_root_adjudication.py
          1061998ba93f363fbaaaed050c67acd6eb1c45b5 03_EXPERIMENTS/C10-S/harness/test_c10s_nested_mr_comparative_inference_engine.py
          f4f7f771d4027de33d2892441e2da512ce3f793b 03_EXPERIMENTS/C10-S/harness/C10S_F1_INTEGRATED_CONCORDANCE_MATRIX_DRAFT_002.md
          EOF
          while IFS=' ' read -r expected path; do
            actual="$(git hash-object "$path")"
            printf '%s %s %s\n' "$expected" "$actual" "$path" | tee -a validation-evidence/blob-verification.txt
            test "$actual" = "$expected"
          done < validation-evidence/expected-blobs.tsv

      - name: Create isolated environment and install only pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/c10s-f1-validation-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --no-deps --only-binary=:all: numpy==2.1.3 scipy==1.14.1
          "$VENV/bin/python" -m pip freeze | tee validation-evidence/dependencies.txt
          "$VENV/bin/python" - <<'PY' | tee validation-evidence/runtime-imports.txt
          import numpy, scipy
          print("numpy", numpy.__version__)
          print("scipy", scipy.__version__)
          PY

      - name: Verify all four test modules import
        working-directory: 03_EXPERIMENTS/C10-S/harness
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/c10s-f1-validation-venv/bin/python" - <<'PY' | tee "$GITHUB_WORKSPACE/validation-evidence/import-preflight.txt"
          import test_c10s_f1_between_profile_likelihood
          import test_c10s_f1_independent_root_isolator
          import test_c10s_f1_root_adjudication
          import test_c10s_nested_mr_comparative_inference_engine
          print("ALL_FOUR_TEST_MODULE_IMPORTS_OK")
          PY

      - name: Run the one newly authorized deterministic test command
        working-directory: 03_EXPERIMENTS/C10-S/harness
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/c10s-f1-validation-venv/bin/python" -m unittest -v test_c10s_f1_between_profile_likelihood test_c10s_f1_independent_root_isolator test_c10s_f1_root_adjudication test_c10s_nested_mr_comparative_inference_engine > "$GITHUB_WORKSPACE/validation-evidence/test.stdout" 2> "$GITHUB_WORKSPACE/validation-evidence/test.stderr"
          code=$?
          printf '%s\n' "$code" | tee "$GITHUB_WORKSPACE/validation-evidence/exit-code.txt"
          exit "$code"

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c10s-f1-integrated-validation-002
          path: validation-evidence/
          if-no-files-found: warn
          retention-days: 90
