name: D-OPS 003 R002 freeze preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify R002 package boundary
        shell: bash
        run: |
          set -euo pipefail
          root="00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002"
          test -f "$root/README.md"
          test -f "$root/D0_FORMAL_FIXTURE.json"
          test -f "$root/G_S_SPECIFICATION.md"
          test -f "$root/R3_manifest_D0.json"
          test -f "$root/dops_canonical.py"
          test -f "$root/dops_gs.py"
          test -f "$root/dops_oracle.py"
          test -f "$root/dops_perturbations.py"
          test -f "$root/expected_results.json"
          test -f "$root/oracle_specification.md"
          test -f "$root/perturbation_manifest.json"
          test -f "$root/result_schema.json"
          test "$(find "$root" -maxdepth 1 -type f | wc -l)" -eq 12
          grep -q "Status: REVISION CANDIDATE — NOT FROZEN" "$root/README.md"
          grep -q "Execution authorized: NO" "$root/README.md"

      - name: Verify corrected directed-R3 semantics
        shell: python
        run: |
          import importlib.util, json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          spec=importlib.util.spec_from_file_location("sut", root/"dops_canonical.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          r3=json.loads((root/"R3_manifest_D0.json").read_text(encoding="utf-8"))
          out=m.canonical_omega(json.loads((root/"D0_FORMAL_FIXTURE.json").read_text(encoding="utf-8")), r3)
          assert out["R3"] == [["tau_move","tau_wait"],["tau_wait","tau_move"]], out["R3"]
          assert out["R3"][0] != list(reversed(out["R3"][0]))
          print("PASS: R3 endpoint order is preserved as directed-edge semantics")

      - name: Verify independent oracle semantics
        shell: python
        run: |
          import importlib.util, json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          spec=importlib.util.spec_from_file_location("oracle", root/"dops_oracle.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          fixture=json.loads((root/"D0_FORMAL_FIXTURE.json").read_text(encoding="utf-8"))
          r3=json.loads((root/"R3_manifest_D0.json").read_text(encoding="utf-8"))
          old=m.oracle_canonicalize(fixture, r3)
          new=dict(old)
          new["R3"]=[["tau_move","tau_wait"],["tau_wait","tau_scan"]]
          assert m.classify(old,new) == "RECONFIGURATION_ONLY"
          print("PASS: independent oracle classifies directed R3 replacement as RECONFIGURATION_ONLY")

      - name: Verify expected-result contract
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          exp=json.loads((root/"expected_results.json").read_text(encoding="utf-8"))
          assert exp == {
            "persistence":"PERSISTENCE",
            "expansion":"EXPANSION",
            "contraction":"CONTRACTION",
            "reconfiguration":"RECONFIGURATION_ONLY",
            "mixed_identity_change":"OTHER_STRUCTURAL_CHANGE"
          }
          print("PASS: expected-result contract")

      - name: Generate exact-byte R002 provenance manifest
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root=Path("00_GOVERNANCE/D-OPS_FREEZE_PACKAGE_003R002")
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes()
                  files.append({"path":str(p),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          manifest={
            "schema_version":"001",
            "repository":"jcarmonabastida-pixel/TGCV",
            "ref":"main",
            "package":str(root),
            "revision":"R002",
            "predecessor":"R001",
            "files":files
          }
          out=Path("D-OPS_PACKAGE_003R002_PROVENANCE_MANIFEST_001.json")
          out.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(out.read_text(encoding="utf-8"))

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          echo "PASS: clean checkout"

      - name: Upload exact-byte provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: D-OPS-003R002-provenance-manifest
          path: D-OPS_PACKAGE_003R002_PROVENANCE_MANIFEST_001.json
