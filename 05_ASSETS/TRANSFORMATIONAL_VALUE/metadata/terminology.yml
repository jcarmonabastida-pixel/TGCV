schema_version: 0.1
terms:
  - term_id: TV-TERM-001
    concept: accessible_transformation_space
    preferred:
      es: "espacio de transformaciones accesibles"
      en: "accessible transformation space"
    definition:
      es: "Representación analítica del conjunto o estructura de transformaciones que resultan accesibles a un sistema bajo un estado y unas condiciones relevantes especificados. Se deriva mediante un criterio de accesibilidad explícito e independiente de las transformaciones realizadas y de los resultados posteriores."
      en: "An analytical representation of the set or structure of transformations accessible to a system under a specified state and relevant conditions. It is derived through an explicit accessibility criterion independent of realised transformations and downstream outcomes."
    symbols:
      - "T_acc"
    related_terms: []
    status: draft
    source_basis:
      - "TGCV Core current"
      - "Chapter 3 source-readiness record"
    notes: "Bilingual draft definitions v0.2. The criterion must be specified independently of realisation and downstream outcomes; not approved for publication."

  - term_id: TV-TERM-002
    concept: system_of_interest
    preferred:
      es: "sistema de interés"
      en: "system of interest"
    definition:
      es: "Sistema que se selecciona como objeto de interés para un análisis o una descripción determinados. Los aspectos que se consideran parte del sistema y su delimitación se establecen en función del propósito y de la pregunta que orientan el trabajo."
      en: "The system selected as the object of interest for a particular analysis or description. The aspects considered part of the system and its delimitation are established in relation to the purpose and question guiding the work."
    related_terms: [TV-TERM-003, TV-TERM-004, TV-TERM-005]
    status: draft
    notes: "Chapter 1. Distinguish the system of interest from the unit of analysis and the analytical perspective."

  - term_id: TV-TERM-003
    concept: system_boundary
    preferred:
      es: "frontera del sistema"
      en: "system boundary"
    definition:
      es: "Delimitación que establece qué elementos, relaciones, procesos y aspectos se consideran dentro del sistema de interés y cuáles quedan fuera, en función del propósito y de la pregunta del análisis. Puede considerar interfaces y dimensiones físicas, funcionales, operativas o temporales, y revisarse cuando resulte necesario. No tiene por qué coincidir con un perímetro físico o administrativo."
      en: "The delimitation that establishes which elements, relationships, processes and aspects are considered inside the system of interest and which are outside it, according to the purpose and question of the analysis. It may account for interfaces and physical, functional, operational or temporal dimensions, and may be revised when necessary. It need not coincide with a physical or administrative perimeter."
    related_terms: [TV-TERM-002, TV-TERM-004, TV-TERM-005]
    status: draft
    notes: "Chapter 1. The boundary is purpose-dependent and may be revised when relevant dependencies or interfaces become apparent."

  - term_id: TV-TERM-004
    concept: environment
    preferred:
      es: "entorno"
      en: "environment"
    definition:
      es: "Conjunto de elementos, sistemas y condiciones situados fuera de la frontera seleccionada que interactúan con el sistema de interés, influyen en él o reciben sus efectos."
      en: "The set of elements, systems and conditions outside the selected boundary that interact with, influence or are affected by the system of interest."
    related_terms: [TV-TERM-002, TV-TERM-003, TV-TERM-005]
    status: draft
    notes: "Chapter 1 editorial convention. The term is used in a specific operational distinction from context; this distinction is not claimed to be universal across disciplines."

  - term_id: TV-TERM-005
    concept: context
    preferred:
      es: "contexto"
      en: "context"
    definition:
      es: "Conjunto de circunstancias, relaciones y condiciones relevantes que permiten situar y comprender el problema, propósito o situación objeto de análisis. Puede incluir actores, otros sistemas y condiciones de operación, tanto dentro como fuera de la frontera del sistema de interés."
      en: "The set of relevant circumstances, relationships and conditions that provide the setting for understanding the problem, purpose or situation being analysed. It may include actors, other systems and operating conditions, both inside and outside the boundary of the system of interest."
    related_terms: [TV-TERM-002, TV-TERM-003, TV-TERM-004]
    status: draft
    notes: "Chapter 1 editorial convention. Preserve the distinction from environment without implying that it is universally standardised."

  - term_id: TV-TERM-006
    concept: emergent_behaviour
    preferred:
      es: "comportamiento emergente"
      en: "emergent behaviour"
    definition:
      es: "Comportamiento o patrón del sistema que surge de las interacciones entre sus elementos y de la forma en que están organizados, y que no puede explicarse adecuadamente considerando esos elementos de manera aislada. Aunque puede resultar difícil de anticipar a partir de las características de cada elemento, no es necesariamente imprevisible ni inexplicable."
      en: "System behaviour or a pattern that arises from interactions among its elements and the way they are organised, and that cannot be adequately explained by considering those elements in isolation. Although it may be difficult to anticipate from the characteristics of individual elements, it is not necessarily unpredictable or inexplicable."
    related_terms: []
    status: draft
    notes: "Chapter 1. Do not use as a synonym for system behaviour in general."

  - term_id: TV-TERM-007
    concept: system_capability
    preferred:
      es: "capacidad del sistema"
      en: "system capability"
    definition:
      es: "Aptitud del sistema, considerado como conjunto, para realizar una acción o alcanzar un resultado bajo determinadas condiciones. Esta capacidad depende de la combinación y coordinación de sus recursos, competencias, relaciones y condiciones operativas. Que exista una capacidad no implica que esté siempre disponible o pueda ejercerse efectivamente en cualquier situación."
      en: "The ability of the system, considered as a whole, to perform an action or achieve an outcome under specified conditions. This capability depends on the combination and coordination of its resources, competencies, relationships and operating conditions. The existence of a capability does not mean that it is always available or can be exercised effectively in every situation."
    related_terms: []
    status: draft
    notes: "Chapter 1. Distinguish system capability from an individual competence, a resource and a component's nominal capacity."

  - term_id: TV-TERM-008
    concept: dependency
    preferred:
      es: "dependencia"
      en: "dependency"
    definition:
      es: "Relación en la que el funcionamiento, la disponibilidad o la capacidad de un elemento, proceso o sistema para alcanzar un resultado está condicionada por una condición, recurso, capacidad o contribución de otro elemento, proceso o sistema. La dependencia puede ser total o parcial, crítica o sustituible, y no implica necesariamente una relación recíproca."
      en: "A relationship in which the operation, availability or ability of an element, process or system to achieve an outcome is conditioned by a condition, resource, capability or contribution from another element, process or system. The dependency may be total or partial, critical or substitutable, and does not necessarily imply a reciprocal relationship."
    related_terms: [TV-TERM-007]
    status: draft
    notes: "Chapter 1. More specific than a generic relationship; do not treat every relationship as a dependency."

  - term_id: TV-TERM-009
    concept: feedback_loop
    preferred:
      es: "bucle de realimentación"
      en: "feedback loop"
    definition:
      es: "Estructura de relaciones causales cerrada en la que los efectos de un proceso, directa o indirectamente, vuelven a influir en las condiciones o procesos que contribuyeron a generarlos, afectando así al comportamiento posterior del sistema. Los bucles de realimentación pueden ser reforzadores, cuando amplifican una tendencia o cambio, o compensadores, cuando contrarrestan una desviación o contribuyen a regular una variable. Estas denominaciones describen el comportamiento del bucle, no su carácter beneficioso o perjudicial."
      en: "A closed structure of causal relationships in which the effects of a process, directly or indirectly, feed back to influence the conditions or processes that contributed to generating them, thereby affecting the subsequent behaviour of the system. Feedback loops may be reinforcing, when they amplify a trend or change, or balancing, when they counteract a deviation or contribute to regulating a variable. These terms describe the behaviour of the loop, not whether it is beneficial or harmful."
    related_terms: [TV-TERM-006]
    status: draft
    notes: "Chapter 1. A return arrow alone does not establish a feedback loop; loops may reinforce or counteract change."

  - term_id: TV-TERM-010
    concept: assumption
    preferred:
      es: "supuesto"
      en: "assumption"
    definition:
      es: "Proposición adoptada explícitamente como válida para construir, utilizar o interpretar una descripción, análisis o modelo, aunque su validez no haya sido establecida como un hecho para ese propósito. Los supuestos delimitan las condiciones bajo las que se desarrolla el trabajo y pueden revisarse cuando cambia la información disponible o se cuestiona su validez."
      en: "A proposition explicitly adopted as valid for constructing, using or interpreting a description, analysis or model, even though its validity has not been established as fact for that purpose. Assumptions define the conditions under which the work is carried out and may be revised when available information changes or their validity is questioned."
    related_terms: [TV-TERM-011]
    status: draft
    notes: "Chapter 1. A measured, estimated or specified input or parameter is not automatically an assumption; distinguish assumptions from quantified uncertainty."

  - term_id: TV-TERM-011
    concept: deliberate_omission
    preferred:
      es: "omisión deliberada"
      en: "deliberate omission"
    definition:
      es: "Exclusión consciente de un elemento, relación, proceso o aspecto conocido o reconocido de una descripción, análisis o modelo, en función de su propósito, alcance, nivel de detalle o criterio de simplificación. La omisión puede justificarse por las necesidades del trabajo, pero no implica que el aspecto excluido no exista o carezca de efectos sobre el sistema. Cuando pueda afectar a la interpretación de los resultados, debe hacerse explícita."
      en: "The deliberate exclusion of a known or recognised element, relationship, process or aspect from a description, analysis or model, according to its purpose, scope, level of detail or simplification criterion. The omission may be justified by the needs of the work, but it does not imply that the excluded aspect does not exist or has no effects on the system. Where it may affect the interpretation of results, it should be made explicit."
    related_terms: [TV-TERM-010]
    status: draft
    notes: "Chapter 1. Distinguish from information that is unknown, unavailable or not yet examined; absence from a model does not establish non-existence."

  - term_id: TV-TERM-012
    concept: constraint
    preferred:
      es: "restricción"
      en: "constraint"
    definition:
      es: "Condición, límite o regla que reduce las alternativas disponibles o limita el rendimiento o los resultados que pueden alcanzarse en una situación determinada."
      en: "A condition, limit or rule that reduces the available alternatives or constrains the performance or outcomes that can be achieved in a given situation."
    related_terms: [TV-TERM-013, TV-TERM-014, TV-TERM-015, TV-TERM-016]
    status: draft
    notes: "Chapter 1. A constraint is not necessarily the dominant limiting factor or a bottleneck."

  - term_id: TV-TERM-013
    concept: bottleneck
    preferred:
      es: "cuello de botella"
      en: "bottleneck"
    definition:
      es: "Elemento, capacidad o proceso cuya limitación restringe de manera significativa el rendimiento del conjunto respecto de un resultado determinado."
      en: "An element, capability or process whose limitation significantly constrains the performance of the whole in relation to a specified outcome."
    related_terms: [TV-TERM-012, TV-TERM-007]
    status: draft
    notes: "Chapter 1. A bottleneck is defined relative to a result and may shift when the system changes; not every constraint is a bottleneck."

  - term_id: TV-TERM-014
    concept: requirement
    preferred:
      es: "requisito"
      en: "requirement"
    definition:
      es: "Condición o capacidad especificada que una solución, sistema o alternativa debe satisfacer para considerarse aceptable dentro de un marco de decisión determinado."
      en: "A specified condition or capability that a solution, system or alternative must satisfy to be considered acceptable within a given decision framework."
    related_terms: [TV-TERM-015, TV-TERM-016, TV-TERM-012]
    status: draft
    notes: "Chapter 1. Whether a requirement is mandatory depends on the applicable decision framework and conditions; stronger performance elsewhere does not automatically compensate for failure to meet a mandatory requirement."

  - term_id: TV-TERM-015
    concept: performance_objective
    preferred:
      es: "objetivo de rendimiento"
      en: "performance objective"
    definition:
      es: "Resultado o nivel de rendimiento que se pretende alcanzar o mejorar y cuyo grado de consecución puede variar entre alternativas."
      en: "An outcome or level of performance that is intended to be achieved or improved and whose degree of attainment may vary across alternatives."
    related_terms: [TV-TERM-014, TV-TERM-016]
    status: draft
    notes: "Chapter 1. Distinguish from requirements that define acceptability and from preferences used to compare alternatives."

  - term_id: TV-TERM-016
    concept: preference
    preferred:
      es: "preferencia"
      en: "preference"
    definition:
      es: "Criterio o prioridad utilizado para comparar alternativas aceptables cuando difieren en atributos, resultados o compromisos, sin que por sí mismo constituya necesariamente un requisito obligatorio."
      en: "A criterion or priority used to compare acceptable alternatives when they differ in attributes, outcomes or trade-offs, without necessarily constituting a mandatory requirement in itself."
    related_terms: [TV-TERM-014, TV-TERM-015]
    status: draft
    notes: "Chapter 1. Use to compare alternatives that meet applicable mandatory requirements; preferences do not by themselves override those requirements."
